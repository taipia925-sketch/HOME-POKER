async function enterTable(t){
  db=await BASE.scope('t/'+t.id);
  S.table={id:t.id,name:t.name};S.dbReady=true;
  const onErr=e=>{toast(errMsg(e),'err')};
  db.collection('games').onSnapshot(sn=>{const o={};sn.docs.forEach(d=>{o[d.id]=d.data()});S.games=o;S.loaded.games=true;afterData()},onErr);
  db.doc('settings/table').onSnapshot(sn=>{S.cfg=sn.exists?sn.data():null;if(S.loaded.players)render()},onErr);
  S.netreq={};db.collection('netreq').onSnapshot(sn=>{const o={};sn.docs.forEach(d=>{o[d.id]=d.data()});S.netreq=o;if(S.loaded.players)render()},onErr);
  db.collection('players').onSnapshot(sn=>{const o={};sn.docs.forEach(d=>{o[d.id]=d.data()});S.players=o;S.loaded.players=true;afterData()},onErr);
  render();
}
async function doTable(){
  const t=F.tb,create=t.mode==='create',name=t.name.trim().replace(/\s+/g,' ');
  const fail=m=>{t.err=m;t.busy=false;render()};
  if(name.length<2)return fail('Il nome del tavolo deve avere almeno 2 caratteri.');
  if(t.pw.length<4)return fail('La password deve avere almeno 4 caratteri.');
  if(create&&t.pw!==t.pw2)return fail('Le due password non coincidono.');
  t.busy=true;t.err='';render();
  try{
    const id='t'+(await sha('hpltn:'+name.toLowerCase())).slice(0,20);let shown=name;
    if(create){
      const r=await BASE.rpc('hpl_create_table',{tid:id,tname:name,pw:t.pw});
      if(r==='exists')return fail('Esiste già un tavolo con questo nome: tocca Entra, oppure scegli un altro nome.');
      if(r!=='ok')return fail('Non sono riuscito a creare il tavolo, riprova.');
    }else{
      const r=await BASE.rpc('hpl_join_table',{tid:id,pw:t.pw});
      if(!r||r.status==='not_found')return fail('Nessun tavolo con questo nome. Controlla come è scritto, oppure creane uno.');
      if(r.status==='bad_password')return fail('Password errata.');
      if(r.status==='too_many')return fail('Troppi tentativi sbagliati: riprova tra qualche minuto.');
      shown=r.name;
    }
    LS.set('table',{id});LS.set('lasttb',shown);

  if(link){

async function doAcct(){
  const a=F.ac,reg=a.mode==='reg',name=a.name.trim().replace(/\s+/g,' ');
  const fail=m=>{a.err=m;a.busy=false;render()};
  if(name.length<2)return fail('Il nome utente deve avere almeno 2 caratteri.');
  if(!PIN_RE.test(a.pin))return fail('Il PIN deve avere da 4 a 6 cifre.');
  if(reg&&a.pin!==a.pin2)return fail('I due PIN non coincidono.');
  a.busy=true;a.err='';render();
  try{
    const r=await BASE.rpc(reg?'hpl_register':'hpl_login',{p_name:name,p_pin:a.pin});
    const st=r&&r.status;
    if(st==='exists')return fail('Questo nome utente esiste già: tocca Accedi, oppure scegline un altro.');
    if(st==='reserved')return fail('Questo nome utente è riservato.');
    if(st==='invalid')return fail('Controlla nome utente e PIN.');
    if(st==='not_found')return fail('Nome utente non trovato. Se è la prima volta, tocca Registrati.');
    if(st==='bad_pin')return fail('Nome utente o PIN errati.');
    if(st==='too_many')return fail('Troppi tentativi sbagliati: riprova tra qualche minuto.');
    if(st!=='ok')return fail('Non è andata, riprova.');
    await refreshMe();LS.set('hadacct',1);S.locked=false;
    F.ac={mode:null,name:'',pin:'',pin2:'',err:'',busy:false};
    toast('Ciao '+firstName(S.acct.name)+'!','ok');render();
  }catch(e){fail(errMsg(e))}
}
doTable=async function(){
  const t=F.tb,create=t.mode==='create',name=t.name.trim().replace(/\s+/g,' ');
  const fail=m=>{t.err=m;t.busy=false;render()};
  if(name.length<2)return fail('Il nome del tavolo deve avere almeno 2 caratteri.');
  if(t.pw.length<4)return fail('La password deve avere almeno 4 caratteri.');
  if(create&&t.pw!==t.pw2)return fail('Le due password non coincidono.');
  t.busy=true;t.err='';render();
  try{
    const id='t'+(await sha('hpltn:'+name.toLowerCase())).slice(0,20);let shown=name;
    const mine=(S.acct.tables||[]).find(x=>x.id===id);
    if(mine&&!create){F.tb={mode:null,name:'',pw:'',pw2:'',err:'',busy:false};F.tbOpen=false;return openTable(mine)}
    if(create){
      const r=await BASE.rpc('hpl_create_table',{tid:id,tname:name,pw:t.pw});
      if(r==='exists')return fail('Esiste già un tavolo con questo nome: tocca "Entra in un tavolo", oppure scegli un altro nome.');
      if(r!=='ok')return fail('Non sono riuscito a creare il tavolo, riprova.');

function nettingPairs(){
  const M={};
  openDebtsAll().forEach(x=>{const f=x.d.fromPlayerId,t=x.d.toPlayerId;if(!f||!t||f==='dealer'||t==='dealer'||f===t)return;const k=f<t?f+'|'+t:t+'|'+f;(M[k]=M[k]||[]).push(x)});
  return Object.entries(M).map(([k,xs])=>{
    const [a,b]=k.split('|'),ab=xs.filter(x=>x.d.fromPlayerId===a),ba=xs.filter(x=>x.d.fromPlayerId===b);
    if(!ab.length||!ba.length)return null;
    const sAB=sum(ab.map(x=>x.d.remainingAmount)),sBA=sum(ba.map(x=>x.d.remainingAmount));
    return {a,b,old:xs,sAB,sBA,net:Math.abs(sAB-sBA),from:sAB>=sBA?a:b,to:sAB>=sBA?b:a,sig:xs.map(x=>x.d.debtId+':'+x.d.remainingAmount).sort().join(',')};
  }).filter(Boolean);
}

const BLINDS=[[10,20],[15,30],[25,50],[50,100],[75,150],[100,200],[150,300],[200,400],[300,600],[400,800],[500,1000],[700,1400],[1000,2000],[1500,3000],[2000,4000],[3000,6000],[5000,10000],[7500,15000],[10000,20000]];

const payLabel=k=>({1:'Vince tutto',2:'70 / 30',3:'50 / 30 / 20',4:'45 / 27 / 18 / 10'})[k];
function tourLevels(startChips){const f=Math.max(1,Math.round((startChips||2000)/2000));return BLINDS.map(([s,b])=>[s*f,b*f])}
function tourClock(g){
  const t=g.tour||{},ms=(t.mins||15)*60000,now=Date.now();
  if(!t.startedAt)return {started:false,paused:false,level:0,left:ms,ms,frac:0,lv:t.levels||tourLevels(g.chipsPerBuyIn)};
  const el=Math.max(0,(t.pausedAt||now)-t.startedAt-(t.pausedMs||0)+(t.shiftMs||0));
  const lv=t.levels||tourLevels(g.chipsPerBuyIn),level=Math.min(lv.length-1,Math.floor(el/ms)),into=el-level*ms;
  return {started:true,paused:!!t.pausedAt,level,left:Math.max(0,ms-into),ms,frac:Math.min(1,into/ms),lv};
}
const mmss=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const bl=v=>v?v.toLocaleString('it-IT'):'—';
function tourPrizes(g){
  const pot=grossOf(g)-(g.dealerChips||0),pct=(g.tour&&g.tour.payouts)||[100];
  const pr=pct.map(p=>Math.floor(pot*p/100));pr[0]+=pot-sum(pr);return {pot,pr,pct};
}
function tourResult(g){
  const L=plist(g),inn=L.filter(p=>!p.out);
  if(inn.length!==1||L.length<2)return {ok:false};
  const {pot,pr}=tourPrizes(g),pos=p=>p.out||1;
  const rows=L.map(p=>({p,pos:pos(p),prize:pr[pos(p)-1]||0,inv:inv(p)})).sort((a,b)=>a.pos-b.pos);
  const nets=rows.map(r=>({name:r.p.playerName,pid:r.p.playerId,net:r.prize-r.inv}));
  return {ok:true,pot,rows,nets,tx:settle(nets)};
}

const pushSupported=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window&&/^https:/.test(location.protocol);

/* =====================================================================
   Motore Texas Hold'em (no-limit) — usato dal server (Edge Function) e,
   per la sola valutazione della mano, dall'app.
   Stato pubblico: niente carte coperte. Stato privato: mazzo e carte.
   Modalità: cash (fiches ricaricabili) e sng (torneo Sit & Go, bui crescenti).
   ===================================================================== */
const HE=(()=>{
const RANKS='23456789TJQKA',SUITS='shdc',NS=9,NEXT_DELAY=4000,HIST=25;
const LONELY_MS=150000,AWAY_MS=420000;
const LV=[1,1.5,2,3,4,5,6,8,10,12,15,20,25,30,40,50,60,80,100,150,200];
const rv=c=>RANKS.indexOf(c[0])+2;
const RN={11:'J',12:'Q',13:'K',14:'A'};const rn=v=>RN[v]||String(v);
function rnd(n){const a=new Uint32Array(1),lim=Math.floor(0x100000000/n)*n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n}
function newDeck(){const d=[];for(const r of RANKS)for(const s of SUITS)d.push(r+s);for(let i=d.length-1;i>0;i--){const j=rnd(i+1);const t=d[i];d[i]=d[j];d[j]=t}return d}

/* ---- valutazione: punteggio confrontabile + nome in italiano ---- */
function straightHigh(vs){const u=[...new Set(vs)].sort((a,b)=>b-a);if(u[0]===14)u.push(1);let run=1;for(let i=1;i<u.length;i++){if(u[i]===u[i-1]-1){if(++run>=5)return u[i]+4}else run=1}return 0}
function evalHand(cards){
  cards=(cards||[]).filter(Boolean);if(!cards.length)return null;
  const vals=cards.map(rv),cnt={},bySuit={};
  vals.forEach(v=>cnt[v]=(cnt[v]||0)+1);
  cards.forEach(c=>(bySuit[c[1]]=bySuit[c[1]]||[]).push(rv(c)));
  let fl=null;for(const s in bySuit)if(bySuit[s].length>=5)fl=s;
  if(fl){const sh=straightHigh(bySuit[fl]);if(sh)return {s:[8,sh],n:sh===14?'Scala reale':'Scala colore al '+rn(sh)}}
  const g=Object.keys(cnt).map(v=>[+v,cnt[v]]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
  const desc=vals.slice().sort((a,b)=>b-a);
  if(g[0][1]===4){const q=g[0][0];return {s:[7,q,desc.find(v=>v!==q)||0],n:'Poker di '+rn(q)}}
  if(g[0][1]===3&&g[1]&&g[1][1]>=2)return {s:[6,g[0][0],g[1][0]],n:'Full di '+rn(g[0][0])+' e '+rn(g[1][0])};
  if(fl){const f=bySuit[fl].sort((a,b)=>b-a).slice(0,5);return {s:[5,...f],n:'Colore al '+rn(f[0])}}
  const st=straightHigh(vals);if(st)return {s:[4,st],n:'Scala al '+rn(st)};
  if(g[0][1]===3){const t=g[0][0];return {s:[3,t,...desc.filter(v=>v!==t).slice(0,2)],n:'Tris di '+rn(t)}}
  if(g[0][1]===2&&g[1]&&g[1][1]===2){const a=g[0][0],b=g[1][0];return {s:[2,a,b,desc.find(v=>v!==a&&v!==b)||0],n:'Doppia coppia '+rn(a)+' e '+rn(b)}}
  if(g[0][1]===2){const p=g[0][0];return {s:[1,p,...desc.filter(v=>v!==p).slice(0,3)],n:'Coppia di '+rn(p)}}
  return {s:[0,...desc.slice(0,5)],n:'Carta alta '+rn(desc[0])};
}
function cmp(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0}
/* le 5 carte che formano il punto (per evidenziarle) */
function best5(cards){
  cards=(cards||[]).filter(Boolean);if(cards.length<=5){const e=evalHand(cards);return e&&Object.assign(e,{cards:cards.slice()})}
  let best=null;const n=cards.length;
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){const five=cards.filter((_,k)=>k!==a&&k!==b);if(five.length!==5)continue;const e=evalHand(five);if(!best||cmp(e.s,best.s)>0){best=Object.assign(e,{cards:five})}}
  // con 6 carte il doppio ciclo ne toglie due: rifacciamo togliendone una
  if(n===6){best=null;for(let a=0;a<n;a++){const five=cards.filter((_,k)=>k!==a);const e=evalHand(five);if(!best||cmp(e.s,best.s)>0)best=Object.assign(e,{cards:five})}}
  // il nome viene dalla mano completa (più preciso con i kicker)
  const full=evalHand(cards);if(best&&full)best.n=full.n;
  return best;
}

/* ---- stato ---- */
function initState(room){return {room:room||null,closed:false,v:0,busted:{},cfg:{sb:5,bb:10,stack:1000,turnSec:30,mode:'cash',lvlMin:8,maxRebuys:2},seats:Array(NS).fill(null),running:false,handNo:0,dealer:-1,hand:null,hist:[],sng:null}}
const E=c=>{const e=new Error(c);e.code=c;throw e};
const seatOf=(st,acct)=>st.seats.findIndex(s=>s&&s.acct===acct);
const nextIdx=(from,ok)=>{for(let k=1;k<=NS;k++){const i=((from+k)%NS+NS)%NS;if(ok(i))return i}return -1};
const handLive=st=>!!(st.hand&&st.hand.stage!=='done');
const inLive=(st,i)=>handLive(st)&&st.hand.p[i]&&!st.hand.p[i].folded;
const sngOn=st=>!!(st.cfg.mode==='sng'&&st.sng&&!st.sng.done);
function blinds(st,now){
  if(!sngOn(st))return {sb:st.cfg.sb,bb:st.cfg.bb,level:0,next:null};
  const ms=Math.max(1,st.cfg.lvlMin||8)*60000,l=Math.min(LV.length-1,Math.floor((now-st.sng.startedAt)/ms));
  return {sb:Math.max(1,Math.round(st.cfg.sb*LV[l])),bb:Math.max(2,Math.round(st.cfg.bb*LV[l])),level:l,next:l<LV.length-1?st.sng.startedAt+(l+1)*ms:null,nsb:l<LV.length-1?Math.round(st.cfg.sb*LV[l+1]):null,nbb:l<LV.length-1?Math.round(st.cfg.bb*LV[l+1]):null};
}

function sit(st,who,seat){
  if(seatOf(st,who.acct)>=0)E('already_seated');
  if(sngOn(st))E('sng_running');if(st.closed)E('room_closed');
  const mx=maxSeats(st);
  if(seat==null||seat<0)seat=st.seats.findIndex((s,i)=>!s&&i<mx);
  if(seat<0||seat>=mx)E('full');if(st.seats[seat])E('seat_taken');
  const used=(st.busted||{})[who.acct]||0,mr=rebuyMax(st);
  if(used>mr)E('no_rebuys');
  st.seats[seat]={acct:who.acct,pid:who.pid||null,name:String(who.name||'?').slice(0,24),stack:st.cfg.stack,away:false,rebuys:used};
  st.lonelyAt=null;
  return true;
}
function leave(st,priv,who,now){
  const i=seatOf(st,who.acct);if(i<0)return false;
  if(inLive(st,i)){
    const h=st.hand;
    if(h.toAct===i)apply(st,priv,i,{type:'fold'},now);
    else{h.p[i].folded=true;h.p[i].la='Fold';h.last=h.p[i].name+': fold';progress(st,priv,now,null)}
  }
  const s=st.seats[i];
  if(sngOn(st)&&!s.out){const alive=st.seats.filter(x=>x&&!x.out&&(x.stack>0||x===s)).length;st.sng.out.push({name:s.name,acct:s.acct,pos:alive});st.seats[i]=null;sngCheckEnd(st,now)}
  else st.seats[i]=null;
  if(!st.seats.some(Boolean))st.running=false;
  return true;
}
function rebuy(st,who){
  const i=seatOf(st,who.acct);if(i<0)E('not_seated');const s=st.seats[i];
  if(sngOn(st))E('sng_running');
  if(s.stack>0)E('has_chips');if(inLive(st,i))E('in_hand');
  s.stack=st.cfg.stack;s.rebuys=(s.rebuys||0)+1;s.out=false;return true;
}
function setAway(st,who,away){const i=seatOf(st,who.acct);if(i<0)E('not_seated');st.seats[i].away=!!away;return true}
function config(st,c){
  if(handLive(st))E('hand_running');if(sngOn(st))E('sng_running');
  const n=(x,lo,hi)=>{x=Math.round(+x);if(!(x>=lo&&x<=hi))E('bad_config');return x};
  const sb=n(c.sb,1,100000),bb=n(c.bb,2,200000),stack=n(c.stack,10,10000000),t=n(c.turnSec||st.cfg.turnSec,10,120);
  const mode=c.mode==='sng'?'sng':'cash',lvlMin=n(c.lvlMin||st.cfg.lvlMin||8,2,60);
  const mr=c.maxRebuys==null?(st.cfg.maxRebuys==null?2:st.cfg.maxRebuys):n(c.maxRebuys,0,99);
  if(bb<sb||stack<bb*2)E('bad_config');
  st.cfg={sb,bb,stack,turnSec:t,mode,lvlMin,maxRebuys:mr};
  if(mode==='cash')st.sng=null;
  return true;
}
function start(st,priv,now){
  if(st.cfg.mode==='sng'&&!sngOn(st)){
    const sat=st.seats.filter(Boolean);if(sat.length<2)E('need_players');
    sat.forEach(s=>{s.stack=st.cfg.stack;s.out=false;s.rebuys=0;s.away=false});
    st.sng={startedAt:now,out:[],done:false,ranking:null,players:sat.length};st.dealer=-1;st.hand=null;
  }
  st.running=true;tick(st,priv,now);return true;
}
const rebuyMax=st=>{const m=st.cfg.maxRebuys;return m==null?2:m};
const rebuysLeft=(st,acct)=>{const m=rebuyMax(st);return m>=99?99:Math.max(0,m-(((st.busted||{})[acct])||0))};
const maxSeats=st=>Math.min(NS,Math.max(2,(st.room&&st.room.maxSeats)||NS));
const eligible=st=>st.seats.map((s,i)=>s&&s.stack>0&&!s.out&&(sngOn(st)||!s.away)?i:-1).filter(i=>i>=0);

function newHand(st,priv,now){
  const el=eligible(st);if(el.length<2)return false;
  const ok=i=>el.includes(i);
  const B=blinds(st,now);
  st.handNo++;st.dealer=nextIdx(st.dealer,ok);if(st.room)st.room.started=true;
  const hu=el.length===2,sb=hu?st.dealer:nextIdx(st.dealer,ok),bb=nextIdx(sb,ok);
  const deck=newDeck(),holes={},p={};
  el.forEach(i=>{const s=st.seats[i];p[i]={name:s.name,acct:s.acct,bet:0,contrib:0,folded:false,allin:false,acted:false,la:null,start:s.stack};holes[s.acct]=[deck.pop(),deck.pop()]});
  st.hand={no:st.handNo,dealer:st.dealer,sb,bb,sbAmt:B.sb,bbAmt:B.bb,level:B.level,stage:'preflop',board:[],p,curBet:0,minRaise:B.bb,toAct:null,deadline:null,last:null,results:null,reveal:null,endedAt:null,startedAt:now};
  priv.hand=st.handNo;priv.deck=deck;priv.holes=holes;
  put(st,sb,B.sb);put(st,bb,B.bb);
  const h=st.hand;h.curBet=Math.max(h.p[sb].bet,h.p[bb].bet);
  h.last='Nuova mano';
  progress(st,priv,now,bb);
  return true;
}
function put(st,i,amt){const s=st.seats[i],P=st.hand.p[i],a=Math.max(0,Math.min(amt,s.stack));s.stack-=a;P.bet+=a;P.contrib+=a;if(s.stack===0)P.allin=true;return a}
const canAct=(h,i)=>h.p[i]&&!h.p[i].folded&&!h.p[i].allin;

function act(st,priv,who,a,now){
  const h=st.hand;if(!handLive(st))E('no_hand');
  const i=seatOf(st,who.acct);if(i<0||h.toAct!==i)E('not_your_turn');
  if(st.seats[i].away)st.seats[i].away=false;
  apply(st,priv,i,a,now);return true;
}
function apply(st,priv,i,a,now){
  const h=st.hand,P=h.p[i],S=st.seats[i],toCall=h.curBet-P.bet,nm=P.name;
  const t=a&&a.type;
  if(t==='fold'){P.folded=true;P.la='Fold';h.last=nm+': fold'}
  else if(t==='check'){if(toCall>0)E('cannot_check');P.la='Check';h.last=nm+': check'}
  else if(t==='call'){if(toCall<=0){P.la='Check';h.last=nm+': check'}else{const x=put(st,i,toCall);P.la=P.allin?'All-in':'Call';h.last=nm+(P.allin?': all-in '+P.bet:': call '+x)}}
  else if(t==='raise'||t==='allin'){
    const maxTo=P.bet+S.stack;let to=t==='allin'?maxTo:Math.round(+a.amount);
    if(!(to>0))E('bad_amount');if(to>maxTo)to=maxTo;
    if(to<=h.curBet){if(to===maxTo)return apply(st,priv,i,{type:'call'},now);E('too_small')}
    const inc=to-h.curBet;
    if(inc<h.minRaise&&to<maxTo)E('min_raise');
    const wasBet=h.curBet>0;put(st,i,to-P.bet);
    if(inc>=h.minRaise)h.minRaise=inc;
    h.curBet=to;Object.keys(h.p).forEach(k=>{if(+k!==i&&canAct(h,+k))h.p[k].acted=false});
    P.la=P.allin?'All-in':wasBet?'Raise':'Bet';
    h.last=nm+(P.allin?': all-in '+to:wasBet?': raise a '+to:': bet '+to);
  }else E('bad_action');
  P.acted=true;
  progress(st,priv,now,i);
}
function progress(st,priv,now,from){
  const h=st.hand,seats=Object.keys(h.p).map(Number);
  const alive=seats.filter(k=>!h.p[k].folded);
  if(alive.length===1)return finishUncontested(st,priv,alive[0],now);
  const start=from==null?(h.toAct==null?h.dealer:h.toAct-1):from;
  const nx=nextIdx(start,k=>canAct(h,k)&&(!h.p[k].acted||h.p[k].bet<h.curBet));
  if(nx>=0){h.toAct=nx;h.deadline=now+st.cfg.turnSec*1000;return}
  // fine del giro di puntate
  for(;;){
    seats.forEach(k=>{const P=h.p[k];P.bet=0;P.acted=false;if(!P.folded&&!P.allin)P.la=null});h.curBet=0;h.minRaise=h.bbAmt||st.cfg.bb;
    if(h.stage==='river')return showdown(st,priv,now);
    if(h.stage==='preflop'){h.board.push(priv.deck.pop(),priv.deck.pop(),priv.deck.pop());h.stage='flop'}
    else if(h.stage==='flop'){h.board.push(priv.deck.pop());h.stage='turn'}
    else{h.board.push(priv.deck.pop());h.stage='river'}
    const movers=alive.filter(k=>canAct(h,k));
    if(movers.length>=2){h.toAct=nextIdx(h.dealer,k=>canAct(h,k));h.deadline=now+st.cfg.turnSec*1000;return}
    // uno solo (o nessuno) può ancora puntare: si scoprono le carte e si gira fino al river
    if(!h.reveal){h.reveal={};alive.forEach(k=>{h.reveal[k]=priv.holes[h.p[k].acct]});h.runout=true}
    h.toAct=null;h.deadline=null;
  }
}
function payout(st,i,amt,acct){const s=st.seats[i];if(s&&s.acct===acct)s.stack+=amt}
function finishUncontested(st,priv,w,now){
  const h=st.hand,pot=Object.values(h.p).reduce((a,x)=>a+x.contrib,0);
  payout(st,w,pot,h.p[w].acct);
  h.results=[{seat:w,name:h.p[w].name,win:pot,hand:null}];h.pot=pot;
  h.stage='done';h.toAct=null;h.deadline=null;h.endedAt=now;h.last=h.p[w].name+' vince '+pot;
  endHand(st,now);
}
function showdown(st,priv,now){
  const h=st.hand,seats=Object.keys(h.p).map(Number),alive=seats.filter(k=>!h.p[k].folded);
  const ev={};alive.forEach(k=>{ev[k]=best5(priv.holes[h.p[k].acct].concat(h.board))});
  h.reveal={};alive.forEach(k=>{h.reveal[k]=priv.holes[h.p[k].acct]});
  const levels=[...new Set(alive.map(k=>h.p[k].contrib))].sort((a,b)=>a-b);
  const won={};let prev=0,dist=0;
  const order=k=>((k-h.dealer-1)%NS+NS)%NS;
  levels.forEach(L=>{
    let amt=0;seats.forEach(k=>{amt+=Math.max(0,Math.min(h.p[k].contrib,L)-prev)});
    const el=alive.filter(k=>h.p[k].contrib>=L);prev=L;if(!amt||!el.length)return;
    let best=null,ws=[];el.forEach(k=>{const c=best?cmp(ev[k].s,best):1;if(c>0){best=ev[k].s;ws=[k]}else if(c===0)ws.push(k)});
    ws.sort((a,b)=>order(a)-order(b));
    const sh=Math.floor(amt/ws.length);let rem=amt-sh*ws.length;
    ws.forEach(k=>{won[k]=(won[k]||0)+sh+(rem>0?1:0);if(rem>0)rem--});dist+=amt;
  });

const SND=(()=>{let A=null;
  const ctx=()=>{if(!A){try{A=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}try{if(A&&A.state==='suspended')A.resume()}catch(e){}return A};
  const noise=(dur,f,q,vol,t0)=>{const a=ctx();if(!a)return;const n=a.createBuffer(1,Math.max(1,Math.floor(a.sampleRate*dur)),a.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);const s=a.createBufferSource();s.buffer=n;const b=a.createBiquadFilter();b.type='bandpass';b.frequency.value=f;b.Q.value=q;const g=a.createGain();g.gain.value=vol;s.connect(b).connect(g).connect(a.destination);s.start(a.currentTime+(t0||0))};
  const tone=(fr,dur,vol,t0,type)=>{const a=ctx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=fr;const t=a.currentTime+(t0||0);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.03)};
  const on=()=>S.vt.sound!==false&&!document.hidden;
  return {
    chip(n){if(!on())return;for(let k=0;k<(n||3);k++)noise(.045,2900+Math.random()*1200,7,.55,k*.04)},
    card(t){if(on())noise(.08,2200,.7,.32,t||0)},
    check(){if(on()){tone(160,.08,.3,0,'triangle');tone(160,.08,.26,.11,'triangle')}},
    fold(){if(on())noise(.14,700,.5,.22)},
    turn(){if(on()){tone(784,.16,.16);tone(1175,.26,.13,.11)}try{navigator.vibrate&&navigator.vibrate([50,40,50])}catch(e){}},
    win(){if(on())[523,659,784,1047].forEach((f,k)=>tone(f,.3,.14,k*.085,'triangle'))},
    unlock(){ctx()}
  };
})();

function fxFly(fromEl,toEl,html,cls,delay,dur){
  const fx=$$id('v2-fx');if(!fx||!fromEl||!toEl)return;
  const a=relRect(fromEl),b=relRect(toEl);
  const d=document.createElement('div');d.className='v2-fly '+(cls||'');d.innerHTML=html;
  const ax=a.x+a.w/2,ay=a.y+a.h/2,bx=b.x+b.w/2,by=b.y+b.h/2;
  d.style.left=ax+'px';d.style.top=ay+'px';d.style.transitionDuration=(dur||420)+'ms';d.style.transitionDelay=(delay||0)+'ms';
  fx.appendChild(d);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{d.style.transform=`translate(${bx-ax}px,${by-ay}px)`;d.classList.add('go')}));
  setTimeout(()=>d.remove(),(delay||0)+(dur||420)+80);
}
function vtAnimate(prev,st,me){
  if(!st||!st.hand||!prev)return;
  const h=st.hand,ph=prev.hand;
  const potEl=$$id('v2-pot');
  // nuova mano: le carte volano dal centro ai posti
  if(!ph||ph.no!==h.no){
    const center=$$id('v2-c2'),order=Object.keys(h.dealOrder||{});
    let k=0,i=h.dealer;const seq=[];for(let n=0;n<9;n++){i=(i+1)%9;if(h.p[i])seq.push(i)}
    [0,1].forEach(r=>seq.forEach(s=>{const to=$$id('vs'+s).querySelector(s===me?'.st-plate':'.st-cards');fxFly(center,to,cardHTML(null,'s'),'card',(r*seq.length+k%seq.length)*110,380);k++}));
    for(let n=0;n<seq.length*2;n++)SND.card(n*.11);
    // i bui
    [h.sb,h.bb].forEach(s=>{if(h.p[s]&&h.p[s].bet)bump('vb'+s)});
    return;
  }
  // puntate cresciute
  let chips=0;Object.keys(h.p).forEach(k=>{const a=(ph.p[k]&&ph.p[k].bet)||0,b=h.p[k].bet||0;if(b>a&&h.stage===ph.stage){chips++;bump('vb'+k)}});
  if(chips)SND.chip(3);
  // ultima mossa: lascia/passa
  Object.keys(h.p).forEach(k=>{const a=ph.p[k]&&ph.p[k].la,b=h.p[k].la;if(b!==a){if(b==='Lascia'){SND.fold();if(+k!==me){const from=$$id('vs'+k);fxFly(from&&from.querySelector('.st-av'),$$id('v2-c2'),`<span class="st-cc">${cardHTML(null,'s')}${cardHTML(null,'s')}</span>`,'muck',0,420)}}else if(b==='Passa')SND.check()}});
  // fine del giro: le puntate vanno nel piatto
  if(ph.stage!==h.stage){
    let n=0;Object.keys(ph.p).forEach(k=>{const b=ph.p[k].bet||0;if(b>0){fxFly($$id('vb'+k),potEl,`<span class="chips">${chipStack(b)}</span>`,'chip',n*40,420);n++}});
    if(n)SND.chip(4);
  }
  // fine mano: il piatto va ai vincitori
  if(ph.stage!=='done'&&h.stage==='done'&&h.results){
    const W=h.results.filter(r=>r.win>0);
    W.forEach((r,j)=>{const to=$$id('vs'+r.seat);fxFly(potEl,to,`<span class="chips">${chipStack(r.win)}</span>`,'chip big',(h.reveal?900:350)+j*120,560)});
    setTimeout(()=>{W.some(r=>r.seat===me)?SND.win():SND.chip(5)},(h.reveal?900:350)+400);
  }
}
function bump(id){const el=$$id(id);if(!el)return;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}

/* ---------- pre-azioni ---------- */
function vtPreFire(st,me){
  const pre=F.vt.pre;if(!pre||!st||!st.hand)return;
  const h=st.hand;
  if(h.no!==pre.no||h.stage!==pre.stage||h.stage==='done'){F.vt.pre=null;return}
  if(h.toAct!==me||S.vt.busy)return;
  const P=h.p[me],toCall=Math.max(0,h.curBet-P.bet);
  let move=null;
  if(pre.k==='cf')move=toCall?'fold':'check';
  else if(pre.k==='ck')move=toCall?null:'check';
  else if(pre.k==='cl')move=h.curBet===pre.bet?(toCall?'call':'check'):null;
  else if(pre.k==='ca')move=toCall?'call':'check';
  F.vt.pre=null;
  if(move)setTimeout(()=>vtDo('act',{move:{type:move}}),250);else vtPaint();
}

const _vtApplyR=vtApply;
vtApply=function(st){
  if(!st||!st.room||!st.room.id)return;const rid=st.room.id;
  const cur=S.vt.rooms[rid];if(!cur||(st.v||0)>=(cur.v||0))S.vt.rooms[rid]=st;
  if(rid!==S.vt.rid){if(V.name==='vlobby'||V.name==='mode')render();return}
  if(S.vt.optPending&&S.vt.st&&(st.v||0)>(S.vt.st.v||0))S.vt.optPending=false;
  _vtApplyR(st);
};
function vtRoomGone(rid){
  const last=S.vt.rooms[rid];delete S.vt.rooms[rid];
  if(rid===S.vt.rid){const st=S.vt.st||last;if(st){st.closed=true;S.vt.gone=st}if(V.name==='vt')render()}
  else if(V.name==='vlobby'||V.name==='mode')render();
}
vtLoad=async function(){
  if(!S.table||!BASE)return;const tid=S.table.id;
  try{
    const {data,error}=await BASE.sb.from('hpl_vr').select('room_id,state').eq('table_id',tid);
    if(error){if(/hpl_vr|relation|schema cache|does not exist/i.test(error.message||'')){S.vt.missing=true;if(['vt','vlobby','mode'].includes(V.name))render()}return}
    if(!S.table||S.table.id!==tid)return;
    S.vt.missing=false;S.vt.roomsLoaded=true;
    const seen={};(data||[]).forEach(r=>{seen[r.room_id]=1;vtApply(r.state)});
    Object.keys(S.vt.rooms).forEach(k=>{if(!seen[k])vtRoomGone(k)});
    if(S.vt.wantRid){const w=S.vt.wantRid;S.vt.wantRid=null;if(S.vt.rooms[w])vtOpenRoom(w);else toast('Quel tavolo virtuale non esiste più','err')}
    if(V.name==='vlobby'||V.name==='mode')render();
  }catch(e){}
};
vtSubscribe=function(){
  if(S.vt.ch||!S.table||!BASE)return;const tid=S.table.id;
  try{S.vt.ch=BASE.sb.channel('vr-'+tid).on('postgres_changes',{event:'*',schema:'public',table:'hpl_vr',filter:'table_id=eq.'+tid},pl=>{
    if(!S.table||S.table.id!==tid)return;
    if(pl.eventType==='DELETE'){const r=pl.old&&pl.old.room_id;if(r)vtRoomGone(r)}
    else if(pl.new&&pl.new.state)vtApply(pl.new.state);
  }).subscribe()}catch(e){}
  vtLoad();
};

/* ---------- mosse istantanee (si vedono subito, poi conferma il server) ---------- */
function vtOpt(move){
  const st=S.vt.st,me=vtSeat();if(!st||!st.hand||st.hand.stage==='done'||st.hand.toAct!==me)return null;
  const prev=JSON.parse(JSON.stringify(st)),n=JSON.parse(JSON.stringify(st)),h=n.hand,P=h.p[me],s=n.seats[me],toCall=Math.max(0,h.curBet-P.bet);
  if(move.type==='fold'){P.folded=true;P.la='Lascia'}
  else if(move.type==='check'){if(toCall>0)return null;P.la='Passa'}
  else if(move.type==='call'){const a=Math.min(toCall,s.stack);P.bet+=a;P.contrib+=a;s.stack-=a;P.la=s.stack?'Chiama':'All-in'}
  else{const to=move.type==='allin'?P.bet+s.stack:Math.min(+move.amount,P.bet+s.stack);if(!(to>h.curBet))return null;const a=to-P.bet;P.bet=to;P.contrib+=a;s.stack-=a;P.la=s.stack?(h.curBet?'Rilancia':'Punta'):'All-in';h.curBet=to}
  h.toAct=null;S.vt.st=n;S.vt.optPending=true;F.vt.raise=null;render();
  return prev;
}
function vtMove(move){
  const prev=vtOpt(move);
  return vtDo('act',{move}).then(r=>{S.vt.optPending=false;if(!r&&prev&&S.vt.st&&S.vt.st.v===prev.v){S.vt.st=prev;S.vt.painted=prev;render()}return r});
}

/* ---------- lobby ---------- */
function roomStatus(st){
  const n=st.seats.filter(Boolean).length,ms=HE.maxSeats(st);
  if(st.closed)return ['Finito','done'];
  if(HE.sngOn(st)){const b=HE.blinds(st,vtNow());return ['Livello '+(b.level+1),'live']}
  if(st.hand&&st.hand.stage!=='done'||st.running)return ['In corso','live'];
  return n<2?['Cerca giocatori','wait']:n>=ms?['Pieno','wait']:['Pronto','wait'];
}
function vLobby(){
  const acct=myAcct();
  const R=Object.values(S.vt.rooms).filter(st=>!st.closed||st.seats.some(x=>x&&x.acct===acct)).sort((a,b)=>{
    const ma=a.seats.some(x=>x&&x.acct===acct),mb=b.seats.some(x=>x&&x.acct===acct);if(ma!==mb)return mb-ma;
    return ((b.room&&b.room.createdAt)||0)-((a.room&&a.room.createdAt)||0)});

const vtBusted=st=>(st&&st.busted&&myAcct()&&st.busted[myAcct()])||0;

ctlHtml=function(st,me){
  if(!st)return `<button class="btn" data-act="vtsit" data-seat="-1">Siediti al tavolo</button>`;
  if(st.closed)return `<button class="btn" data-act="vtlobby">Torna alla lobby</button>`;
  if(S.vt.optPending&&st.hand&&st.hand.toAct==null&&st.hand.stage!=='done')return `<div class="v2-turn wide"><span class="mut">Fatto</span></div>`;
  const h=st.hand,live=vtLive(),s=me>=0&&st.seats[me],P=h&&me>=0&&h.p[me];
  /* non sei seduto */
  if(me<0){
    const was=vtBusted(st),left=vtLeft(st),free=st.seats.some((x,i)=>!x&&i<HE.maxSeats(st));
    if(HE.sngOn(st))return `<div class="v2-wait">Torneo in corso: puoi guardare, oppure apri un altro tavolo dalla lobby</div>`;
    if(was&&!left)return `<div class="v2-away"><span>Hai finito le ${was===1?'fiches e la ricarica':'ricariche'} su questo tavolo.</span><button class="btn ghost" data-act="vtlobby">Apri un altro tavolo</button></div>`;
    if(!free)return `<div class="v2-wait">Il tavolo è pieno: guardi la partita</div>`;
    return `<button class="btn v2-start" data-act="vtsit" data-seat="-1">${was?`Rientra con ${fchip(st.cfg.stack)} fiches`:'Siediti al tavolo'}${was&&left<99?` · ${left} ricaric${left===1?'a':'he'}`:''}</button>`;
  }
  if(s.away)return `<div class="v2-away"><span>Sei in pausa: le tue mani vengono saltate${HE.sngOn(st)?' (i bui li paghi lo stesso)':''}.</span><button class="btn" data-act="vtback">Torno a giocare</button></div>`;
  /* tocca a te */
  if(live&&h.toAct===me){
    const toCall=Math.max(0,h.curBet-P.bet),maxTo=P.bet+s.stack,bb=h.bbAmt||st.cfg.bb,minTo=Math.min(maxTo,h.curBet>0?h.curBet+h.minRaise:bb),canRaise=s.stack>toCall;
    const tbar=`<div class="v2-tbar" data-dl="${h.deadline}"><i></i><span class="tsec"></span></div>`;

   Musichetta da poker: jazz lounge generato dall'app (nessun file da
   scaricare). Si accende e si spegne dalle impostazioni del tavolo.
   ===================================================================== */

S.vt.music=LS.get('vtmusic',true);
const MUS=(()=>{
  let A=null,g=null,timer=null,step=0,next=0,duck=0;
  const BPM=94,BEAT=60/BPM,BAR=BEAT*4;
  const f=m=>440*Math.pow(2,(m-69)/12);
  /* ii - V - I - VI in Fa maggiore, giro di quattro battute */
  const PROG=[
    {bass:[43,50,55,53],ch:[58,62,65]},   // Gm7
    {bass:[48,55,52,50],ch:[52,55,58,64]},// C7
    {bass:[41,48,45,43],ch:[57,60,64]},   // FM7
    {bass:[38,45,41,40],ch:[57,60,62]}    // Dm7 -> ritorno
  ];
  function ctx(){
    if(!A){try{A=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}
      g=A.createGain();g.gain.value=0;
      const lp=A.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;
      g.connect(lp).connect(A.destination);
    }
    try{if(A.state==='suspended')A.resume()}catch(e){}
    return A;
  }
  const vol=()=>S.vt.music===false?0:(Date.now()<duck?.016:.05);
  function note(t,fr,dur,v,type,det){
    const o=A.createOscillator(),n=A.createGain();
    o.type=type||'sine';o.frequency.value=fr;if(det)o.detune.value=det;
    n.gain.setValueAtTime(.0001,t);
    n.gain.exponentialRampToValueAtTime(Math.max(.0002,v),t+.02);
    n.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(n).connect(g);o.start(t);o.stop(t+dur+.05);
  }
  function brush(t,v){
    const len=Math.floor(A.sampleRate*.09),b=A.createBuffer(1,len,A.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);
    const s=A.createBufferSource();s.buffer=b;
    const bp=A.createBiquadFilter();bp.type='bandpass';bp.frequency.value=5200;bp.Q.value=.8;
    const n=A.createGain();n.gain.value=v;
    s.connect(bp).connect(n).connect(g);s.start(t);
  }
  function schedule(){
    if(!A)return;
    g.gain.setTargetAtTime(vol(),A.currentTime,.4);
    while(next<A.currentTime+.6){
      const bar=PROG[(step>>2)%4],beat=step%4,t=next;
      note(t,f(bar.bass[beat]),BEAT*.9,.5,'triangle');                     // basso che cammina
      if(beat===0||beat===2)bar.ch.forEach((m,k)=>note(t+(beat===2?.06:0)+k*.012,f(m),BEAT*1.5,.11,'sine',k===1?5:-4)); // accordi morbidi
      if(beat===1||beat===3)brush(t,.09);                                   // spazzole
      brush(t+BEAT*.5,.035);
      next+=BEAT;step++;
    }
  }
  return {
    on(){
      if(S.vt.music===false)return;
      if(!ctx())return;
      if(next<A.currentTime)next=A.currentTime+.08;
      if(!timer)timer=setInterval(schedule,200);
      schedule();
    },
    off(){if(timer){clearInterval(timer);timer=null}if(g&&A)g.gain.setTargetAtTime(0,A.currentTime,.25)},
    duck(ms){duck=Date.now()+(ms||1400)}
  };
})();

/* ===== Aggiornamento automatico (anche per l'app installata sul telefono) ===== */
const APP_VERSION='1791834915675';
let updShown=false;
async function checkUpdate(){
  if(updShown||!/^https?:/.test(location.protocol))return;
  try{
    const r=await fetch(location.pathname+'?vcheck='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=(await r.text()).match(/const APP_VERSION='(\d+)'/);
    if(!m||m[1]===APP_VERSION)return;
    updShown=true;const nv=m[1];
    const go=()=>location.replace(location.pathname+'?v='+nv+location.hash);
    if(!S.me&&!SH){go();return}
    const el=document.createElement('div');el.className='upd';
    el.innerHTML='<span>È disponibile una nuova versione</span><button type="button">Aggiorna</button>';
    el.querySelector('button').onclick=go;document.body.appendChild(el);
  }catch(e){}
}
setTimeout(checkUpdate,2500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
setInterval(checkUpdate,15*60*1000);

/* ===== Avvio ===== */
(async function start(){
  render();
  if(SB_URL.indexOf('__')===0){S.dbReady=false;render();return}
  try{BASE=await makeBase()}catch(e){console.error(e);window.__dbErr=(e&&(e.message||e.details||e.code))||String(e);S.dbReady=false;render();return}
  S.dbReady=true;S.baseReady=true;
  bioSupport().then(v=>{S.bioOk=v;if(SH)render()});
  try{await refreshMe()}catch(e){console.error(e);window.__dbErr=(e&&(e.message||e.details||e.code))||String(e);S.dbReady=false;render();return}
  if(S.acct){LS.set('hadacct',1);S.locked=!!acctBio()}
  render();
})();
</script>
