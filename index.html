<script>
/*PURE-START*/
const sum=a=>a.reduce((x,y)=>x+y,0);
const p2=n=>String(n).padStart(2,'0');
const nid=p=>p+'_'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const nf=new Intl.NumberFormat('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur=c=>nf.format(c/100)+' €';
const sgn=c=>(c>0?'+':c<0?'−':'')+nf.format(Math.abs(c)/100)+' €';
const fch=n=>Math.round(n).toLocaleString('it-IT');
function parseEur(s){s=String(s==null?'':s).trim().replace(/\s|€/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return isFinite(n)&&n>=0?Math.round(n*100):NaN}
function parseCh(s){s=String(s==null?'':s).replace(/[\s.]/g,'');if(!s)return NaN;const n=Number(s);return isFinite(n)&&n>=0?Math.round(n):NaN}
const toEuro=(chips,g)=>Math.round(chips*g.buyInCents/g.chipsPerBuyIn);
const toChips=(c,g)=>Math.round(c*g.chipsPerBuyIn/g.buyInCents);
const dShort=iso=>{const d=new Date(iso);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()};
const tHM=iso=>{const d=new Date(iso);return p2(d.getHours())+':'+p2(d.getMinutes())};
const dLong=iso=>new Date(iso).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const plist=g=>Object.values(g.players||{}).sort((a,b)=>a.seq-b.seq);
const inv=p=>sum(p.buyIns.map(b=>b.amountCents));
const safeOf=p=>sum((p.cashOuts||[]).map(c=>c.amountCents));
const pendOf=p=>sum(p.buyIns.filter(b=>b.paymentStatus==='PENDING').map(b=>b.amountCents));
const grossOf=g=>sum(plist(g).map(inv));
const netPot=g=>grossOf(g)-(g.dealerChips||0);

function settle(nets){
  const d=nets.filter(x=>x.net<0).map(x=>({n:x.name,id:x.pid||null,a:-x.net})).sort((a,b)=>b.a-a.a);
  const c=nets.filter(x=>x.net>0).map(x=>({n:x.name,id:x.pid||null,a:x.net})).sort((a,b)=>b.a-a.a);
  const out=[];let i=0,j=0;
  while(i<d.length&&j<c.length){const m=Math.min(d[i].a,c[j].a);out.push({from:d[i].n,to:c[j].n,fromId:d[i].id,toId:c[j].id,amt:m});d[i].a-=m;c[j].a-=m;if(d[i].a===0)i++;if(c[j].a===0)j++}
  return out;
}
function calcClose(g,cl){
  const L=plist(g);
  const dealer=String(cl.dealer||'').trim()===''?0:parseEur(cl.dealer);
  const rows=L.map(p=>{
    const v=cl.vals[p.playerId]||{mode:'chips',v:''};
    let counted=NaN;
    if(String(v.v||'')!==''){counted=v.mode==='chips'?toEuro(parseCh(v.v),g):parseEur(v.v)}
    const s=safeOf(p);
    return {p,counted,s,fin:counted+s,inv:inv(p)};
  });
  if(isNaN(dealer)||rows.some(r=>isNaN(r.counted)))return {ok:false,rows,dealer};
  const totIn=sum(rows.map(r=>r.inv)),totFin=sum(rows.map(r=>r.fin));
  const bal=totIn-dealer-totFin;
  const adj=rows.map(()=>0);
  if(bal!==0){
    let idx=rows.map((_,i)=>i);
    if(bal<0&&cl.holeMode==='split_winners'){const w=idx.filter(i=>rows[i].fin-rows[i].inv>0);if(w.length)idx=w}
    const n=idx.length,base=Math.trunc(bal/n),rem=bal-base*n;
    idx.forEach(i=>{adj[i]=base});
    const step=rem>0?1:-1;
    for(let k=0;k<Math.abs(rem);k++)adj[idx[k]]+=step;
  }
  const nets=rows.map((r,i)=>({name:r.p.playerName,pid:r.p.playerId,net:r.fin-r.inv+adj[i],fin:r.fin,inv:r.inv}));
  if(dealer>0)nets.push({name:'Dealer',pid:'dealer',net:dealer,dealer:true});
  const sumNet=sum(nets.map(x=>x.net));
  return {ok:true,rows,dealer,totIn,totFin,bal,nets,sumNet,tx:settle(nets)};
}
function recompute(d){
  d.paidAmount=sum(d.transactions.filter(t=>t.status==='PAID').map(t=>t.amount));
  d.remainingAmount=sum(d.transactions.filter(t=>t.status==='PENDING').map(t=>t.amount));
}
function dPayFull(d,sid,now){const t=d.transactions.find(x=>x.subId===sid);if(!t||t.status!=='PENDING')return false;t.status='PAID';t.lastUpdated=now;recompute(d);return true}
function dPartial(d,sid,amt,now){
  const i=d.transactions.findIndex(x=>x.subId===sid),t=d.transactions[i];
  if(!t||t.status!=='PENDING'||!(amt>0))return false;
  if(amt>=t.amount)return dPayFull(d,sid,now);
  d.transactions.splice(i,1,{subId:nid('s'),amount:amt,status:'PAID',lastUpdated:now},{subId:nid('s'),amount:t.amount-amt,status:'PENDING',lastUpdated:now});
  recompute(d);return true;
}
function dModify(d,sid,newAmt,now){
  const i=d.transactions.findIndex(x=>x.subId===sid),t=d.transactions[i];
  if(!t||t.status!=='PAID'||!(newAmt>0))return false;
  const diff=newAmt-t.amount;if(diff===0)return false;
  const pi=d.transactions.findIndex(x=>x.status==='PENDING');
  if(diff>0){
    if(pi<0||diff>d.transactions[pi].amount)return false;
    const p=d.transactions[pi];p.amount-=diff;p.lastUpdated=now;
    if(p.amount===0)d.transactions.splice(pi,1);
  }else{
    if(pi>=0){const p=d.transactions[pi];p.amount-=diff;p.lastUpdated=now}
    else d.transactions.splice(i+1,0,{subId:nid('s'),amount:-diff,status:'PENDING',lastUpdated:now});
  }
  t.amount=newAmt;t.lastUpdated=now;recompute(d);return true;
}
function dRestore(d,sid,now){
  const i=d.transactions.findIndex(x=>x.subId===sid),t=d.transactions[i];
  if(!t||t.status!=='PAID')return false;
  const pi=d.transactions.findIndex(x=>x.status==='PENDING');
  if(pi>=0){const p=d.transactions[pi];p.amount+=t.amount;p.lastUpdated=now;d.transactions.splice(i,1)}
  else{t.status='PENDING';t.lastUpdated=now}
  recompute(d);return true;
}
/*PURE-END*/

async function sha(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'x'+(h>>>0).toString(16)}
}

const S={me:LS.get('me',null),games:{},players:{},res:[],cfg:null,loaded:{games:false,players:false,cfg:true},table:null,baseReady:false,bioOk:false,admin:{},reqHash:null,dbReady:undefined,booted:false,resGid:null,unsubRes:null};

const wq={};
function saveGame(gid,fn,undoMsg){
  const prev=wq[gid]||Promise.resolve();
  const next=prev.then(async()=>{
    const cur=S.games[gid];if(!cur)throw new Error('Partita non trovata');
    const g=JSON.parse(JSON.stringify(cur));
    if(fn(g)===false)return false;
    g.rev=(cur.rev||0)+1;
    let entry=null;
    if(undoMsg){
      const ch=diffGame(cur,g);
      if(ch.length){entry={id:nid('h'),at:new Date().toISOString(),by:S.me?S.me.name:'',msg:typeof undoMsg==='function'?undoMsg():undoMsg,ch};g.hist=(g.hist||[]).concat([entry]).slice(-80)}
    }
    await db.doc('games/'+gid).set(g);
    S.games[gid]=g;render();
    if(entry)toastUndo(entry.msg,()=>undoEntry(gid,entry.id));
    return true;
  }).catch(e=>{toast(errMsg(e),'err');return false});
  wq[gid]=next;return next;
}
function openStuffFor(id,name){
  const lk=String(name).toLowerCase();
  const live=Object.values(S.games).some(g=>g.status==='live'&&Object.values(g.players||{}).some(p=>p.playerId===id));
  let get=0,give=0;
  Object.values(S.games).forEach(g=>(g.debts||[]).forEach(d=>{if(!(d.remainingAmount>0))return;
    if(d.fromPlayerId?d.fromPlayerId===id:String(d.fromPlayerName).toLowerCase()===lk)give+=d.remainingAmount;
    if(d.toPlayerId?d.toPlayerId===id:String(d.toPlayerName).toLowerCase()===lk)get+=d.remainingAmount;}));
  const w=[];if(live)w.push('è seduto a una partita in corso');if(get)w.push('deve ancora riscuotere '+eur(get));if(give)w.push('deve ancora dare '+eur(give));
  return w;
}
function myOpenStuff(){
  if(!S.me)return '';const w=openStuffFor(S.me.id,S.me.name).map(x=>x.replace('è seduto','sei seduto').replace('deve ancora','devi ancora'));
  return w.length?'Non puoi eliminare il profilo adesso: '+w.join(', ')+'.':'';
}
/* --- Cronologia: ogni modifica si può annullare anche dopo --- */
function diffGame(a,b){
  const ch=[],J=JSON.stringify,pa=a.players||{},pb=b.players||{};
  new Set([...Object.keys(pa),...Object.keys(pb)]).forEach(k=>{const x=pa[k]||null,y=pb[k]||null;if(J(x)!==J(y))ch.push({k:'p:'+k,b:x,a:y})});
  const da={},dbb={};(a.debts||[]).forEach(d=>da[d.debtId]=d);(b.debts||[]).forEach(d=>dbb[d.debtId]=d);
  new Set([...Object.keys(da),...Object.keys(dbb)]).forEach(k=>{const x=da[k]||null,y=dbb[k]||null;if(J(x)!==J(y))ch.push({k:'d:'+k,b:x,a:y})});
  return ch;
}
const hGet=(g,k)=>{const id=k.slice(2);return k[0]==='p'?((g.players||{})[id]||null):((g.debts||[]).find(d=>d.debtId===id)||null)};
function hSet(g,k,v){
  const id=k.slice(2),c=v?JSON.parse(JSON.stringify(v)):null;
  if(k[0]==='p'){g.players=g.players||{};if(c)g.players[id]=c;else delete g.players[id];return}
  g.debts=g.debts||[];const i=g.debts.findIndex(d=>d.debtId===id);
  if(c){if(i>=0)g.debts[i]=c;else g.debts.push(c)}else if(i>=0)g.debts.splice(i,1);
}
const hWho=c=>{const o=c.a||c.b||{};return c.k[0]==='p'?o.playerName:`${o.fromPlayerName} → ${o.toPlayerName}`};
const hWhoAll=e=>[...new Set(e.ch.map(hWho))].join(', ');
function undoWhy(g,e){
  if(!e)return 'Modifica non trovata';
  if(e.undone)return 'Questa modifica è già stata annullata';
  if(g.status==='closed'&&e.ch.some(c=>c.k[0]==='p'))return 'La partita è chiusa: i movimenti della serata non si possono più annullare';
  const J=JSON.stringify,idx=(g.hist||[]).indexOf(e);
  for(const c of e.ch){
    if(J(hGet(g,c.k))!==J(c.a)){
      const later=(g.hist||[]).slice(idx+1).some(x=>!x.undone&&x.ch.some(y=>y.k===c.k));
      return later?`Prima annulla le modifiche più recenti su ${hWho(c)}`:`${hWho(c)} è stato modificato nel frattempo: non posso annullare`;
    }
  }
  return '';
}
function undoEntry(gid,hid){
  let why='',msg='';
  return saveGame(gid,g=>{
    const e=(g.hist||[]).find(x=>x.id===hid);
    why=undoWhy(g,e);if(why)return false;
    e.ch.forEach(c=>hSet(g,c.k,c.b));msg=e.msg;
    e.undone={at:new Date().toISOString(),by:S.me?S.me.name:''};
  }).then(ok=>{if(ok)toast('Annullato: '+msg,'ok');else if(why)toast(why,'err');return ok});
}
function histCan(gid,g,e){
  if(e.undone)return false;
  if(e.ch.every(c=>c.k[0]==='d'))return e.ch.every(c=>debtPerm(gid,c.a||c.b).can);
  return g.status==='live'&&isAdmin(gid);
}
function histBlock(g,mode){

function subRes(gid){
  if(S.resGid===gid)return;
  if(S.unsubRes){try{S.unsubRes()}catch(e){}S.unsubRes=null}
  S.res=[];S.resGid=gid;
  if(!gid||!db)return;
  S.unsubRes=db.collection('games/'+gid+'/reservations').onSnapshot(sn=>{S.res=sn.docs.map(d=>Object.assign({id:d.id},d.data()));render()},()=>{});
}
function go(name,gid,extra){
  V=Object.assign({name,gid:gid||null},extra||{});SH=null;ENTER=name==='home'?'back':'push';
  subRes(gid&&['live','book','detail'].includes(name)?gid:null);
  if(name==='new'&&!F.ng)resetNew();

}
function parseHash(){const m=/^#prenota-([A-Za-z0-9_.~-]+)$/.exec(location.hash||'');return m?m[1]:null}
function boot(){
  if(S.booted||!(S.loaded.games&&S.loaded.cfg&&S.loaded.players))return;
  S.booted=true;
  const h=parseHash();
  if(h){go('book',h);return}
  const a=LS.get('active',null);
  if(a&&S.games[a]&&S.games[a].status==='live'){go('live',a);return}

}
async function checkAdmin(){
  const pins=LS.get('pins',{});let ch=false;
  for(const gid of Object.keys(pins)){
    const g=S.games[gid];if(!g)continue;
    const ok=(await sha(gid+':'+pins[gid]))===g.pinHash;
    if(S.admin[gid]!==ok){S.admin[gid]=ok;ch=true}
    if(ok&&S.me&&!g.hostId&&g.status==='live')saveGame(gid,x=>{if(x.hostId)return false;x.hostId=S.me.id;x.adminPin=pins[gid]});
  }
  if(ch)render();
}
async function afterData(){
  const dh=await sha('hpl:'+DEFAULT_PW);
  S.reqHash=dh;
  await checkAdmin();
  if(V.name==='live'||V.name==='detail'){if(!S.games[V.gid]&&S.loaded.games){const a=LS.get('active',null);if(a===V.gid)LS.del('active');V={name:'home'}}}

async function doAuth(){

  if(a.mode==='login'){
    if(!ent)return fail('Nome utente non trovato. Se è la prima volta, tocca Registrati.');

    if(!p.pinHash)return fail('Questo nome non ha ancora un PIN: tocca Registrati per sceglierlo.');

function playerStats(k){
  const gs=Object.entries(S.games).map(([id,g])=>Object.assign({id},g)).filter(g=>g.status==='closed').sort((a,b)=>String(a.scheduledAt).localeCompare(String(b.scheduledAt)));
  const rows=[];let name='';
  gs.forEach(g=>{const p=plist(g).find(x=>pKey(x.playerId,x.playerName)===k||x.playerName.trim().toLowerCase()===k);if(!p)return;name=pName(p.playerId,p.playerName);rows.push({gid:g.id,at:g.scheduledAt,net:p.netCents||0,inv:inv(p),buys:p.buyIns.length,n:plist(g).length})});
  const tot=sum(rows.map(r=>r.net)),wins=rows.filter(r=>r.net>0).length,invT=sum(rows.map(r=>r.inv));
  let streak=0,sk=rows.length?Math.sign(rows[rows.length-1].net):0;
  if(sk!==0)for(let i=rows.length-1;i>=0&&Math.sign(rows[i].net)===sk;i--)streak++;
  const best=rows.reduce((a,r)=>!a||r.net>a.net?r:a,null),worst=rows.reduce((a,r)=>!a||r.net<a.net?r:a,null);
  return {name,rows,tot,wins,invT,streak,sk,best,worst,avg:rows.length?Math.round(tot/rows.length):0,buys:rows.length?sum(rows.map(r=>r.buys))/rows.length:0};
}
function spark(rows){
  const W=320,H=150,P={l:8,r:8,t:14,b:14};
  let c=0;const pts=[{v:0,t:'Inizio',n:null}].concat(rows.map(r=>{c+=r.net;return {v:c,t:dShort(r.at),n:r.net}}));
  const vs=pts.map(p=>p.v),mn=Math.min(0,...vs),mx=Math.max(0,...vs),rng=(mx-mn)||1;
  const x=i=>P.l+(W-P.l-P.r)*(i/(pts.length-1)),y=v=>P.t+(H-P.t-P.b)*(1-(v-mn)/rng);
  const data=pts.map((p,i)=>({x:+x(i).toFixed(1),y:+y(p.v).toFixed(1),t:p.t,v:p.v,n:p.n}));
  const d=data.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' '),last=data[data.length-1],y0=y(0).toFixed(1);
  return `<div class="mut sm" id="spk-read" style="min-height:22px">Tocca il grafico per vedere ogni serata</div>
<svg class="spark" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Andamento del bilancio, oggi ${sgn(last.v)}" data-pts="${esc(JSON.stringify(data))}">
<defs><linearGradient id="spkg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#E4B656;stop-opacity:.34"/><stop offset="1" style="stop-color:#E4B656;stop-opacity:0"/></linearGradient></defs>
<line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="rgba(255,255,255,.22)" stroke-width="1" stroke-dasharray="3 4"/>
<path class="spk-area" d="${d} L${last.x} ${H} L${data[0].x} ${H} Z" fill="url(#spkg)"/>
<path class="spk-line" pathLength="1" d="${d}" fill="none" stroke="#E4B656" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 4px 10px rgba(228,182,86,.45))"/>
<circle class="spk-end" cx="${last.x}" cy="${last.y}" r="5.5" fill="#F7E0A6" stroke="#0E1A15" stroke-width="2.5"/>
<circle class="spk-dot" r="6" cx="-30" cy="-30" fill="var(--ivory)" stroke="#0E1A15" stroke-width="2"/></svg>`;
}

function homeData(){

  const agg={};
  gs.filter(g=>g.status==='closed').forEach(g=>plist(g).forEach(p=>{
    const k=pKey(p.playerId,p.playerName);const a=agg[k]||(agg[k]={key:k,name:pName(p.playerId,p.playerName),n:0,w:0,tot:0});

function targetsFrom(sel){
  const out=[];
  Object.keys(sel||{}).filter(id=>sel[id]&&S.players[id]&&isReg(S.players[id])).forEach(id=>out.push({id,name:S.players[id].name}));
  return out;
}
async function ensurePlayers(ts){
  const out=[];
  for(const t of ts){
    let id=t.id;
    if(!id){id=nid('p');await db.doc('players/'+id).set({name:t.name,createdAt:new Date().toISOString()});S.players[id]={name:t.name}}
    out.push({id,name:t.name});
  }
  return out;
}
const rubrica=()=>Object.entries(S.players).map(([id,p])=>({id,name:p.name,reg:!!(p.pinHash||p.acct)})).sort((a,b)=>a.name.localeCompare(b.name,'it'));

async function createGame(){
  const v=ngVals();if(!v.ok||!db)return;
  const n=F.ng,ts=targetsFrom(n.sel,n.names);
  const gid='g'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const pin=String(crypto.getRandomValues(new Uint32Array(1))[0]%10000).padStart(4,'0');
  let rs;try{rs=await ensurePlayers(ts)}catch(e){toast(errMsg(e),'err');return}
  const now=new Date().toISOString(),players={};
  rs.forEach((r,i)=>{players[r.id]={playerId:r.id,playerName:r.name,seq:i+1,buyIns:[{buyInId:nid('b'),amountCents:v.buy,paymentStatus:n.pstatus,timestamp:now}],cashOuts:[],cashOutCents:null,netCents:null}});
  const doc={scheduledAt:new Date(n.date+'T'+n.time).toISOString(),hostName:n.host.trim(),location:n.loc.trim(),maxSeats:v.seats,dealerChips:0,buyInCents:v.buy,chipsPerBuyIn:v.chips,status:'live',pinHash:await sha(gid+':'+pin),hostId:S.me?S.me.id:null,adminPin:pin,holeCents:null,holeMode:'',createdAt:now,players,debts:[],seq:rs.length};
  try{await db.doc('games/'+gid).set(doc)}catch(e){toast(errMsg(e),'err');return}
  S.games[gid]=doc;
  const pins=LS.get('pins',{});pins[gid]=pin;LS.set('pins',pins);S.admin[gid]=true;
  LS.set('active',gid);LS.set('name',doc.hostName);F.ng=null;F.pinShow=false;
  go('live',gid);toast('Partita creata: apri la cassa!','ok');
}

const waHref=t=>'https://wa.me/?text='+encodeURIComponent(t);
function resList(g,A){

  return L.map((r,i)=>{const pr=i+1,wait=g.maxSeats&&pr>g.maxSeats;return `<div class="row" style="min-height:52px;border-top:${i?'1px solid var(--line2)':'0'}"><b class="gold num" style="width:22px;text-align:center">${pr}</b>${ava(r.playerName,'s')}<div class="grow">${esc(r.playerName)} ${wait?'<span class="badge grey">In attesa</span>':''}</div><span class="mut xs num">${tHM(r.reservedAt)}</span>${A?`<button class="x" data-act="delres" data-id="${r.id}" aria-label="Rimuovi prenotazione">${ico('close',16)}</button>`:''}</div>`}).join('');

async function renumber(list,skip){
  for(let i=0;i<list.length;i++){const x=list[i];if(x.id===skip)continue;if(x.priorityOrder!==i+1){try{await db.doc(`games/${V.gid||''}/reservations/${x.id}`).update({priorityOrder:i+1})}catch(e){}}}
}
async function reserve(gid,name){
  name=String(name||'').trim();const g=S.games[gid];
  if(!name)return toast('Scrivi il tuo nome','err');
  if(!g||g.status==='closed')return;
  if(S.res.some(r=>String(r.playerName).trim().toLowerCase()===name.toLowerCase()))return toast(`${name} è già prenotato`,'err');
  const pl=Object.entries(S.players).find(([id,p])=>String(p.name).toLowerCase()===name.toLowerCase());
  const rid=nid('r'),now=new Date().toISOString().replace(/\.\d+Z$/,'Z');
  const list=resSorted().concat([{id:rid,reservedAt:now}]).sort((a,b)=>String(a.reservedAt).localeCompare(String(b.reservedAt))||a.id.localeCompare(b.id));
  const rank=list.findIndex(x=>x.id===rid)+1;
  const data={playerName:name,reservedAt:now,priorityOrder:rank};if(pl)data.playerId=pl[0];
  try{await db.doc(`games/${gid}/reservations/${rid}`).set(data);await renumber(list,rid)}catch(e){toast(errMsg(e),'err');return}
  LS.set('name',name);F.rname='';
  toast(g.maxSeats&&rank>g.maxSeats?`Prenotato! Sei n° ${rank}: in lista d'attesa`:`Prenotato! Sei n° ${rank} ♠`,'ok');render();
}

}

async function addBuyIn(pid,name){
  const gid=V.gid,b=F.bi,amt=b.custom?parseEur(b.cv):b.amt;
  if(!(amt>0))return;
  const bi={buyInId:nid('b'),amountCents:amt,paymentStatus:b.status,timestamp:new Date().toISOString()};
  const ok=await saveGame(gid,gg=>{if(!gg.players[pid])return false;gg.players[pid].buyIns.push(bi)},'Re-buy registrato');
  if(ok){SH=null;render()}
}
async function seatMany(){
  const g=S.games[V.gid],ts=targetsFrom(F.ap.sel,F.ap.names);if(!ts.length)return;
  const b=F.bi,amt=b.custom?parseEur(b.cv):b.amt;if(!(amt>0))return;
  let rs;try{rs=await ensurePlayers(ts)}catch(e){toast(errMsg(e),'err');return}
  const now=new Date().toISOString();let rebuys=0;
  const ok=await saveGame(V.gid,gg=>{
    rebuys=0;
    rs.forEach(r=>{
      const ex=Object.values(gg.players).find(p=>p.playerId===r.id||p.playerName.toLowerCase()===r.name.toLowerCase());
      const bi={buyInId:nid('b'),amountCents:amt,paymentStatus:b.status,timestamp:now};
      if(ex){ex.buyIns.push(bi);rebuys++}
      else{gg.seq=(gg.seq||0)+1;gg.players[r.id]={playerId:r.id,playerName:r.name,seq:gg.seq,buyIns:[bi],cashOuts:[],cashOutCents:null,netCents:null}}
    });
  },()=>rebuys===rs.length?'Re-buy registrati':rs.length>1?`${rs.length} giocatori al tavolo`:'Giocatore al tavolo');
  if(ok){SH=null;F.ap={sel:{},names:''};render()}
}
function playedBefore(pid,name){return Object.values(S.games).some(g=>Object.values(g.players||{}).some(p=>p.playerId===pid||p.playerName.toLowerCase()===name.toLowerCase()))}
async function delPlayerOk(id){
  const p=S.players[id];if(!p)return;
  if(p.pinHash){SH={type:'add',anim:false};render();toast(`${p.name} ha un profilo registrato: non si può eliminare dalla rubrica.`,'err');return}
  if(playedBefore(id,p.name)){SH={type:'add',anim:false};render();toast(`${p.name} ha già partecipato a una o più partite: eliminarlo farebbe perdere lo storico.`,'err');return}
  try{await db.doc('players/'+id).delete();delete S.players[id]}catch(e){toast(errMsg(e),'err');return}
  delete F.ap.sel[id];
  SH={type:'add',anim:false};render();
}

const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
async function bioSupport(){try{return !!(window.isSecureContext&&window.PublicKeyCredential&&navigator.credentials&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}}
async function bioEnroll(){
  const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Home Poker'},user:{id:new TextEncoder().encode(S.me.id),name:S.me.name,displayName:S.me.name},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000,attestation:'none'}});
  const token=[...crypto.getRandomValues(new Uint8Array(24))].map(x=>x.toString(16).padStart(2,'0')).join('');
  return {cred:b64(cred.rawId),token};
}
async function bioAssert(cred){
  await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(cred)}],userVerification:'required',timeout:60000}});
  return true;
}
const bioHash=(id,token)=>sha('hplbio:'+id+':'+token);
async function bioFresh(p){
  const b=bioMine();if(!b||!p||!bioFreshUi())return false;
  const h=await bioHash(b.id,b.token);return (p.bio||[]).some(x=>x.h===h);
}

  el.innerHTML=ico('check',16)+'<span></span><button type="button" class="undo">Annulla</button>';

function sparkAt(e){
  const s=e.target&&e.target.closest&&e.target.closest('svg.spark');if(!s)return;
  const pts=JSON.parse(s.dataset.pts),r=s.getBoundingClientRect(),vx=(e.clientX-r.left)/r.width*320;
  let b=pts[0];pts.forEach(p=>{if(Math.abs(p.x-vx)<Math.abs(b.x-vx))b=p});
  const dot=s.querySelector('.spk-dot');dot.setAttribute('cx',b.x);dot.setAttribute('cy',b.y);
  const rd=document.getElementById('spk-read');if(rd)rd.textContent=b.n==null?'Prima partita: si parte da 0,00 €':`Serata del ${b.t}: ${sgn(b.n)} · totale ${sgn(b.v)}`;
}

function dlBlob(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}

/* ===== Archivio Supabase (un database condiviso, diviso per tavolo) ===== */
const SB_URL='https://nqlywzjhxykrfyrpkjdw.supabase.co';
const SB_KEY='sb_publishable_n_Cesb7VT2ipKa0y9SntYA_zkn4ABgn';
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ko(new Error('Script non caricato'));document.head.appendChild(s)})}
const clone=o=>JSON.parse(JSON.stringify(o));
const parentOf=p=>p.split('/').slice(0,-1).join('/');
let BASE=null;
async function makeBase(){
  await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js');
  const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'hpl-auth'}});
  const T='hpl_docs';
  const {data:sd}=await sb.auth.getSession();
  if(!sd||!sd.session){
    const r=await sb.auth.signInAnonymously();
    if(r.error){const m=String(r.error.message||'');throw new Error(/anonymous/i.test(m)?'Accesso anonimo disattivato in Supabase: attiva "Allow anonymous sign-ins" in Authentication → Sign In / Providers.':m)}
  }
  async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args);if(error)throw error;return data}
  async function getDoc(path){const {data,error}=await sb.from(T).select('data').eq('path',path).maybeSingle();if(error)throw error;return data?data.data:null}
  async function scope(prefix){
    const cache=new Map(),subs=new Set(),pre=prefix+'/';
    const notify=()=>subs.forEach(f=>{try{f()}catch(e){console.error(e)}});
    const sig=()=>{let x='';[...cache.keys()].sort().forEach(k=>{x+=k+JSON.stringify(cache.get(k))});return x};
    async function loadAll(){const {data,error}=await sb.from(T).select('path,data').like('path',pre+'%');if(error)throw error;cache.clear();data.forEach(r=>cache.set(r.path,r.data))}
    async function refresh(){try{const a=sig();await loadAll();if(sig()!==a)notify()}catch(e){}}
    await loadAll();
    const ch=sb.channel('hpl-'+prefix).on('postgres_changes',{event:'*',schema:'public',table:T},pl=>{
      if(pl.eventType==='DELETE'){const p=pl.old&&pl.old.path;if(p&&p.startsWith(pre)){cache.delete(p);notify()}}
      else if(pl.new&&pl.new.path.startsWith(pre)){cache.set(pl.new.path,pl.new.data);notify()}
    }).subscribe();
    const iv=setInterval(refresh,20000);
    const vis=()=>{if(!document.hidden)refresh()};document.addEventListener('visibilitychange',vis);
    const snapDoc=p=>({id:p.split('/').pop(),exists:cache.has(pre+p),data:()=>cache.has(pre+p)?clone(cache.get(pre+p)):undefined});
    const colDocs=c=>[...cache.keys()].filter(k=>parentOf(k)===pre+c).sort().map(k=>snapDoc(k.slice(pre.length)));
    const watch=(fn,cb)=>{const f=()=>cb(fn());subs.add(f);setTimeout(f,0);return()=>subs.delete(f)};
    const put=async(p,d)=>{const {error}=await sb.from(T).upsert({path:pre+p,parent:parentOf(pre+p),data:d,updated_at:new Date().toISOString()});if(error)throw error;cache.set(pre+p,clone(d));notify()};
    const doc=p=>({id:p.split('/').pop(),path:p,
      async get(){const d=await getDoc(pre+p);if(d)cache.set(pre+p,d);else cache.delete(pre+p);return snapDoc(p)},
      async set(d){await put(p,d)},
      async update(d){await put(p,Object.assign({},cache.get(pre+p)||{},clone(d)))},
      async delete(){const {error}=await sb.from(T).delete().eq('path',pre+p);if(error)throw error;cache.delete(pre+p);notify()},
      onSnapshot(cb){return watch(()=>snapDoc(p),cb)}});
    const collection=c=>({path:c,doc:id=>doc(c+'/'+id),
      async get(){await refresh();const d=colDocs(c);return {docs:d,size:d.length}},
      onSnapshot(cb){return watch(()=>{const d=colDocs(c);return {docs:d,size:d.length,empty:!d.length}},cb)}});
    return {doc,collection,close(){clearInterval(iv);document.removeEventListener('visibilitychange',vis);try{sb.removeChannel(ch)}catch(e){}}};
  }
  async function fn(name,body){const {data,error}=await sb.functions.invoke(name,{body});if(error)throw error;return data}
  return {getDoc,rpc,scope,fn,sb};
}

async function enterTable(t){
  db=await BASE.scope('t/'+t.id);
  S.table={id:t.id,name:t.name};S.dbReady=true;
  const onErr=e=>{toast(errMsg(e),'err')};
  db.collection('games').onSnapshot(sn=>{const o={};sn.docs.forEach(d=>{o[d.id]=d.data()});S.games=o;S.loaded.games=true;afterData()},onErr);
  db.doc('settings/table').onSnapshot(sn=>{S.cfg=sn.exists?sn.data():null;if(S.loaded.players)render()},onErr);
  S.netreq={};db.collection('netreq').onSnapshot(sn=>{const o={};sn.docs.forEach(d=>{o[d.id]=d.data()});S.netreq=o;if(S.loaded.players)render()},onErr);
  db.collection('players').onSnapshot(sn=>{const o={};sn.docs.forEach(d=>{o[d.id]=d.data()});S.players=o;S.loaded.players=true;afterData()},onErr);
  render();
}
async function doTable(){
  const t=F.tb,create=t.mode==='create',name=t.name.trim().replace(/\s+/g,' ');
  const fail=m=>{t.err=m;t.busy=false;render()};
  if(name.length<2)return fail('Il nome del tavolo deve avere almeno 2 caratteri.');
  if(t.pw.length<4)return fail('La password deve avere almeno 4 caratteri.');
  if(create&&t.pw!==t.pw2)return fail('Le due password non coincidono.');
  t.busy=true;t.err='';render();
  try{
    const id='t'+(await sha('hpltn:'+name.toLowerCase())).slice(0,20);let shown=name;
    if(create){
      const r=await BASE.rpc('hpl_create_table',{tid:id,tname:name,pw:t.pw});
      if(r==='exists')return fail('Esiste già un tavolo con questo nome: tocca Entra, oppure scegli un altro nome.');
      if(r!=='ok')return fail('Non sono riuscito a creare il tavolo, riprova.');
    }else{
      const r=await BASE.rpc('hpl_join_table',{tid:id,pw:t.pw});
      if(!r||r.status==='not_found')return fail('Nessun tavolo con questo nome. Controlla come è scritto, oppure creane uno.');
      if(r.status==='bad_password')return fail('Password errata.');
      if(r.status==='too_many')return fail('Troppi tentativi sbagliati: riprova tra qualche minuto.');
      shown=r.name;
    }
    LS.set('table',{id});LS.set('lasttb',shown);
    F.tb={mode:null,name:'',pw:'',pw2:'',err:'',busy:false};
    await enterTable({id,name:shown});
  }catch(e){fail(errMsg(e))}
}

async function doAcct(){
  const a=F.ac,reg=a.mode==='reg',name=a.name.trim().replace(/\s+/g,' ');
  const fail=m=>{a.err=m;a.busy=false;render()};
  if(name.length<2)return fail('Il nome utente deve avere almeno 2 caratteri.');
  if(!PIN_RE.test(a.pin))return fail('Il PIN deve avere da 4 a 6 cifre.');
  if(reg&&a.pin!==a.pin2)return fail('I due PIN non coincidono.');
  a.busy=true;a.err='';render();
  try{
    const r=await BASE.rpc(reg?'hpl_register':'hpl_login',{p_name:name,p_pin:a.pin});
    const st=r&&r.status;
    if(st==='exists')return fail('Questo nome utente esiste già: tocca Accedi, oppure scegline un altro.');
    if(st==='reserved')return fail('Questo nome utente è riservato.');
    if(st==='invalid')return fail('Controlla nome utente e PIN.');
    if(st==='not_found')return fail('Nome utente non trovato. Se è la prima volta, tocca Registrati.');
    if(st==='bad_pin')return fail('Nome utente o PIN errati.');
    if(st==='too_many')return fail('Troppi tentativi sbagliati: riprova tra qualche minuto.');
    if(st!=='ok')return fail('Non è andata, riprova.');
    await refreshMe();LS.set('hadacct',1);S.locked=false;
    F.ac={mode:null,name:'',pin:'',pin2:'',err:'',busy:false};
    toast('Ciao '+firstName(S.acct.name)+'!','ok');render();
  }catch(e){fail(errMsg(e))}
}

function openDebtsAll(){
  return Object.entries(S.games).filter(([id,g])=>g.status==='closed').flatMap(([id,g])=>(g.debts||[]).filter(d=>d.remainingAmount>0&&!isDealerD(d)&&d.fromPlayerId!=='dealer').map(d=>({gid:id,g,d})));
}
const nmP=id=>pName(id,(S.players[id]||{}).name)||'?';
const pairId=(a,b)=>a<b?a+'_'+b:b+'_'+a;
function nettingPairs(){
  const M={};
  openDebtsAll().forEach(x=>{const f=x.d.fromPlayerId,t=x.d.toPlayerId;if(!f||!t||f==='dealer'||t==='dealer'||f===t)return;const k=f<t?f+'|'+t:t+'|'+f;(M[k]=M[k]||[]).push(x)});
  return Object.entries(M).map(([k,xs])=>{
    const [a,b]=k.split('|'),ab=xs.filter(x=>x.d.fromPlayerId===a),ba=xs.filter(x=>x.d.fromPlayerId===b);
    if(!ab.length||!ba.length)return null;
    const sAB=sum(ab.map(x=>x.d.remainingAmount)),sBA=sum(ba.map(x=>x.d.remainingAmount));
    return {a,b,old:xs,sAB,sBA,net:Math.abs(sAB-sBA),from:sAB>=sBA?a:b,to:sAB>=sBA?b:a,sig:xs.map(x=>x.d.debtId+':'+x.d.remainingAmount).sort().join(',')};
  }).filter(Boolean);
}

async function authMe(){

const netMsg=(iO,tO)=>iO===tO?'siete pari':iO>tO?`resti a dare ${eur(iO-tO)}`:`resti a ricevere ${eur(tO-iO)}`;
async function sendNetReq(){
  const o=V.pid,p=myPairs().find(x=>pairOther(x)===o);if(!p||F.netBusy)return;

  F.netBusy=true;render();
  if(!(await authMe())){F.netBusy=false;render();return}
  const stop=m=>{F.netBusy=false;render();if(m)toast(m,'err')};
  const now=new Date().toISOString(),nid0='n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const byG={};p.old.forEach(x=>(byG[x.gid]=byG[x.gid]||[]).push(x.d.debtId));

    const ok=await saveGame(gid,g=>{(g.debts||[]).forEach(d=>{if(byG[gid].includes(d.debtId)){d.transactions.forEach(t=>{if(t.status==='PENDING'){t.status='NETTED';t.nettedBy=nid0;t.lastUpdated=now}});recompute(d)}})});

function tourLevels(startChips){const f=Math.max(1,Math.round((startChips||2000)/2000));return BLINDS.map(([s,b])=>[s*f,b*f])}
function tourClock(g){
  const t=g.tour||{},ms=(t.mins||15)*60000,now=Date.now();
  if(!t.startedAt)return {started:false,paused:false,level:0,left:ms,ms,frac:0,lv:t.levels||tourLevels(g.chipsPerBuyIn)};
  const el=Math.max(0,(t.pausedAt||now)-t.startedAt-(t.pausedMs||0)+(t.shiftMs||0));
  const lv=t.levels||tourLevels(g.chipsPerBuyIn),level=Math.min(lv.length-1,Math.floor(el/ms)),into=el-level*ms;
  return {started:true,paused:!!t.pausedAt,level,left:Math.max(0,ms-into),ms,frac:Math.min(1,into/ms),lv};
}
const mmss=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

function tourPrizes(g){
  const pot=grossOf(g)-(g.dealerChips||0),pct=(g.tour&&g.tour.payouts)||[100];
  const pr=pct.map(p=>Math.floor(pot*p/100));pr[0]+=pot-sum(pr);return {pot,pr,pct};
}
function tourResult(g){
  const L=plist(g),inn=L.filter(p=>!p.out);
  if(inn.length!==1||L.length<2)return {ok:false};
  const {pot,pr}=tourPrizes(g),pos=p=>p.out||1;
  const rows=L.map(p=>({p,pos:pos(p),prize:pr[pos(p)-1]||0,inv:inv(p)})).sort((a,b)=>a.pos-b.pos);
  const nets=rows.map(r=>({name:r.p.playerName,pid:r.p.playerId,net:r.prize-r.inv}));
  return {ok:true,pot,rows,nets,tx:settle(nets)};
}

async function savePlan(){
  const p=F.plan;if(!p)return;
  const gid='g'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),now=new Date().toISOString();
  const at=new Date(p.date+'T'+p.time).toISOString();
  const doc={status:'scheduled',scheduledAt:at,hostName:S.me.name,hostId:S.me.id,location:p.loc.trim(),note:p.note.trim(),maxSeats:p.seats.trim()?+p.seats:null,createdAt:now,players:{},debts:[],hist:[],buyInCents:defBuy(),chipsPerBuyIn:(S.cfg&&S.cfg.defChips)||2000};
  try{await db.doc('games/'+gid).set(doc);S.games[gid]=doc;
    const rid=nid('r');await db.doc(`games/${gid}/reservations/${rid}`).set({playerName:S.me.name,playerId:S.me.id,reservedAt:now,priorityOrder:1})}catch(e){toast(errMsg(e),'err');return}
  F.plan=null;
  const when=`${new Date(at).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})} alle ${p.time}`;
  pushSend({to:'all',title:`♠️ Poker ${when}`,body:`${S.me.name} organizza${doc.location?' · '+doc.location:''}${doc.note?' · '+doc.note:''}. Tocca per prenotare il tuo posto.`,url:deepUrl('book',gid),tag:'invito-'+gid});
  go('book',gid);toast('Serata programmata: invito inviato al tavolo','ok');
}
function upcoming(){return Object.entries(S.games).filter(([id,g])=>g.status==='scheduled'&&new Date(g.scheduledAt).getTime()>Date.now()-12*3600000).map(([id,g])=>Object.assign({id},g)).sort((a,b)=>String(a.scheduledAt).localeCompare(String(b.scheduledAt)))}
function upcomingCards(){
  return upcoming().map(g=>`<button class="card tap gcard upc" data-act="book" data-gid="${g.id}"><span class="dtile"><b>${dDay(g.scheduledAt)}</b><span>${dMon(g.scheduledAt)}</span></span><div class="grow" style="min-width:0"><div style="font-weight:700">Poker ${new Date(g.scheduledAt).toLocaleDateString('it-IT',{weekday:'long'})} alle ${tHM(g.scheduledAt)}</div><div class="mut sm ell">${esc(g.location||('da '+g.hostName))}${g.note?' · '+esc(g.note):''}</div></div><span class="badge live">Prenota</span></button>`).join('');
}
const deepUrl=(v,gid)=>'./#go='+v+'&t='+encodeURIComponent(S.table.id)+'&g='+encodeURIComponent(gid);
function deepLink(){const m=/^#go=(\w+)&t=([^&]+)&g=([^&]+)/.exec(location.hash||'');return m?{v:m[1],t:decodeURIComponent(m[2]),g:decodeURIComponent(m[3])}:null}

/* ---------- 2. Notifiche push ---------- */
const VAPID_PUBLIC='BCnn5zA-GaX6MJhOF6mrLIkm7CfuFImZr_3YHaKPhZY644jdaiWsEEUo33pTsqBMuico3HhB5qhg0Swy1g_GMXQ';
const pushSupported=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window&&/^https:/.test(location.protocol);
const isStandalone=()=>window.matchMedia&&matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let SWREG=null;
async function swReady(){if(!('serviceWorker' in navigator)||!/^https:/.test(location.protocol))return null;try{SWREG=SWREG||await navigator.serviceWorker.register('sw.js');return SWREG}catch(e){return null}}
async function pushState(){try{const r=await swReady();if(!r)return false;const s=await r.pushManager.getSubscription();return !!s&&Notification.permission==='granted'}catch(e){return false}}
async function pushOn(){
  if(!pushSupported()){toast(isIOS()&&!isStandalone()?'Prima aggiungi l\'app alla schermata Home (Condividi → Aggiungi alla schermata Home), poi riprova da lì':'Questo telefono o browser non supporta le notifiche','err');return}
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){toast('Notifiche non permesse: puoi attivarle dalle impostazioni del telefono','err');return}
  try{
    const r=await swReady();const key=unb64(VAPID_PUBLIC);
    const sub=(await r.pushManager.getSubscription())||(await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key}));
    const j=sub.toJSON();await BASE.rpc('hpl_save_push',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});
    S.pushOn=true;render();toast('Notifiche attive','ok');
  }catch(e){toast('Non riesco ad attivare le notifiche: '+errMsg(e),'err')}
}
async function pushOff(){
  try{const r=await swReady();const s=r&&await r.pushManager.getSubscription();if(s){try{await BASE.rpc('hpl_delete_push',{p_endpoint:s.endpoint})}catch(e){}await s.unsubscribe()}}catch(e){}
  S.pushOn=false;render();toast('Notifiche disattivate','ok');
}
async function pushSend(m){
  if(!S.table)return;
  try{await BASE.fn('hpl-push',Object.assign({table_id:S.table.id},m))}catch(e){console.warn('push',e)}
}

/* ---------- Cambio nome utente ---------- */
async function renameOk(){
  const n=String(F.rn.name||'').trim().replace(/\s+/g,' ');
  if(n.length<2){toast('Il nome deve avere almeno 2 caratteri','err');return}
  let r;try{r=await BASE.rpc('hpl_rename',{p_name:n,p_pin:F.rn.pin})}catch(e){toast(errMsg(e),'err');return}
  if(r==='exists'){toast('Questo nome utente è già usato da un altro account','err');return}
  if(r==='bad_pin'){toast('PIN errato','err');return}
  if(r==='invalid'){toast('Nome non valido','err');return}
  if(r!=='ok'){toast('Non è andata, riprova','err');return}
  await refreshMe();if(S.me){S.me.name=n;if(S.players[S.me.id])S.players[S.me.id].name=n}
  F.rn={name:'',pin:''};SH=null;render();toast('Ora ti chiami '+n,'ok');
}

const _createGame0=createGame;
createGame=async function(){
  const n=F.ng;if(!n)return;
  const v=ngVals();if(!v.ok||!db)return;
  const ts=targetsFrom(n.sel);if(ts.length<2)return;
  const gid=n.fromGid||('g'+Date.now().toString(36)+Math.random().toString(36).slice(2,5));
  if(n.fromGid){try{const sn=await db.doc('games/'+gid).get(),cur=sn&&sn.data&&sn.data();if(cur&&cur.status!=='scheduled'){F.ng=null;go(cur.status==='live'?'live':'detail',gid);toast('La partita è già stata iniziata: eccola','ok');return}}catch(e){}}
  const pin=String(crypto.getRandomValues(new Uint32Array(1))[0]%10000).padStart(4,'0');
  const now=new Date().toISOString(),players={};
  ts.forEach((r,i)=>{players[r.id]={playerId:r.id,playerName:r.name,seq:i+1,buyIns:[{buyInId:nid('b'),amountCents:v.buy,paymentStatus:n.pstatus,timestamp:now}],cashOuts:[],cashOutCents:null,netCents:null}});
  const prev=n.fromGid&&S.games[n.fromGid]||{};
  const doc={scheduledAt:new Date(n.date+'T'+n.time).toISOString(),hostName:n.host.trim()||S.me.name,location:n.loc.trim(),maxSeats:v.seats,dealerChips:0,buyInCents:v.buy,chipsPerBuyIn:v.chips,status:'live',pinHash:await sha(gid+':'+pin),hostId:S.me?S.me.id:null,adminPin:pin,holeCents:null,holeMode:'',createdAt:prev.createdAt||now,players,debts:[],seq:ts.length,hist:[]};
  if(prev.note)doc.note=prev.note;
  if(n.kind==='tournament'){const pk=n.payKey||defPayKey(ts.length);doc.kind='tournament';doc.tour={mins:n.tmins||15,levels:tourLevels(v.chips),payouts:PAYOUTS[pk],payKey:pk,rebuy:n.trebuy!==false,startedAt:null,pausedAt:null,pausedMs:0,shiftMs:0}}
  try{await db.doc('games/'+gid).set(doc)}catch(e){toast(errMsg(e),'err');return}
  S.games[gid]=doc;
  const pins=LS.get('pins',{});pins[gid]=pin;LS.set('pins',pins);S.admin[gid]=true;
  LS.set('active',gid);F.ng=null;
  go('live',gid);toast(doc.kind==='tournament'?'Torneo creato: avvia il timer quando siete pronti':'Partita creata: buon divertimento!','ok');
};

  const mine=closed.filter(myP),myTot=sum(mine.map(g=>myP(g).netCents||0)),myWins=mine.filter(g=>(myP(g).netCents||0)>0).length;

  const f=F.stf;

<div class="seg hs-seg">${[['all','Tutte',0],['mine','Le mie',0],['open','Da saldare',debtPeopleList('open').length],['get','Da ricevere',debtPeopleList('get').length]].map(([k,l,n])=>`<button class="${f===k?'on':''}" data-act="stf" data-f="${k}">${l}${n?` <span class="hs-n">${n}</span>`:''}</button>`).join('')}</div>`;

function gameCard(g,mp,o){
  const L=plist(g),lv=g.status==='live',d=new Date(g.scheduledAt);
  const wd=d.toLocaleDateString('it-IT',{weekday:'short'}).replace('.','');
  const best=lv?null:L.slice().sort((a,b)=>(b.netCents||0)-(a.netCents||0))[0];
  const T=g.kind==='tournament';
  const where=g.location?esc(g.location):'Serata di '+d.toLocaleDateString('it-IT',{weekday:'long'});
  const my=mp&&!lv?(mp.netCents||0):null,meBest=best&&mp&&best.playerId===mp.playerId&&(best.netCents||0)>0;
  const st=lv?'<span class="badge live"><i class="dot"></i>In corso</span>':o?`<span class="badge pend num">${o} da saldare</span>`:'<span class="badge paid">Saldata</span>';
  const chips=[];
  if(best&&(best.netCents||0)>0)chips.push(`<span class="gchip win">🏆 ${meBest?'Tu':esc(firstName(best.playerName))} <b class="num">${sgnS(best.netCents)}</b></span>`);
  if(my!=null&&!meBest)chips.push(`<span class="gchip ${my>0?'up':my<0?'dn':''}">Tu <b class="num">${my?sgnS(my):'pari'}</b></span>`);
  if(lv)chips.push(`<span class="gchip">${stackAva(L.map(p=>p.playerName),4)}</span>`);
  return `<button class="gc ${lv?'is-live':''}" data-act="${lv?'live':'detail'}" data-gid="${g.id}">
<div class="gc-row"><span class="gc-date"><b>${d.getDate()}</b><span>${wd}</span></span>
<span class="grow" style="min-width:0"><span class="gc-t">${where}</span><span class="mut xs gc-s">${T?'Torneo · ':''}${tHM(g.scheduledAt)} · ${L.length} giocator${L.length===1?'e':'i'}</span></span>
<span class="gc-pot"><b class="num">${eurS(netPot(g))}</b><span class="mut xs">${T?'premi':'montepremi'}</span></span></div>
<div class="gc-foot"><span class="gc-chips">${chips.join('')}</span>${st}</div></button>`;
}

/* =====================================================================
   Motore Texas Hold'em (no-limit) — usato dal server (Edge Function) e,
   per la sola valutazione della mano, dall'app.
   Stato pubblico: niente carte coperte. Stato privato: mazzo e carte.
   Modalità: cash (fiches ricaricabili) e sng (torneo Sit & Go, bui crescenti).

const HE=(()=>{
const RANKS='23456789TJQKA',SUITS='shdc',NS=9,NEXT_DELAY=4000,HIST=25;
const LONELY_MS=150000,AWAY_MS=420000;
const LV=[1,1.5,2,3,4,5,6,8,10,12,15,20,25,30,40,50,60,80,100,150,200];
const rv=c=>RANKS.indexOf(c[0])+2;
const RN={11:'J',12:'Q',13:'K',14:'A'};const rn=v=>RN[v]||String(v);
function rnd(n){const a=new Uint32Array(1),lim=Math.floor(0x100000000/n)*n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n}
function newDeck(){const d=[];for(const r of RANKS)for(const s of SUITS)d.push(r+s);for(let i=d.length-1;i>0;i--){const j=rnd(i+1);const t=d[i];d[i]=d[j];d[j]=t}return d}

/* ---- valutazione: punteggio confrontabile + nome in italiano ---- */
function straightHigh(vs){const u=[...new Set(vs)].sort((a,b)=>b-a);if(u[0]===14)u.push(1);let run=1;for(let i=1;i<u.length;i++){if(u[i]===u[i-1]-1){if(++run>=5)return u[i]+4}else run=1}return 0}
function evalHand(cards){
  cards=(cards||[]).filter(Boolean);if(!cards.length)return null;
  const vals=cards.map(rv),cnt={},bySuit={};
  vals.forEach(v=>cnt[v]=(cnt[v]||0)+1);
  cards.forEach(c=>(bySuit[c[1]]=bySuit[c[1]]||[]).push(rv(c)));
  let fl=null;for(const s in bySuit)if(bySuit[s].length>=5)fl=s;
  if(fl){const sh=straightHigh(bySuit[fl]);if(sh)return {s:[8,sh],n:sh===14?'Scala reale':'Scala colore al '+rn(sh)}}
  const g=Object.keys(cnt).map(v=>[+v,cnt[v]]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
  const desc=vals.slice().sort((a,b)=>b-a);
  if(g[0][1]===4){const q=g[0][0];return {s:[7,q,desc.find(v=>v!==q)||0],n:'Poker di '+rn(q)}}
  if(g[0][1]===3&&g[1]&&g[1][1]>=2)return {s:[6,g[0][0],g[1][0]],n:'Full di '+rn(g[0][0])+' e '+rn(g[1][0])};
  if(fl){const f=bySuit[fl].sort((a,b)=>b-a).slice(0,5);return {s:[5,...f],n:'Colore al '+rn(f[0])}}
  const st=straightHigh(vals);if(st)return {s:[4,st],n:'Scala al '+rn(st)};
  if(g[0][1]===3){const t=g[0][0];return {s:[3,t,...desc.filter(v=>v!==t).slice(0,2)],n:'Tris di '+rn(t)}}
  if(g[0][1]===2&&g[1]&&g[1][1]===2){const a=g[0][0],b=g[1][0];return {s:[2,a,b,desc.find(v=>v!==a&&v!==b)||0],n:'Doppia coppia '+rn(a)+' e '+rn(b)}}
  if(g[0][1]===2){const p=g[0][0];return {s:[1,p,...desc.filter(v=>v!==p).slice(0,3)],n:'Coppia di '+rn(p)}}

/* Omaha: si usano per forza 2 carte proprie e 3 del tavolo */
function bestOmaha(hole,board){
  hole=(hole||[]).filter(Boolean);board=(board||[]).filter(Boolean);let best=null;
  if(board.length<3)return evalHand(hole.slice(0,2));
  for(let a=0;a<hole.length;a++)for(let b=a+1;b<hole.length;b++)for(let c=0;c<board.length;c++)for(let d=c+1;d<board.length;d++)for(let e=d+1;e<board.length;e++){
    const five=[hole[a],hole[b],board[c],board[d],board[e]],ev=evalHand(five);if(!best||cmp(ev.s,best.s)>0)best=Object.assign(ev,{cards:five})}
  return best;
}
/* limite al piatto: si rilancia al massimo della dimensione del piatto */
function potCap(st,i){
  if(st.cfg.limit!=='pot')return Infinity;
  const h=st.hand,P=h.p[i],pot=Object.values(h.p).reduce((a,x)=>a+x.contrib,0),toCall=Math.max(0,h.curBet-P.bet);
  return Math.max(h.curBet+pot+toCall,h.curBet+(h.bbAmt||st.cfg.bb));
}
function cmp(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0}
/* le 5 carte che formano il punto (per evidenziarle) */
function best5(cards){
  cards=(cards||[]).filter(Boolean);if(cards.length<=5){const e=evalHand(cards);return e&&Object.assign(e,{cards:cards.slice()})}
  let best=null;const n=cards.length;
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){const five=cards.filter((_,k)=>k!==a&&k!==b);if(five.length!==5)continue;const e=evalHand(five);if(!best||cmp(e.s,best.s)>0){best=Object.assign(e,{cards:five})}}
  // con 6 carte il doppio ciclo ne toglie due: rifacciamo togliendone una
  if(n===6){best=null;for(let a=0;a<n;a++){const five=cards.filter((_,k)=>k!==a);const e=evalHand(five);if(!best||cmp(e.s,best.s)>0)best=Object.assign(e,{cards:five})}}
  // il nome viene dalla mano completa (più preciso con i kicker)
  const full=evalHand(cards);if(best&&full)best.n=full.n;
  return best;
}

/* ---- stato ---- */
function initState(room){return {room:room||null,closed:false,v:0,busted:{},cfg:{sb:5,bb:10,stack:1000,turnSec:30,mode:'cash',lvlMin:8,maxRebuys:2},seats:Array(NS).fill(null),running:false,handNo:0,dealer:-1,hand:null,hist:[],sng:null}}
const E=c=>{const e=new Error(c);e.code=c;throw e};
const seatOf=(st,acct)=>st.seats.findIndex(s=>s&&s.acct===acct);
const nextIdx=(from,ok)=>{for(let k=1;k<=NS;k++){const i=((from+k)%NS+NS)%NS;if(ok(i))return i}return -1};
const handLive=st=>!!(st.hand&&st.hand.stage!=='done');
const inLive=(st,i)=>handLive(st)&&st.hand.p[i]&&!st.hand.p[i].folded;
const sngOn=st=>!!(st.cfg.mode==='sng'&&st.sng&&!st.sng.done);
function blinds(st,now){
  if(!sngOn(st))return {sb:st.cfg.sb,bb:st.cfg.bb,level:0,next:null};
  const ms=Math.max(1,st.cfg.lvlMin||8)*60000,l=Math.min(LV.length-1,Math.floor((now-st.sng.startedAt)/ms));
  return {sb:Math.max(1,Math.round(st.cfg.sb*LV[l])),bb:Math.max(2,Math.round(st.cfg.bb*LV[l])),level:l,next:l<LV.length-1?st.sng.startedAt+(l+1)*ms:null,nsb:l<LV.length-1?Math.round(st.cfg.sb*LV[l+1]):null,nbb:l<LV.length-1?Math.round(st.cfg.bb*LV[l+1]):null};
}

function sit(st,who,seat){
  if(seatOf(st,who.acct)>=0)E('already_seated');
  if(sngOn(st))E('sng_running');if(st.closed)E('room_closed');
  const mx=maxSeats(st);
  if(seat==null||seat<0)seat=st.seats.findIndex((s,i)=>!s&&i<mx);
  if(seat<0||seat>=mx)E('full');if(st.seats[seat])E('seat_taken');
  const used=(st.busted||{})[who.acct]||0,mr=rebuyMax(st);
  if(used>mr)E('no_rebuys');
  st.seats[seat]={acct:who.acct,pid:who.pid||null,name:String(who.name||'?').slice(0,24),stack:st.cfg.stack,away:false,rebuys:used};
  st.lonelyAt=null;

}
function leave(st,priv,who,now){
  const i=seatOf(st,who.acct);if(i<0)return false;

    const h=st.hand;

    else{h.p[i].folded=true;h.p[i].la='Fold';h.last=h.p[i].name+': fold';progress(st,priv,now,null)}
  }

function rebuy(st,who){

  if(sngOn(st))E('sng_running');

function setAway(st,who,away){const i=seatOf(st,who.acct);if(i<0)E('not_seated');st.seats[i].away=!!away;return true}
function config(st,c){

  const sb=n(c.sb,1,100000),bb=n(c.bb,2,200000),stack=n(c.stack,10,10000000),t=n(c.turnSec||st.cfg.turnSec,10,120);

function start(st,priv,now){

const rebuyMax=st=>{const m=st.cfg.maxRebuys;return m==null?2:m};

  }
  if(live){const t=h.toAct!=null&&st.seats[h.toAct];return `<div class="v2-turn wide">${t?`<span>Tocca a <b>${esc(t.bot?t.name:firstName(t.name))}</b></span><span class="tsec-w" data-dl="${h.deadline}"><span class="tsec"></span></span>`:'<span>Si girano le carte…</span>'}</div>`}
  if(h&&h.stage==='done'&&P&&!(h.reveal&&h.reveal[me])&&S.vt.cardsHand===h.no&&S.vt.cards){

  }
  if(st.sng&&st.sng.done&&!HE.sngOn(st)&&F.vt.hideRes!==st.sng.endedAt)return '';

  return `<div class="v2-wait">${HE.eligible(st).length<2?'Servono almeno 2 giocatori con fiches':'Si mescola…'}</div>`;

/* ---------- animazioni ---------- */
function fxFly(fromEl,toEl,html,cls,delay,dur){
  const fx=$$id('v2-fx');if(!fx||!fromEl||!toEl)return;
  const a=relRect(fromEl),b=relRect(toEl);
  const d=document.createElement('div');d.className='v2-fly '+(cls||'');d.innerHTML=html;
  const ax=a.x+a.w/2,ay=a.y+a.h/2,bx=b.x+b.w/2,by=b.y+b.h/2;
  d.style.left=ax+'px';d.style.top=ay+'px';d.style.transitionDuration=(dur||420)+'ms';d.style.transitionDelay=(delay||0)+'ms';
  fx.appendChild(d);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{d.style.transform=`translate(${bx-ax}px,${by-ay}px)`;d.classList.add('go')}));
  setTimeout(()=>d.remove(),(delay||0)+(dur||420)+80);
}
function vtAnimate(prev,st,me){
  if(!st||!st.hand||!prev)return;
  const h=st.hand,ph=prev.hand;
  const potEl=$$id('v2-pot');
  // nuova mano: le carte volano dal centro ai posti
  if(!ph||ph.no!==h.no){
    const center=$$id('v2-c2'),order=Object.keys(h.dealOrder||{});
    let k=0,i=h.dealer;const seq=[];for(let n=0;n<9;n++){i=(i+1)%9;if(h.p[i])seq.push(i)}
    [0,1].forEach(r=>seq.forEach(s=>{const to=$$id('vs'+s).querySelector(s===me?'.st-plate':'.st-cards');fxFly(center,to,cardHTML(null,'s'),'fcard',(r*seq.length+k%seq.length)*110,380);k++}));
    for(let n=0;n<seq.length*2;n++)SND.card(n*.11);
    // i bui
    [h.sb,h.bb].forEach(s=>{if(h.p[s]&&h.p[s].bet)bump('vb'+s)});
    return;
  }
  // puntate cresciute
  let chips=0;Object.keys(h.p).forEach(k=>{const a=(ph.p[k]&&ph.p[k].bet)||0,b=h.p[k].bet||0;if(b>a&&h.stage===ph.stage){chips++;bump('vb'+k)}});
  if(chips)SND.chip(3);
  // ultima mossa: lascia/passa
  Object.keys(h.p).forEach(k=>{const a=ph.p[k]&&ph.p[k].la,b=h.p[k].la;if(b!==a){if(b==='Lascia'){SND.fold();if(+k!==me){const from=$$id('vs'+k);fxFly(from&&from.querySelector('.st-av'),$$id('v2-c2'),`<span class="st-cc">${cardHTML(null,'s')}${cardHTML(null,'s')}</span>`,'muck',0,420)}}else if(b==='Passa')SND.check()}});
  // fine del giro: le puntate vanno nel piatto
  if(ph.stage!==h.stage){
    let n=0;Object.keys(ph.p).forEach(k=>{const b=ph.p[k].bet||0;if(b>0){fxFly($$id('vb'+k),potEl,`<span class="chips">${chipStack(b)}</span>`,'chip',n*40,420);n++}});
    if(n)SND.chip(4);
  }
  // fine mano: il piatto va ai vincitori
  if(ph.stage!=='done'&&h.stage==='done'&&h.results){
    const W=h.results.filter(r=>r.win>0);
    W.forEach((r,j)=>{const to=$$id('vs'+r.seat);fxFly(potEl,to,`<span class="chips">${chipStack(r.win)}</span>`,'chip big',(h.reveal?900:350)+j*120,560)});
    setTimeout(()=>{W.some(r=>r.seat===me)?SND.win():SND.chip(5)},(h.reveal?900:350)+400);
  }
}
function bump(id){const el=$$id(id);if(!el)return;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}

/* ---------- pre-azioni ---------- */
function vtPreFire(st,me){
  const pre=F.vt.pre;if(!pre||!st||!st.hand)return;
  const h=st.hand;
  if(h.no!==pre.no||h.stage!==pre.stage||h.stage==='done'){F.vt.pre=null;return}
  if(h.toAct!==me||S.vt.busy)return;
  const P=h.p[me],toCall=Math.max(0,h.curBet-P.bet);
  let move=null;
  if(pre.k==='cf')move=toCall?'fold':'check';
  else if(pre.k==='ck')move=toCall?null:'check';
  else if(pre.k==='cl')move=h.curBet===pre.bet?(toCall?'call':'check'):null;
  else if(pre.k==='ca')move=toCall?'call':'check';
  F.vt.pre=null;
  if(move)setTimeout(()=>vtDo('act',{move:{type:move}}),250);else vtPaint();
}

vtApply=function(st){

function vtRoomGone(rid){
  const last=S.vt.rooms[rid];delete S.vt.rooms[rid];
  if(rid===S.vt.rid){const st=S.vt.st||last;if(st){st.closed=true;S.vt.gone=st}if(V.name==='vt')render()}
  else if(V.name==='vlobby'||V.name==='mode')render();

vtLoad=async function(){
  if(!S.table||!BASE)return;const tid=S.table.id;
  try{
    const {data,error}=await BASE.sb.from('hpl_vr').select('room_id,state').eq('table_id',tid);
    if(error){
      const r=await BASE.fn('hpl-holdem',{table_id:tid,action:'list'}).catch(()=>null);
      if(r&&r.rooms){S.vt.missing=false;S.vt.roomsLoaded=true;const seen={};r.rooms.forEach(x=>{if(x&&x.room){seen[x.room.id]=1;vtApply(x)}});Object.keys(S.vt.rooms).forEach(k=>{if(!seen[k])vtRoomGone(k)});if(V.name==='vlobby'||V.name==='mode')render();return}
      if(/hpl_vr|relation|schema cache|does not exist/i.test(error.message||'')){S.vt.missing=true;if(['vt','vlobby','mode'].includes(V.name))render()}
      return}
    if(!S.table||S.table.id!==tid)return;
    S.vt.missing=false;S.vt.roomsLoaded=true;
    const seen={};(data||[]).forEach(r=>{seen[r.room_id]=1;vtApply(r.state)});
    Object.keys(S.vt.rooms).forEach(k=>{if(!seen[k])vtRoomGone(k)});
    if(S.vt.wantRid){const w=S.vt.wantRid;S.vt.wantRid=null;if(S.vt.rooms[w])vtOpenRoom(w);else toast('Quel tavolo virtuale non esiste più','err')}
    if(V.name==='vlobby'||V.name==='mode')render();
  }catch(e){}
};
vtSubscribe=function(){
  if(S.vt.ch||!S.table||!BASE)return;const tid=S.table.id;
  try{S.vt.ch=BASE.sb.channel('vr-'+tid).on('postgres_changes',{event:'*',schema:'public',table:'hpl_vr',filter:'table_id=eq.'+tid},pl=>{
    if(!S.table||S.table.id!==tid)return;
    if(pl.eventType==='DELETE'){const r=pl.old&&pl.old.room_id;if(r)vtRoomGone(r)}
    else if(pl.new&&pl.new.state)vtApply(pl.new.state);
  }).subscribe()}catch(e){}
  vtLoad();

function vtOpt(move){
  const st=S.vt.st,me=vtSeat();if(!st||!st.hand||st.hand.stage==='done'||st.hand.toAct!==me)return null;
  const prev=JSON.parse(JSON.stringify(st)),n=JSON.parse(JSON.stringify(st)),h=n.hand,P=h.p[me],s=n.seats[me],toCall=Math.max(0,h.curBet-P.bet);
  if(move.type==='fold'){P.folded=true;P.la='Lascia'}
  else if(move.type==='check'){if(toCall>0)return null;P.la='Passa'}
  else if(move.type==='call'){const a=Math.min(toCall,s.stack);P.bet+=a;P.contrib+=a;s.stack-=a;P.la=s.stack?'Chiama':'All-in'}
  else{const to=move.type==='allin'?P.bet+s.stack:Math.min(+move.amount,P.bet+s.stack);if(!(to>h.curBet))return null;const a=to-P.bet;P.bet=to;P.contrib+=a;s.stack-=a;P.la=s.stack?(h.curBet?'Rilancia':'Punta'):'All-in';h.curBet=to}
  h.toAct=null;S.vt.st=n;S.vt.optPending=true;F.vt.raise=null;render();
  return prev;
}
function vtMove(move){
  const prev=vtOpt(move);
  return vtDo('act',{move}).then(r=>{S.vt.optPending=false;if(!r&&prev&&S.vt.st&&S.vt.st.v===prev.v){S.vt.st=prev;S.vt.painted=prev;render()}return r});
}

const MUS=(()=>{

  const BPM=116,BEAT=60/BPM,SW=.64;              /* swing: la seconda croma arriva tardi */
  const f=m=>440*Math.pow(2,(m-69)/12);

  const BARS=['F','F','F','F','Bb','Bb','F','F','C','Bb','F','C'];
  const BASSLINE={F:[29,33,36,34],Bb:[34,38,41,39],C:[36,40,43,41]};   /* tonica, terza, quinta, approccio */
  const VOICE={F:[57,60,63,67],Bb:[58,62,65,69],C:[58,64,67,70]};      /* accordi di settima con la nona */
  const RIFF=[[0,53],[.66,56],[1,57],[1.5,56],[2,53],[3,51],[3.66,53]];/* frase blues sulla scala di Fa */

  }
  const vol=()=>S.vt.music===false?0:(Date.now()<duck?.34:1.25);
  const sw=b=>Math.floor(b)*BEAT+(b%1?SW*BEAT:0);   /* posizione della croma swingata */
  function voice(t,fr,dur,v,type,det,atk){

  function bass(t,m,v){

  function hit(t,freq,q,v,dur,type){
    const len=Math.max(32,Math.floor(A.sampleRate*dur)),b=A.createBuffer(1,len,A.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,type==='ride'?2.2:3.4);

    const bp=A.createBiquadFilter();bp.type=type==='ride'?'highpass':'bandpass';bp.frequency.value=freq;bp.Q.value=q;

      /* contrabbasso in quattro */
      bass(t,BASSLINE[ch][beat],.62);
      /* ride: colpo sul battere, e la terzina su 2 e 4 */
      hit(t,7000,.6,beat%2?.1:.072,.16,'ride');
      if(beat===1||beat===3)hit(t+SW*BEAT,7600,.6,.066,.12,'ride');
      /* spazzola sul rullante, 2 e 4 */
      if(beat===1||beat===3)hit(t,2600,1.1,.115,.1);
      /* pianoforte: accordo sul 2 e sulla croma dopo il 3 */
      if(beat===1)piano(t,VOICE[ch],.115,.46);
      if(beat===2)piano(t+SW*BEAT,VOICE[ch],.082,.34);
      /* la frase di testa torna all'inizio di ogni giro */
      if(beat===0&&bar%12===0)RIFF.forEach(([b,m])=>voice(t+sw(b),f(m),.3,.145,'triangle',0,.02));
      if(beat===0&&bar%12===6)RIFF.forEach(([b,m])=>voice(t+sw(b),f(m+5),.28,.12,'triangle',0,.02));
      next+=BEAT;step++;
    }
  }
  return {
    on(){if(S.vt.music===false)return;if(!ctx())return;if(next<A.currentTime)next=A.currentTime+.1;if(!timer)timer=setInterval(schedule,180);schedule()},
    off(){if(timer){clearInterval(timer);timer=null}if(mg&&A)mg.gain.setTargetAtTime(0,A.currentTime,.2)},
    duck(ms){duck=Date.now()+(ms||1200)},
    tap(){return A?{A,node:mg}:null}
  };
})();

function tbPhoto(id){

function imgCover(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad'))};
    im.onload=()=>{
      try{
        const W=900,H=506,c=document.createElement('canvas');c.width=W;c.height=H;
        const g=c.getContext('2d'),r=Math.max(W/im.width,H/im.height),w=im.width*r,h=im.height*r;
        g.drawImage(im,(W-w)/2,(H-h)/2,w,h);URL.revokeObjectURL(url);
        let q=.72,d=c.toDataURL('image/jpeg',q);
        while(d.length>250000&&q>.35){q-=.12;d=c.toDataURL('image/jpeg',q)}
        if(d.length>380000)return rej(new Error('big'));
        res(d);
      }catch(e){rej(e)}
    };
    im.src=url;
  });
}

  tbback(){F.tb.err='';F.tbStep=F.tbStep==='create'?'warn':null;ENTER='back';render()},
  tbshow(d){F.tb.err='';F.tb.mode=d.m;F.tbStep=d.m==='create'?'warn':'join';render()},
  tbcard(d){openSheet({type:'tcard',id:d.id})},
  tcover(d){openSheet({type:'tcover',id:d.id})},
  tcovphoto(d){tbPhoto(d.id)},
  async tcovpick(d){if(await tbSetCover(d.id,d.v)){SH=null;render();toast(d.v?'Immagine aggiornata':'Immagine rimossa','ok')}},
  tdel(d){F.tdel={name:'',pin:'',err:'',busy:false};openSheet({type:'tdel',id:d.id})},
  tleave(d){F.tdel={name:'',pin:'',err:'',busy:false};openSheet({type:'tleave',id:d.id})},
  async tdelok(d){
    const t=myTable(d.id);if(!t)return;const f=F.tdel;
    f.busy=true;f.err='';render();
    let r;try{r=await BASE.rpc('hpl_delete_table',{p_tid:d.id,p_pin:f.pin})}
    catch(e){const m=errMsg(e);f.busy=false;f.err=/hpl_delete_table|function/.test(m)?'Il database non è aggiornato: lancia tavoli.sql su Supabase.':m;render();return}
    f.busy=false;
    if(r==='bad_pin'){f.err='PIN errato.';render();return}
    if(r==='not_manager'){f.err='Solo il gestore del tavolo può eliminarlo.';render();return}
    if(r!=='ok'){f.err='Non sono riuscito a eliminare il tavolo.';render();return}
    SH=null;F.tdel={name:'',pin:'',err:'',busy:false};
    if(S.table&&S.table.id===d.id){await backToTables()}else{try{await refreshMe()}catch(e){}}
    render();toast(t.name+' è stato eliminato','ok');
  },
  async tleaveok(d){
    const t=myTable(d.id);if(!t)return;const f=F.tdel;
    f.busy=true;f.err='';render();
    const ok=await checkMyPin(f.pin);
    if(!ok){f.busy=false;f.err=ok===null?'Riprova tra poco.':'PIN errato.';render();return}
    try{await BASE.rpc('hpl_leave_table',{p_tid:d.id})}catch(e){f.busy=false;f.err=errMsg(e);render();return}
    f.busy=false;SH=null;F.tdel={name:'',pin:'',err:'',busy:false};
    try{await refreshMe()}catch(e){}
    render();toast('Sei uscito da '+t.name,'ok');
  }
});

/* messaggi d'errore che indirizzano alla scelta giusta */
const _doTableT3=doTable;
doTable=async function(){
  const before=F.tbStep;
  await _doTableT3();
  const e=F.tb.err;if(!e){F.tbStep=null;F.tbOpen=false;return}
  if(/Esiste già un tavolo/.test(e))F.tb.err='Esiste già un tavolo con questo nome: è quasi certo che sia quello dei tuoi amici. Torna indietro ed entra con la sua password.';
  if(/Nessun tavolo con questo nome/.test(e))F.tb.err='Nessun tavolo si chiama così. Controlla come è scritto: il nome lo decide chi ha creato il tavolo. Non creare un tavolo nuovo se il gruppo ne ha già uno.';
  if(before)render();
};
const _backT3=backToTables;
backToTables=async function(){F.tbStep=null;F.tb.err='';await _backT3()};
const _openT3=openTable;
openTable=async function(t){F.tbStep=null;SH=null;return _openT3(t)};

/* ---------- tavolino in miniatura ---------- */
function vtMiniSvg(ms,names,big){
  const L=ms<=2?SP2:ms<=6?SP6:SP,W=big?168:76,H=big?108:50,r=big?9:5;
  const seats=L.slice(0,ms).map(([x,y],i)=>{
    const cx=(x/100*W).toFixed(1),cy=(y/100*H).toFixed(1),n=names[i];
    if(!n)return `<circle cx="${cx}" cy="${cy}" r="${r-1}" fill="rgba(0,0,0,.35)" stroke="rgba(255,255,255,.35)" stroke-width="1" stroke-dasharray="2 2"/>`;
    const me=n===true;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${me?'#E4B656':`hsl(${hueOf(n)} 60% 46%)`}" stroke="${me?'#FFF4D2':'#F4ECDC'}" stroke-width="${big?2:1.4}"/>`;
  }).join('');
  return `<svg class="vmini${big?' big':''}" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><ellipse cx="${W/2}" cy="${H/2}" rx="${W*.36}" ry="${H*.31}" fill="#5A3424"/><ellipse cx="${W/2}" cy="${H/2}" rx="${W*.36-(big?5:3)}" ry="${H*.31-(big?5:3)}" fill="url(#vmf${big?'b':''})"/><defs><radialGradient id="vmf${big?'b':''}" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#22966C"/><stop offset="1" stop-color="#0B4232"/></radialGradient></defs>${seats}</svg>`;
}
const vtMiniOf=(st,big)=>{const ms=HE.maxSeats(st),acct=myAcct();return vtMiniSvg(ms,st.seats.slice(0,ms).map(x=>x?(x.acct===acct?true:x.name):null),big)};
const vtFmt=st=>(st.cfg.game==='omaha'?'Omaha · ':'')+(st.room&&st.room.local?'Contro il computer':st.cfg.mode==='sng'?'Torneo':HE.maxSeats(st)===2?'Testa a testa':'Cash');
const vtRebTxt=m=>m>=99?'illimitate':m?String(m):'nessuna';
function vtRules(cfg,ms){
  const r=[['Formato',cfg.mode==='sng'?'Torneo Sit & Go':ms===2?'Testa a testa (cash)':'Cash game'],['Posti',String(ms)],[cfg.mode==='sng'?'Bui iniziali':'Bui',fchip(cfg.sb)+' / '+fchip(cfg.bb)],['Fiches iniziali',fchip(cfg.stack)+' · '+Math.round(cfg.stack/cfg.bb)+' bui'],['Tempo per turno',cfg.turnSec+' secondi']];
  r.push(cfg.mode==='sng'?['Livelli dei bui','ogni '+(cfg.lvlMin||6)+' minuti']:['Ricariche a testa',vtRebTxt(cfg.maxRebuys==null?2:cfg.maxRebuys)]);
  return r;
}
const vtRulesHtml=(cfg,ms)=>`<div class="vrules">${vtRules(cfg,ms).map(([k,v])=>`<div><span>${k}</span><b class="num">${esc(v)}</b></div>`).join('')}</div>`;
function vtJoinLabel(st){
  const acct=myAcct(),mine=st.seats.some(x=>x&&x.acct===acct);
  if(st.closed)return ['Risultati','ghost'];
  if(mine)return ['Torna al tavolo','gold'];
  if(HE.sngOn(st))return ['Guarda','ghost'];
  const free=st.seats.some((x,i)=>!x&&i<HE.maxSeats(st));if(!free)return ['Guarda','ghost'];
  if(st.busted&&st.busted[acct])return HE.rebuysLeft(st,acct)>0?['Rientra','gold']:['Guarda','ghost'];
  return ['Siediti','gold'];
}

  const isMine=st=>st.seats.some(x=>x&&x.acct===acct);
  const rank=st=>{const[,c]=roomStatus(st);return c==='live'?0:c==='wait'?1:2};
  const mine=all.filter(st=>isMine(st)&&!st.closed),rest=all.filter(st=>!mine.includes(st)).sort((a,b)=>rank(a)-rank(b)||((b.room.createdAt||0)-(a.room.createdAt||0)));
  const top=`<div class="vl-top"><button class="back-l" data-act="mode">${ico('back',20)}${esc(S.table.name)}</button><span class="row" style="gap:8px"><button class="vl-ib ${F.vt.chatOpen?'on':''}" data-act="vtchat" aria-label="Chat del tavolo">${ico('chat',20)}${u?`<i class="v2-dot">${u>9?'9+':u}</i>`:''}</button><button class="vl-ib" data-act="vtinvite" aria-label="Invita a giocare">${ico('uplus',20)}</button></span></div>

  const meta=st=>{const b=HE.blinds(st,vtNow());return `${st.cfg.mode==='sng'&&HE.sngOn(st)?'livello '+(b.level+1)+' · ':''}bui ${fchip(b.sb)}/${fchip(b.bb)} · ${fchip(st.cfg.stack)} fiches`};

  const gart=st=>st.cfg.game==='omaha'?`<span class="pk-cards pkt-cards o"><span class="c1">${cardHTML('Ad','b')}</span><span class="c2">${cardHTML('Kd','b')}</span><span class="c3">${cardHTML('Qs','b')}</span></span>`:`<span class="pk-cards pkt-cards"><span class="c1">${cardHTML('As','b')}</span><span class="c2">${cardHTML('Kh','b')}</span></span>`;
  const hero=st=>{const me=st.seats.find(x=>x&&x.acct===acct),[stt,cls]=roomStatus(st),b=HE.blinds(st,vtNow()),rid=esc(st.room.id);
    return `<div class="pkt pkt-${gkind(st)}"><span class="pk-rays"></span>${gart(st)}
<button class="pkt-go" data-act="vtopen" data-rid="${rid}" aria-label="Torna a ${esc(st.room.name)}">
<span class="pkt-pills"><i class="pk-pill ${cls==='live'?'live':''}">${cls==='live'?'● ':''}${esc(stt)}</i><i class="pk-pill">${gname(st)}</i><i class="pk-pill">${mode(st)}</i></span>
<b class="pkt-t">${esc(st.room.name)}</b>
<span class="pkt-stats"><span><small>Le tue fiches</small><b class="num">${me.out?'Eliminato':fchip(me.stack)}</b></span><span><small>Bui</small><b class="num">${fchip(b.sb)}/${fchip(b.bb)}</b></span><span><small>Al tavolo</small><b class="num">${st.seats.filter(Boolean).length}/${HE.maxSeats(st)}</b></span></span></button>

  const card=st=>{const [stt,cls]=roomStatus(st),[jl,jc]=vtJoinLabel(st),rid=esc(st.room.id);

const VC_BL=[[5,10,'Micro'],[25,50,'Bassi'],[100,200,'Medi'],[500,1000,'Alti']];
const VC_DEPTH=[[50,'Corto'],[100,'Classico'],[200,'Profondo']];

/* =====================================================================
   IL TAVOLO DA GIOCO, rifatto.
   Un "regista" mette in fila quello che arriva dal server, così niente
   salta: si distribuiscono le carte, le fiches volano davanti ai posti,
   a fine giro finiscono nel piatto, le carte del board si girano una alla
   volta (anche negli all-in), poi si scoprono le mani e il piatto vola al
   vincitore. Le fiches dei giocatori contano fino al nuovo valore.
   ===================================================================== */
const T3={no:null,board:0,lastFlip:0,resAt:0,timer:null,prev:null,stk:{},heroFlip:null,celebrated:null};
const T3_LA={Fold:'Lascia',Check:'Passa',Call:'Chiama',Raise:'Rilancia',Bet:'Punta','All-in':'All-in',Lascia:'Lascia',Passa:'Passa',Chiama:'Chiama',Rilancia:'Rilancia',Punta:'Punta'};
const T3_LAC={Lascia:'fold',Passa:'check',Chiama:'call',Rilancia:'raise',Punta:'raise','All-in':'allin'};
const T3_STAGE={preflop:'Pre-flop',flop:'Flop',turn:'Turn',river:'River'};
/* il tavolo si disegna in un riquadro fisso 380x500 che poi si ingrandisce o rimpicciolisce
   tutto insieme: così è identico su ogni telefono. Ogni posto: [x,y, puntata x,y] in % */
const T3D={w:380,h:500};
const _H=[50,92,50,78],
  _BL6=[14,66,36,64],_TL6=[14,24,35,30],_T6=[50,9,50,25],_TR6=[86,24,65,30],_BR6=[86,66,64,64],
  _BL9=[15,78,34,73],_ML9=[13,52,30,62],_TL9=[15,27,36,31],_TLL9=[33,9,38,22],_TRR9=[67,9,62,22],_TR9=[85,27,64,31],_MR9=[87,52,70,62],_BR9=[85,78,66,73];
const T3_LAY={2:[_H,_T6],3:[_H,_TL6,_TR6],4:[_H,_TL6,_T6,_TR6],5:[_H,_BL6,_TL6,_TR6,_BR6],6:[_H,_BL6,_TL6,_T6,_TR6,_BR6],
  7:[_H,_BL9,_TL9,_TLL9,_TRR9,_TR9,_BR9],8:[_H,_BL9,_ML9,_TL9,_T6,_TR9,_MR9,_BR9],9:[_H,_BL9,_ML9,_TL9,_TLL9,_TRR9,_TR9,_MR9,_BR9]};
const t3Layout=st=>{const ms=Math.max(2,Math.min(9,st?HE.maxSeats(st):9)),T=T3_LAY[ms];return {ms,L:T.map(p=>[p[0],p[1]]),B:T.map(p=>[p[2],p[3]])}};
/* scala del tavolo: riempie lo spazio libero senza deformarsi */
function t3Fit(){
  const tb=$$id('v2-tbl'),stg=tb&&tb.parentElement;if(!stg)return;
  const k=Math.max(.5,Math.min((stg.clientWidth-6)/T3D.w,(stg.clientHeight-22)/T3D.h,1.2));
  if(tb.__k!==k){tb.__k=k;tb.style.transform=`translate(-50%,-50%) scale(${k.toFixed(4)})`}
}
addEventListener('resize',()=>{if(V&&V.name==='vt')t3Fit()});
const t3Sched=(ms,fn)=>{if(T3.timer)return;T3.timer=setTimeout(()=>{T3.timer=null;fn();if(V&&V.name==='vt')vtPaint()},ms)};

/* la mano non è finita sul telefono finché non si è vista: il prossimo giro aspetta */
const t3Settled=()=>{const h=S.vt.st&&S.vt.st.hand;if(!h||h.stage!=='done')return true;return T3.no===h.no&&T3.resAt>0&&Date.now()-T3.resAt>2600};

function t3Tween(el,from,to,ms){
  if(!el)return;if(FX.RM()||from===to){el.textContent=fchip(to);return}
  const t0=performance.now(),step=t=>{if(!el.isConnected)return;const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=fchip(Math.round(from+(to-from)*e));if(k<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

function t3Ctl(st,me,disp){
  if(!st)return `<button class="btn" data-act="vtsit" data-seat="-1">Siediti al tavolo</button>`;
  if(st.closed)return `<button class="btn" data-act="vtlobby">Torna ai tavoli</button>`;
  const h=st.hand,live=vtLive(),s=me>=0&&st.seats[me],P=h&&me>=0&&h.p[me];
  const turnOf=(cls)=>{const t=h&&h.toAct!=null&&st.seats[h.toAct];return `<div class="t3-wait ${cls||''}">${t?`<span class="t3-who">${ava(t.name,'xs')}Tocca a <b>${esc(t.bot?t.name:firstName(t.name))}</b></span><span class="t3-sec" data-dl="${h.deadline}"><span class="tsec"></span></span>`:'<span>Si girano le carte…</span>'}</div>`};
  if(h&&h.stage==='done'&&!disp.showRes)return `<div class="t3-wait wide"><span>Si scoprono le carte…</span></div>`;
  if(me<0){
    const was=vtBusted(st),left=vtLeft(st),free=st.seats.some((x,i)=>!x&&i<HE.maxSeats(st));
    if(HE.sngOn(st))return `<div class="t3-note">Torneo in corso: guardi la partita</div>`;
    if(was&&!left)return `<div class="t3-note">Hai finito le ricariche su questo tavolo <button class="link" data-act="vtlobby">Altri tavoli</button></div>`;
    if(!free)return `<div class="t3-note">Il tavolo è pieno: guardi la partita</div>`;
    return `<button class="btn" data-act="vtsit" data-seat="-1">${ico('plus',18)} ${was?`Rientra con ${fchip(st.cfg.stack)} fiches`:'Siediti al tavolo'}</button>`;
  }
  if(s.away)return `<div class="t3-away"><span>Sei in pausa: salti le mani${HE.sngOn(st)?' (i bui li paghi lo stesso)':''}.</span><button class="btn" data-act="vtback">Torno a giocare</button></div>`;
  if(S.vt.optPending&&h&&h.toAct==null&&h.stage!=='done')return `<div class="t3-wait"><span class="mut">Fatto</span></div>`;
  if(live&&h.toAct===me){
    const toCall=Math.max(0,h.curBet-P.bet),allIn=P.bet+s.stack,maxTo=Math.min(allIn,HE.potCap(st,me)),bb=h.bbAmt||st.cfg.bb,minTo=Math.min(maxTo,h.curBet>0?h.curBet+h.minRaise:bb),canRaise=s.stack>toCall&&maxTo>h.curBet,busy=S.vt.busy?'disabled':'';
    const bar=`<div class="t3-tbar" data-dl="${h.deadline}"><i></i></div>`;
    const rk=h.no+'|'+h.stage+'|'+h.curBet;if(F.vt.raiseKey!==rk){F.vt.raiseKey=rk;F.vt.raise=null}
    let sizer='',val=minTo;
    if(canRaise){
      const step=Math.max(1,st.cfg.sb||1);
      val=Math.max(minTo,Math.min(maxTo,F.vt.raise!=null?F.vt.raise:minTo));
      sizer=`<div class="t3-sz"><div class="t3-szr"><span class="t3-szv num" id="vt-rv">${fchip(val)}</span><button class="t3-step" data-act="vtstep" data-d="-1" aria-label="Meno">−</button><input type="range" id="vt-range" min="${minTo}" max="${maxTo}" step="${step}" value="${val}" aria-label="Quanto punti" style="--f:${maxTo>minTo?((val-minTo)/(maxTo-minTo)*100).toFixed(1):100}%"><button class="t3-step" data-act="vtstep" data-d="1" aria-label="Più">+</button></div></div>`;
    }
    const rl=v=>v>=allIn?`All-in<small class="num">${fchip(v)}</small>`:`${h.curBet?'Rilancia a':'Punta'}<small class="num">${fchip(v)}</small>`;
    return `${bar}${sizer}<div class="t3-acts ${canRaise?'':'two'}"><button class="t3-go fold" data-act="vtmove" data-m="fold" ${busy}>Lascia</button>
<button class="t3-go call" data-act="vtmove" data-m="${toCall?'call':'check'}" ${busy}>${toCall?(toCall>=s.stack?`All-in<small class="num">${fchip(s.stack)}</small>`:`Chiama<small class="num">${fchip(toCall)}</small>`):'Passa'}</button>
${canRaise?`<button class="t3-go raise" data-act="vtraiseok" data-all="${allIn}" ${busy}>${rl(val)}</button>`:''}</div>`;
  }
  if(live&&P&&!P.folded&&!P.allin){
    const toCall=Math.max(0,h.curBet-P.bet),pre=F.vt.pre&&F.vt.pre.no===h.no&&F.vt.pre.stage===h.stage?F.vt.pre:null;
    const opts=[['cf',toCall?'Lascia':'Passa o lascia'],toCall?['cl','Chiama '+fchip(Math.min(toCall,s.stack))]:['ck','Passa'],['ca','Chiamo tutto']];
    return `${turnOf()}<div class="t3-pre">${opts.map(([k,l])=>`<button class="${pre&&pre.k===k?'on':''}" data-act="vtpreact" data-k="${k}" aria-pressed="${pre&&pre.k===k?'true':'false'}"><span class="pchk">${ico('check',13)}</span>${l}</button>`).join('')}</div>`;
  }
  if(live)return turnOf('wide');
  if(h&&h.stage==='done'&&!disp.showRes)return `<div class="t3-wait wide"><span>Si scoprono le carte…</span></div>`;
  if(st.sng&&st.sng.done&&!HE.sngOn(st)&&F.vt.hideRes!==st.sng.endedAt)return '';
  const next=st.running&&HE.eligible(st).length>=2&&h&&h.stage==='done';

/* ---------- disegno ---------- */
vtPaint=function(){

  /* chi ha finito le fiches resta al suo posto finché non si è vista la mano */
  const st=st0&&h&&h.stage==='done'?Object.assign({},st0,{seats:st0.seats.map((x,i)=>x||(h.p[i]&&T3.no===h.no?{acct:h.p[i].acct,pid:null,name:h.p[i].name,stack:0,ghost:true}:null))}):st0;
  let me=st?st.seats.findIndex(x=>x&&x.acct===acct):-1;
  if(me>=0&&st&&st.room)T3.base=me;

  if(S.vt.missing){setH($$id('t3-msg'),'<span class="t3-hint">Il tavolo virtuale va attivato in Supabase.</span>');setH($$id('t3-ctl'),'');return}

  /* --- il regista: quanto della mano si è già visto --- */
  if(h){
    if(T3.no!==h.no){
      const prevNo=T3.no;T3.no=h.no;T3.resAt=0;T3.lastFlip=0;clearTimeout(T3.timer);T3.timer=null;
      T3.board=(prevNo!=null&&h.stage==='preflop')||h.stage==='preflop'?0:h.board.length;

    else if(h.stage==='done'&&!T3.resAt)t3Sched(h.reveal?Math.max(450,650-(now-T3.lastFlip)):250,()=>{const H=S.vt.st&&S.vt.st.hand;if(H&&H.no===T3.no)T3.resAt=Date.now()});
  }
  const showRes=!!(h&&h.stage==='done'&&T3.resAt);
  const disp={showRes};
  const {ms,L,B}=t3Layout(st),base=me>=0?me:(T3.base||0),rel=i=>((i-base)%ms+ms)%ms;
  const won={};if(showRes&&h.results)h.results.forEach(r=>{if(r.win>0)won[r.seat]=r});
  const top=showRes&&h.results&&h.results[0]&&h.results[0].win>0?h.results[0]:null;
  const best=new Set(top&&top.best?top.best:[]);
  const prev=T3.prev,sameHand=prev&&h&&prev.no===h.no;
  const D={no:h?h.no:null,stage:h?h.stage:null,bets:{},la:{},board:T3.board,showRes,inHand:{},rev:{}};

    const [x,y]=L[rel(i)],hero=me>=0&&i===me;
