      setCl(el,canSit?'s3 empty':'s3 off');
      if(canSit){el.dataset.act='vtsit';el.dataset.seat=i;el.setAttribute('role','button');el.setAttribute('aria-label','Siediti qui');setH(el.querySelector('.s3-ava'),`<span class="s3-plus">${ico('plus',20)}</span>`);setH(el.querySelector('.s3-nm'),'Siediti');}
      else{delete el.dataset.act;el.removeAttribute('role');setH(el.querySelector('.s3-ava'),'');setH(el.querySelector('.s3-nm'),'')}
      setH(el.querySelector('.s3-stk'),'');setH(el.querySelector('.s3-cards'),'');setH(el.querySelector('.s3-act'),'');setCl(bt,'b3');setH(bt,'');delete T3.stk[i];continue;
    }
    delete el.dataset.act;el.removeAttribute('role');
    const P=h&&h.p[i],act=live&&h.toAct===i,out=s.out;
    if(P){D.inHand[i]=!P.folded;D.la[i]=P.la||null}
    setCl(el,`s3${hero?' me':''}${act?' act':''}${P&&P.folded?' fold':''}${P&&P.allin&&live?' allin':''}${won[i]?' win':''}${s.away?' away':''}${out?' out':''}${!P&&h&&live&&!out?' wait':''}${el.classList.contains('lft')?' lft':''}${el.classList.contains('rgt')?' rgt':''}${el.classList.contains('topr')?' topr':''}`);
    const ring=el.querySelector('.s3-ring');if(act)ring.dataset.dl=h.deadline;else delete ring.dataset.dl;
    setH(el.querySelector('.s3-ava'),ava(s.name));
    setH(el.querySelector('.s3-nm'),esc(hero?'Tu':s.bot?s.name:firstName(s.name)));
    /* fiches: finché non si è visto chi vince, niente spoiler */
    const winAmt=h&&h.stage==='done'&&!showRes&&h.results?((h.results.find(r=>r.seat===i)||{}).win||0):0;
    const stack=Math.max(0,s.stack-winAmt),sk=el.querySelector('.s3-stk');
    if(out)setH(sk,'Eliminato');else if(s.away&&!P)setH(sk,'In pausa');
    else{const old=T3.stk[i];if(sk.__h!==String(stack)){sk.__h=String(stack);if(old!=null&&old!==stack&&sameHand)t3Tween(sk,old,stack,showRes?900:500);else sk.textContent=fchip(stack)}}
    T3.stk[i]=stack;
    /* carte del posto (le mie sono sotto, grandi) */
    let ch='';
    if(P&&!P.folded&&!hero){
      const rv=h.reveal&&h.reveal[i];D.rev[i]=!!rv;
      if(rv){const fl=!(prev&&prev.no===h.no&&prev.rev&&prev.rev[i]);ch=`<div class="s3-cc up">${rv.map((c,k)=>cardHTML(c,'s',(top?(best.has(c)&&won[i]?'hi ':'dim '):'')+(fl?'flip':''),fl?`animation-delay:${k*90}ms`:'')).join('')}</div>`}
      else ch=`<div class="s3-cc${st.cfg.game==='omaha'?' o4':''}">${(st.cfg.game==='omaha'?[0,1,2,3]:[0,1]).map(()=>cardHTML(null,'s')).join('')}</div>`;
    }
    setH(el.querySelector('.s3-cards'),ch);
    /* etichetta: ultima mossa o vincita */
    let la='';
    if(won[i])la=`<span class="la win num">+${fchip(won[i].win)}</span>`;
    else if(P&&P.folded)la='<span class="la la-fold">Lascia</span>';
    else if(P&&P.la&&live){const t=T3_LA[P.la]||P.la;la=`<span class="la la-${T3_LAC[t]||'call'}">${t}</span>`}
    else if(h&&live&&P&&!P.la&&h.stage==='preflop'&&(i===h.sb||i===h.bb))la=`<span class="la la-blind">${i===h.sb?'P. buio':'G. buio'}</span>`;
    else if(!P&&hero&&h&&live&&!out&&!s.away)la='<span class="la la-blind">Entri alla prossima</span>';
    /* la mossa resta sulla targhetta 2 secondi, poi torna il nome */
    {const k=h?h.no+'|'+la:la;T3.la=T3.la||{};if(!T3.la[i]||T3.la[i].k!==k)T3.la[i]={k,t:now};
     if(la&&!won[i]){const age=now-T3.la[i].t;if(age>2200)la='';else laNext=Math.min(laNext,2250-age)}}
    setH(el.querySelector('.s3-act'),la);
    /* puntata davanti al posto */
    const bet=P&&live?P.bet:0;D.bets[i]=bet;
    setCl(bt,'b3'+(bet?' on':''));setH(bt,bet?`<span class="chips">${chipStack(bet)}</span><b class="num">${fchip(bet)}</b>`:'');
  }
  clearTimeout(T3.laT);if(laNext<1e9)T3.laT=setTimeout(()=>{if(V&&V.name==='vt')vtPaint()},laNext);
  /* mazziere */
  const dbn=$$id('t3-dbtn');
  if(h&&st.seats[h.dealer]&&h.dealer<ms){const [x,y]=L[rel(h.dealer)];const dx=rel(h.dealer)===0?66:x+(50-x)*.2+(x<=50?7:-7),dy=rel(h.dealer)===0?86:y+(50-y)*.2+(y>50?-2:3);dbn.style.left=dx+'%';dbn.style.top=dy+'%';dbn.classList.add('on')}else dbn.classList.remove('on');

  /* --- centro: piatto, board, messaggio --- */
  const potLive=h?(h.stage==='done'?(h.pot||potOf(h)):potOf(h)-betsOf(h)):0;
  const potShown=h&&!showRes?potLive:0;
  const pe=$$id('t3-pot');
  const potTot=h&&!showRes&&h.stage!=='done'?potOf(h):potShown;
  setH(pe,potShown||potTot?`<span class="t3-potv"><b>Piatto: <span class="num">${fchip(potTot)}</span></b>${potShown&&potTot>potShown?`<small>Al centro: <span class="num">${fchip(potShown)}</span></small>`:''}</span>`:'');
  pe.classList.toggle('on',!!(potShown||potTot));
  setH($$id('t3-stg'),h&&!showRes&&h.stage!=='done'?(h.runout?'All-in':T3_STAGE[h.stage]||''):'');
  const board=h?h.board:[];
  for(let k=0;k<5;k++){
    const sl=$$id('t3-c'+k),c=k<T3.board?board[k]:null,cls=c&&top&&top.best?(best.has(c)?'hi':'dim'):'',key=(c||'')+'|'+cls+'|'+(h?h.no:'');
    if(sl.__k!==key){
      const fresh=c&&!(sl.__k&&sl.__k.split('|')[0]===c);
      const delay=fresh&&k<3&&T3.board>=3&&!(prev&&prev.no===h.no&&prev.board>=3)?k*130:0;
      sl.innerHTML=c?cardHTML(c,'b',(fresh?'flip ':'')+cls,fresh?`animation-delay:${delay}ms`:''):'';sl.__k=key;sl.classList.toggle('full',!!c);
      if(fresh)SND.card(delay/1000);
    }
  }
  let msg='';
  if(showRes){const W=h.results.filter(r=>r.win>0),meWin=W.some(r=>r.seat===me);
    msg=`<div class="t3-win ${meWin?'mine':''}"><b>${W.map(r=>r.seat===me?'Hai vinto':esc(firstName(r.name))+' vince').join(' · ')} <span class="num">${fchip(W.reduce((a,r)=>a+r.win,0))}</span></b><span>${W[0].hand?esc(W[0].hand):'Gli altri hanno lasciato'}</span></div>`}
  else if(!h&&st){const n=st.seats.filter(Boolean).length;msg=st.sng&&st.sng.done?'':`<span class="t3-hint">${n<2?(n?'Aspettate un altro giocatore':'Scegli un posto per sederti'):!st.running?(st.cfg.mode==='sng'?'Torneo pronto: si parte quando volete':'Pronti: si parte quando volete'):'Si mescola…'}</span>`}
  else if(!st)msg='<span class="t3-hint">Scegli un posto per sederti</span>';
  setH($$id('t3-msg'),msg);
  setH($$id('v2-over'),sngResultsHtml(st));

  /* --- le mie carte --- */

  let hero='';

    if(won[me]){label='Hai vinto '+fchip(won[me].win)+(won[me].hand?' · '+won[me].hand:'');lc='win'}
    else if(P&&P.folded){label='Hai lasciato';lc='mut'}
    const s=st.seats[me],myStack=Math.max(0,s.stack-(h&&h.stage==='done'&&!showRes&&h.results?((h.results.find(r=>r.seat===me)||{}).win||0):0)),note=!P?(s.out?'Sei fuori dal torneo':s.stack===0?'Hai finito le fiches':s.away?'Sei in pausa':live?'Entri dalla prossima mano':''):'';

<div class="t3-meR">${label?`<span class="t3-hand ${lc}">${esc(label)}</span>`:note?`<span class="t3-note sm">${esc(note)}</span>`:''}<button class="t3-ib emo ${F.vt.emo?'on':''}" data-act="vtemo" aria-label="Reazioni">${ico('smile',21)}</button></div>

  }

function t3Animate(prev,D,st,me){
  if(!st||!st.hand||!prev)return;
  const h=st.hand,potEl=$$id('t3-pot'),center=$$id('t3-c2');
  const seatEl=i=>{const s=$$id('vs'+i);return s&&s.querySelector('.s3-av')};
  if(prev.no!==D.no){
    /* nuova mano: le carte partono dal centro verso ogni posto */
    if(h.stage!=='preflop')return;
    const seq=[];let i=h.dealer;for(let n=0;n<9;n++){i=(i+1)%9;if(h.p[i])seq.push(i)}
    [0,1].forEach(r=>seq.forEach((s,k)=>{const to=s===me?$$id('t3-hero'):$$id('vs'+s).querySelector('.s3-cards');fxFly(center,to,cardHTML(null,'s'),'fcard',(r*seq.length+k)*90,360);SND.card((r*seq.length+k)*.09)}));
    [h.sb,h.bb].forEach(s=>{if(h.p[s]&&h.p[s].bet)fxFly(seatEl(s),$$id('vb'+s),`<span class="chips">${chipStack(h.p[s].bet)}</span>`,'chip',120,380)});
    return;
  }
  /* puntate nuove: le fiches escono dal posto */
  let n=0;
  Object.keys(D.bets).forEach(k=>{const a=prev.bets[k]||0,b=D.bets[k]||0;if(b>a&&prev.stage===D.stage){fxFly(seatEl(k),$$id('vb'+k),`<span class="chips">${chipStack(b-a)}</span>`,'chip',0,340);n++}});
  if(n)SND.chip(3);
  /* chi lascia butta le carte al centro, chi passa bussa */
  Object.keys(D.la).forEach(k=>{const a=T3_LA[prev.la[k]]||prev.la[k],b=T3_LA[D.la[k]]||D.la[k];if(b===a)return;
    if(b==='Lascia'){SND.fold();if(+k!==me){const c=$$id('vs'+k).querySelector('.s3-cards');fxFly(c||seatEl(k),center,`<span class="s3-cc">${cardHTML(null,'s')}${cardHTML(null,'s')}</span>`,'muck',0,420)}}
    else if(b==='Passa')SND.check();});
  /* fine giro: le puntate vanno nel piatto */
  const was=Object.keys(prev.bets).filter(k=>(prev.bets[k]||0)>0&&!(D.bets[k]>0));
  if(was.length&&(prev.stage!==D.stage||D.stage==='done')){was.forEach((k,j)=>fxFly($$id('vb'+k),potEl,`<span class="chips">${chipStack(prev.bets[k])}</span>`,'chip',j*45,420));SND.chip(4)}
  /* si vede chi vince: il piatto vola da lui */
  if(!prev.showRes&&D.showRes&&h.results){
    const W=h.results.filter(r=>r.win>0);
    W.forEach((r,j)=>fxFly($$id('t3-c2'),seatEl(r.seat),`<span class="chips">${chipStack(r.win)}</span>`,'chip big',j*140,620));
    const mine=W.find(r=>r.seat===me);
    setTimeout(()=>{if(mine){SND.win();if(T3.celebrated!==h.no&&mine.win>=(h.bbAmt||st.cfg.bb)*8){T3.celebrated=h.no;FX.confetti({n:70,y:.62,power:11})}}else SND.chip(5)},420);
  }
}

/* =====================================================================
   CONTRO IL COMPUTER — Texas Hold'em e Omaha giocati sul telefono.
   Le stanze "L…" non vanno al server: le gestisce questo modulo con lo
   stesso motore (HE) e con avversari automatici. Il tavolo, il regista e

   Le fiches arrivano dal tuo saldo del casinò (finto, salvato sul telefono).
   ===================================================================== */
const CASINO_START=10000;
const bank=()=>{const v=LS.get('casino',null);return v==null?CASINO_START:+v||0};
const bankSet=v=>{LS.set('casino',Math.max(0,Math.round(v)));};
const BOTS=[['Il Conte','🎩','calmo'],['Lady Fortuna','🍀','pazzo'],['Il Professore','🦉','calmo'],['Zio Tony','🦈','aggressivo'],['La Contessa','💎','calmo'],['Bomber','🐂','aggressivo'],['Il Mago','🐉','pazzo'],['Nonna Pina','🦀','calmo']];
const BOTPIC=Object.fromEntries(BOTS.map(b=>[b[0].toLowerCase(),b[1]]));
const isLocal=rid=>typeof rid==='string'&&rid[0]==='L';
const LR={};          /* rid -> {st,priv,botAt,last} */
const lrSave=()=>{try{const o={};Object.keys(LR).forEach(k=>{o[k]={st:LR[k].st,priv:LR[k].priv}});LS.set('lrooms',o)}catch(e){}};
const lrLoad=()=>{if(lrLoad.done)return;lrLoad.done=1;const o=LS.get('lrooms',{})||{};Object.keys(o).forEach(k=>{if(o[k]&&o[k].st){LR[k]={st:o[k].st,priv:o[k].priv||{},botAt:0,last:Date.now()};S.vt.rooms[k]=JSON.parse(JSON.stringify(o[k].st))}})};

/* --- l'intelligenza degli avversari --- */
const RV='23456789TJQKA';const rv=c=>RV.indexOf(c[0])+2;
function preStrength(hole,omaha){
  if(omaha){let best=0;for(let a=0;a<4;a++)for(let b=a+1;b<4;b++)best=Math.max(best,preStrength([hole[a],hole[b]],false));const suits=new Set(hole.map(c=>c[1])).size;return Math.min(1,best*.85+(suits<=2?.08:0)+.05)}
  const [a,b]=hole.map(rv).sort((x,y)=>y-x),pair=a===b,suited=hole[0][1]===hole[1][1],gap=a-b;
  let s=pair?.5+a/28:(a+b)/40;if(suited)s+=.06;if(gap===1)s+=.04;else if(gap>4)s-=.06;if(a===14)s+=.08;
  return Math.max(.05,Math.min(1,s));
}
function postStrength(hole,board,omaha){
  const ev=omaha?HE.bestOmaha(hole,board):HE.evalHand(hole.concat(board));if(!ev)return .2;
  const base=[.18,.42,.64,.74,.82,.86,.93,.98,1][ev.s[0]];
  let s=base;
  if(ev.s[0]===1){const top=Math.max(...board.map(rv)),p=ev.s[1],mine=hole.some(c=>rv(c)===p);s=mine?(p>=top?.58:.44):.24}
  if(ev.s[0]===0)s=.08+(Math.max(...hole.map(rv))-2)/80;
  return s;
}
function botMove(st,priv,i){
  const h=st.hand,P=h.p[i],s=st.seats[i],hole=priv.holes[s.acct]||[],omaha=st.cfg.game==='omaha';
  const style=(BOTS.find(b=>b[0]===s.name)||[0,0,'calmo'])[2];
  const pot=Object.values(h.p).reduce((a,x)=>a+x.contrib,0),toCall=Math.max(0,h.curBet-P.bet);
  let str=h.board.length?postStrength(hole,h.board,omaha):preStrength(hole,omaha);
  str+=(Math.random()-.5)*(style==='pazzo'?.34:.18);
  const aggr=style==='aggressivo'?1.35:style==='pazzo'?1.2:1;
  const maxTo=Math.min(P.bet+s.stack,HE.potCap(st,i)),minTo=h.curBet>0?h.curBet+h.minRaise:(h.bbAmt||st.cfg.bb);
  const raiseTo=f=>{let to=Math.round((h.curBet+(pot+toCall)*f)/(st.cfg.sb||1))*(st.cfg.sb||1);to=Math.max(minTo,Math.min(maxTo,to));return to>h.curBet&&to>P.bet?{type:to>=P.bet+s.stack?'allin':'raise',amount:to}:null};
  if(!toCall){
    if(str*aggr>.68&&Math.random()<.7)return raiseTo(.5+Math.random()*.4)||{type:'check'};
    if(str*aggr>.42&&Math.random()<.18)return raiseTo(.4)||{type:'check'};
    return {type:'check'};
  }
  const odds=toCall/(pot+toCall);
  if(toCall>=s.stack*.5&&str<.62&&Math.random()<.85)return {type:'fold'};
  if(str<odds*.9+.04&&Math.random()<.9)return {type:'fold'};
  if(str*aggr>.8&&Math.random()<.55)return raiseTo(.7+Math.random()*.5)||{type:'call'};
  return {type:'call'};
}

/* --- il "server" locale: stesse risposte di hpl-holdem --- */
function lrReply(r,extra){return Object.assign({ok:true,state:JSON.parse(JSON.stringify(r.st)),cards:r.priv.hand===(r.st.hand&&r.st.hand.no)&&r.priv.holes?r.priv.holes[myAcct()]||null:null,now:Date.now()},extra||{})}
function lrCreate(b){
  const g=b.game==='omaha'?'omaha':'holdem',n=Math.max(1,Math.min(5,+b.bots||3)),[sb,bb]=b.blinds||[25,50],stack=+b.stack||bb*100;
  if(bank()<stack)return {error:'no_bank'};
  const rid='L'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const st=HE.initState({id:rid,name:(g==='omaha'?'Omaha':'Texas Hold\'em')+' contro il computer',maxSeats:n+1,createdBy:myAcct(),createdAt:Date.now(),local:true});
  st.cfg=Object.assign(st.cfg,{sb,bb,stack,turnSec:40,mode:'cash',maxRebuys:99,game:g});if(g==='omaha')st.cfg.limit='pot';
  const priv={};HE.sit(st,meWho(),0);bankSet(bank()-stack);
  const pool=BOTS.slice().sort(()=>Math.random()-.5).slice(0,n);
  pool.forEach((x,k)=>{HE.sit(st,{acct:'bot'+k+rid,pid:null,name:x[0]},k+1);st.seats[k+1].bot=1});
  st.room.started=true;HE.start(st,priv,Date.now());st.v=1;
  LR[rid]={st,priv,botAt:0,last:Date.now()};lrSave();
  return Object.assign(lrReply(LR[rid]),{rid});
}
function lrHandle(b){
  lrLoad();
  if(b.action==='create'&&b.local)return lrCreate(b);
  const r=LR[b.room_id];if(!r)return {error:'not_found',gone:true};
  const st=r.st,priv=r.priv,now=Date.now(),me=meWho();
  try{
    switch(b.action){
      case 'state':break;
      case 'sit':{if(HE.seatOf(st,me.acct)>=0)break;if(bank()<st.cfg.stack)return {error:'no_bank'};HE.sit(st,me,b.seat==null||b.seat<0?null:b.seat);bankSet(bank()-st.cfg.stack);if(!st.running)HE.start(st,priv,now);break}
      case 'rebuy':{if(bank()<st.cfg.stack)return {error:'no_bank'};HE.rebuy(st,me);bankSet(bank()-st.cfg.stack);break}
      case 'act':HE.act(st,priv,me,b.move,now);break;
      case 'tick':HE.tick(st,priv,now);break;
      case 'start':HE.start(st,priv,now);break;

   BLACKJACK contro il banco. Sabot da 6 mazzi, il banco sta su tutti i
   17, il blackjack paga 3 a 2, raddoppio sulle prime due carte, divisione
   delle coppie (gli assi divisi ricevono una carta sola). Niente assicurazione.
   Le fiches sono quelle del tuo saldo del casinò.

const BJ={shoe:[],cut:0,phase:'bet',bet:LS.get('bjbet',100),last:0,hands:[],cur:0,dealer:[],hole:true,seen:new Set(),busy:false,msg:'',uid:0,stats:LS.get('bjstats',{n:0,w:0,bj:0})};
const BJCHIPS=[[5,'#E8E1D0','#7A6A48'],[25,'#2E9E5B','#0F4D2A'],[100,'#1E1E24','#E4B656'],[500,'#7A2E8E','#3A1244']];
function bjShoe(){const d=[];for(let k=0;k<6;k++)for(const r of '23456789TJQKA')for(const s of 'shdc')d.push(r+s);
  for(let i=d.length-1;i>0;i--){const a=new Uint32Array(1);crypto.getRandomValues(a);const j=a[0]%(i+1);[d[i],d[j]]=[d[j],d[i]]}
  BJ.shoe=d;BJ.cut=Math.floor(d.length*.25)}
const bjDraw=()=>{if(!BJ.shoe.length)bjShoe();return {c:BJ.shoe.pop(),id:++BJ.uid}};
const bjVal=c=>{const r=c[0];return r==='A'?11:'TJQK'.includes(r)?10:+r};
function bjTotal(cards){let t=0,a=0;cards.forEach(x=>{const v=bjVal(x.c);t+=v;if(v===11)a++});while(t>21&&a){t-=10;a--}return {t,soft:a>0}}
const bjIsBJ=h=>h.cards.length===2&&!h.split&&bjTotal(h.cards).t===21;
const bjWait=ms=>new Promise(r=>setTimeout(r,FX.RM()?Math.min(ms,60):ms));
function bjSay(){if(V&&V.name==='bj')render()}

async function bjDeal(){
  if(BJ.busy||BJ.phase!=='bet')return;
  const bet=BJ.bet;if(!(bet>0))return;
  if(bank()<bet){toast('Fiches insufficienti: ricarica il saldo','err');return}
  if(!BJ.shoe.length||BJ.shoe.length<BJ.cut){bjShoe();toast('Sabot nuovo: 6 mazzi mescolati','ok')}
  bankSet(bank()-bet);LS.set('bjbet',bet);BJ.last=bet;
  BJ.busy=true;BJ.phase='deal';BJ.msg='';BJ.at=new Map();BJ.hands=[{cards:[],bet,done:false,res:null}];BJ.cur=0;BJ.dealer=[];BJ.hole=true;
  bjSay();
  for(const who of ['p','d','p','d']){await bjWait(380);(who==='p'?BJ.hands[0].cards:BJ.dealer).push(bjDraw());SND.card();bjSay()}
  await bjWait(350);
  const pBJ=bjIsBJ(BJ.hands[0]),up=bjVal(BJ.dealer[0].c),dBJ=bjTotal(BJ.dealer).t===21;
  if(pBJ||((up===11||up===10)&&dBJ)){BJ.busy=false;return bjDealer(true)}
  BJ.phase='play';BJ.busy=false;bjSay();
}
function bjCanSplit(){const h=BJ.hands[BJ.cur];return BJ.phase==='play'&&h&&h.cards.length===2&&bjVal(h.cards[0].c)===bjVal(h.cards[1].c)&&BJ.hands.length<4&&bank()>=h.bet}
function bjCanDouble(){const h=BJ.hands[BJ.cur];return BJ.phase==='play'&&h&&h.cards.length===2&&bank()>=h.bet&&!(h.split&&h.ace)}
async function bjNext(){
  const h=BJ.hands[BJ.cur];h.done=true;
  const nx=BJ.hands.findIndex(x=>!x.done);
  if(nx>=0){BJ.cur=nx;const n=BJ.hands[nx];if(n.cards.length<2){await bjWait(300);n.cards.push(bjDraw());SND.card();bjSay();if(n.ace||bjTotal(n.cards).t===21){await bjWait(350);return bjNext()}}BJ.busy=false;bjSay();return}
  BJ.busy=false;return bjDealer(false);
}
async function bjAct(a){
  if(BJ.busy||BJ.phase!=='play')return;const h=BJ.hands[BJ.cur];BJ.busy=true;
  if(a==='hit'){h.cards.push(bjDraw());SND.card();bjSay();await bjWait(300);const t=bjTotal(h.cards).t;if(t>21){h.res='bust';SND.fold();bjSay();await bjWait(450);return bjNext()}if(t===21){await bjWait(250);return bjNext()}BJ.busy=false;bjSay();return}
  if(a==='stand'){SND.check();return bjNext()}
  if(a==='double'){if(!bjCanDouble()){BJ.busy=false;return}bankSet(bank()-h.bet);h.bet*=2;h.doubled=true;SND.chip(3);h.cards.push(bjDraw());SND.card();bjSay();await bjWait(450);if(bjTotal(h.cards).t>21){h.res='bust';SND.fold()}return bjNext()}
  if(a==='split'){if(!bjCanSplit()){BJ.busy=false;return}bankSet(bank()-h.bet);SND.chip(3);const ace=bjVal(h.cards[0].c)===11;const n={cards:[h.cards.pop()],bet:h.bet,done:false,res:null,split:true,ace};h.split=true;h.ace=ace;BJ.hands.splice(BJ.cur+1,0,n);bjSay();
    await bjWait(350);h.cards.push(bjDraw());SND.card();bjSay();if(ace||bjTotal(h.cards).t===21){await bjWait(400);return bjNext()}BJ.busy=false;bjSay();return}
  BJ.busy=false;
}
async function bjDealer(natural){
  BJ.busy=true;BJ.phase='dealer';await bjWait(250);BJ.hole=false;SND.card();bjSay();await bjWait(600);
  const live=BJ.hands.some(h=>h.res!=='bust');
  if(live&&!natural){while(bjTotal(BJ.dealer).t<17){BJ.dealer.push(bjDraw());SND.card();bjSay();await bjWait(620)}}
  const d=bjTotal(BJ.dealer).t,dBJ=BJ.dealer.length===2&&d===21;let pay=0,won=0,anyBJ=false;
  BJ.hands.forEach(h=>{
    const t=bjTotal(h.cards).t,pbj=bjIsBJ(h);
    if(h.res==='bust'){return}
    if(pbj&&!dBJ){h.res='bj';pay+=h.bet+Math.floor(h.bet*1.5);won++;anyBJ=true}
    else if(dBJ&&!pbj){h.res='lose'}
    else if(pbj&&dBJ){h.res='push';pay+=h.bet}
    else if(d>21||t>d){h.res='win';pay+=h.bet*2;won++}
    else if(t===d){h.res='push';pay+=h.bet}
    else h.res='lose';
  });
  if(pay)bankSet(bank()+pay);
  const net=pay-BJ.hands.reduce((a,h)=>a+h.bet,0);
  BJ.stats.n++;if(net>0)BJ.stats.w++;if(anyBJ)BJ.stats.bj++;LS.set('bjstats',BJ.stats);
  BJ.msg=anyBJ?'Blackjack!':net>0?'Hai vinto '+fchip(net):net<0?(d>21?'':'Vince il banco'):'Pareggio';
  BJ.net=net;BJ.phase='done';BJ.busy=false;bjSay();
  if(net>0){SND.win();if(anyBJ||net>=BJ.last*2)FX.confetti({n:anyBJ?140:80,y:.55})}else if(net<0)SND.fold();
  if(BJ.bet>bank())BJ.bet=Math.max(0,Math.min(BJ.bet,bank()));
}

/* ---------- regolamenti ---------- */
const RULES={
  holdem:{t:'Texas Hold\'em',p:[
    ['Lo scopo','Vincere le fiches del piatto: o avendo il punto più alto alla fine, o facendo lasciare tutti gli altri prima.'],
    ['Le carte','Ognuno riceve 2 carte coperte. Al centro escono 5 carte comuni: 3 insieme (il flop), poi 1 (il turn) e 1 (il river). Il tuo punto sono le 5 carte migliori tra le tue 2 e le 5 in tavola: puoi usarne 2, 1 o nessuna delle tue.'],
    ['I bui','Prima di ogni mano i due giocatori a sinistra del mazziere (il bottone D) mettono una puntata obbligatoria: piccolo buio e grande buio. Il bottone gira di un posto a ogni mano.'],
    ['I giri di puntata','Ci sono 4 giri: dopo le carte coperte, dopo il flop, dopo il turn e dopo il river. A turno puoi: passare (se nessuno ha puntato), puntare, chiamare (pareggiare la puntata), rilanciare (alzarla) o lasciare (rinunciare alla mano). Un rilancio deve essere almeno grande quanto quello precedente.'],
    ['All-in','Se metti tutte le tue fiches sei all-in: resti nella mano fino alla fine ma puoi vincere solo la parte di piatto che hai coperto. Il resto va in un piatto laterale.'],
    ['Lo showdown','Se dopo il river restano almeno due giocatori, si scoprono le carte: vince il punto più alto. A pari punto si guardano le carte più alte rimaste (il kicker); se è tutto uguale il piatto si divide.'],
    ['In questa app','Senza limite (no-limit): puoi puntare in qualsiasi momento tutte le fiches che hai. Le fiches sono finte.']]},
  omaha:{t:'Omaha Pot Limit',p:[
    ['Come l\'Hold\'em, ma…','Si gioca come il Texas Hold\'em (bui, flop, turn, river, quattro giri di puntata), con due differenze importanti.'],
    ['4 carte, ne usi 2','Ognuno riceve 4 carte coperte. Per fare il punto devi usare esattamente 2 delle tue carte e esattamente 3 di quelle in tavola. Non una di più, non una di meno: se in tavola ci sono quattro cuori e tu ne hai una sola, non hai colore.'],
    ['Pot limit','Il rilancio più alto possibile è grande quanto il piatto: il piatto in quel momento più quello che ti serve per chiamare. Per questo il pulsante di puntata massima si chiama "Max" e non "All-in".'],
    ['Perché è diverso','Con 4 carte a testa le mani forti escono molto più spesso: una coppia o una doppia coppia valgono meno che nell\'Hold\'em, e servono spesso scale, colori e full per vincere.'],
    ['Lo showdown','Si confrontano i punti come nell\'Hold\'em. L\'app ti mostra sotto le tue carte il punto migliore che stai facendo con la regola 2+3.']]},
  blackjack:{t:'Blackjack',p:[
    ['Lo scopo','Battere il banco: fare un punteggio più alto del suo senza superare 21.'],
    ['I valori','Le carte da 2 a 10 valgono il loro numero, figure (J, Q, K) valgono 10, l\'asso vale 11 oppure 1, come conviene. Una mano con un asso contato 11 si dice "morbida" (es. 6/16).'],
    ['La mano','Punti con le fiches e premi Distribuisci: ricevi 2 carte scoperte, il banco una scoperta e una coperta.'],
    ['Le tue scelte','Carta: ne chiedi un\'altra. Stai: ti fermi. Raddoppia: sulle prime due carte raddoppi la puntata e ricevi una sola carta. Dividi: se le prime due carte hanno lo stesso valore le separi in due mani, ognuna con la sua puntata (gli assi divisi ricevono una carta ciascuno).'],
    ['Il banco','Quando hai finito, il banco scopre la carta coperta e tira finché non arriva almeno a 17. Sta su tutti i 17, anche morbidi.'],
    ['I pagamenti','Vinci: ti paga 1 a 1. Blackjack (asso + carta da 10 con le prime due carte): paga 3 a 2. Pareggio: ti tieni la puntata. Se superi 21 hai sballato e perdi subito, anche se poi sballa il banco.'],
    ['In questa app','Sabot da 6 mazzi, rimescolato quando ne resta un quarto. Niente assicurazione. Le fiches sono finte e vengono dal tuo saldo del casinò.']]}
};
const RANKS=[['Scala reale','A, K, Q, J, 10 dello stesso seme',['Ah','Kh','Qh','Jh','Th']],['Scala colore','5 carte in fila dello stesso seme',['9s','8s','7s','6s','5s']],['Poker','4 carte dello stesso valore',['Qd','Qh','Qs','Qc','4d']],['Full','Un tris e una coppia',['Kc','Kd','Kh','7s','7c']],['Colore','5 carte dello stesso seme',['Ad','Jd','8d','6d','2d']],['Scala','5 carte in fila',['Ts','9h','8d','7c','6s']],['Tris','3 carte dello stesso valore',['8h','8c','8s','Kd','3c']],['Doppia coppia','Due coppie',['Jh','Js','4c','4d','9h']],['Coppia','2 carte dello stesso valore',['Ac','Ad','Th','6s','3c']],['Carta alta','Nessuna combinazione: conta la carta più alta',['Ks','Jd','8c','5h','2s']]];

/* ---------- le tue carte arrivano sempre ----------
   Se la richiesta delle carte risponde con la mano precedente, senza carte o
   non risponde, si riprova da soli finché non arrivano (prima si aspettava di
   puntare, perché la risposta alla puntata le contiene). */
const _vtCallCards=vtCall;
vtCall=async function(action,extra,quiet){
  if(action==='state'){S.vt.cardsAskAt=Date.now()}
  const before=S.vt.cardsHand+'|'+JSON.stringify(S.vt.cards);
  const r=await _vtCallCards(action,extra,quiet);
  /* le carte nuove si devono vedere subito, anche se il resto del tavolo non è cambiato */
  if(S.vt.cardsHand+'|'+JSON.stringify(S.vt.cards)!==before&&V&&V.name==='vt')vtPaint();
  return r;
};
setInterval(()=>{
  if(!(V&&V.name==='vt')||document.hidden)return;
  const st=S.vt.st,h=st&&st.hand,i=vtSeat();
  if(!h||i<0||!h.p||!h.p[i]||S.vt.cardsHand===h.no)return;
  const now=Date.now(),last=S.vt.cardsAskAt||0;
  if(S.vt.fetchingCards&&now-last>6000)S.vt.fetchingCards=false;   /* richiesta rimasta appesa */
  if(!S.vt.fetchingCards&&now-last>1200)vtCall('state',{},true);
},400);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&V&&V.name==='vt'&&vtSeat()>=0){S.vt.cardsAskAt=0}});

/* =====================================================================
   Effetti e accessibilità, tutto attorno a render():
   - passaggio tra schermate: la pagina vecchia scivola via mentre entra la nuova
   - ingresso a cascata dei blocchi, cifre che contano fino al valore
   - fogli: chiusura animata, trascinabili verso il basso, Esc, focus intrappolato
   - coriandoli di fiche nei momenti belli (partita chiusa, saldo ricevuto…)
   - aria-pressed / aria-expanded / role=switch sui controlli disegnati a mano
   ===================================================================== */
const FX=(()=>{
  const RM=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
  const root=document.documentElement;
  let lastSig=null,kbd=false,opener=null,lastTi=null;
  const nums=new Map();

  /* le animazioni infinite ripartono a ogni render: le teniamo sincronizzate con l'orologio */
  const sync=()=>root.style.setProperty('--sync',(-(performance.now()%600000)/1000).toFixed(3)+'s');

  /* ---------- cifre che contano ---------- */
  const NUMSEL='.bignum,.hs-big,.tval,.kpi .v,.pod .pa,.lpst,.rkamt,.gc-pot b,.debt .amt,.tblinds';
  const BIG='.bignum,.hs-big,.tval,.pod .pa';
  function parseNum(t){
    const m=/^([+−-]?)\s*(\d{1,3}(?:\.\d{3})+|\d+)(?:,(\d+))?(.*)$/.exec(String(t).trim());
    if(!m)return null;
    const v=parseFloat(m[2].replace(/\./g,'')+(m[3]?'.'+m[3]:''));
    if(!isFinite(v))return null;
    return {sign:m[1],v,dec:(m[3]||'').length,suf:m[4],grp:/\./.test(m[2])};
  }
  function countUp(el,from,to,ms){
    const p=parseNum(el.textContent);if(!p)return;
    const nf=new Intl.NumberFormat('it-IT',{minimumFractionDigits:p.dec,maximumFractionDigits:p.dec,useGrouping:true});
    const fin=el.textContent,t0=performance.now();
    const step=now=>{
      if(!el.isConnected)return;
      const k=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-k,4);
      if(k>=1){el.textContent=fin;return}
      el.textContent=p.sign+nf.format(from+(to-from)*e)+p.suf;
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  function numbers(sig,entered){
    const els=[...document.querySelectorAll('#app '+NUMSEL.split(',').join(',#app '))];
    const seen=new Set();
    els.forEach((el,i)=>{
      if(el.childElementCount)return;
      const p=parseNum(el.textContent);if(!p)return;
      const key=sig+'#'+i;seen.add(key);
      const prev=nums.get(key);nums.set(key,p.v);
      if(RM())return;
      if(entered){if(el.matches(BIG)&&p.v>0)countUp(el,0,p.v,1100)}
      else if(prev!=null&&prev!==p.v)countUp(el,prev,p.v,700);
    });
    if(entered)[...nums.keys()].forEach(k=>{if(!k.startsWith(sig+'#'))nums.delete(k)});
  }

  /* ---------- ingresso a cascata ---------- */
  function stagger(){
    if(RM())return;
    const app=$('#app');if(!app)return;
    const box=app.querySelector('main.pg')||app.querySelector('.wrap')||app.querySelector('.cas-main');if(!box)return;
    let i=0;
    [...box.children].forEach(el=>{
      if(i>=14||el.matches('.bar,.tabs,.hd,script'))return;
      const cs=getComputedStyle(el);if(cs.position==='fixed'||cs.display==='none')return;
      el.style.setProperty('--i',i++);el.classList.add('fx-in');
      setTimeout(()=>el.classList.remove('fx-in'),i*42+760);
    });
    app.classList.add('fx-meter');setTimeout(()=>app.classList.remove('fx-meter'),1400);
  }

  /* ---------- pagina che esce ---------- */
  function ghostPage(old,y,kind){
    const g=document.createElement('div');g.className='page-ghost '+kind;g.setAttribute('aria-hidden','true');g.inert=true;
    const inn=document.createElement('div');inn.style.transform=`translateY(${-y}px)`;
    old.classList.remove('enter-push','enter-back','enter-fade');
    inn.appendChild(old);g.appendChild(inn);document.body.appendChild(g);
    setTimeout(()=>g.remove(),kind==='fade'?260:420);
  }

  /* ---------- fogli ---------- */
  function ghostSheet(back){
    const g=document.createElement('div');g.className='sheet-ghost';g.setAttribute('aria-hidden','true');g.inert=true;
    back.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
    const sh=back.querySelector('.sheet');if(sh)sh.classList.remove('anim','dragging');
    g.appendChild(back);document.body.appendChild(g);setTimeout(()=>g.remove(),360);
  }
  const focusables=el=>[...el.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),textarea:not([disabled]),select,[tabindex]:not([tabindex="-1"])')].filter(n=>n.offsetParent!==null||n===document.activeElement);
  const sigOf=el=>{if(!el||!el.dataset)return null;const d=el.dataset;return d.act?'[data-act="'+d.act+'"]'+(d.gid?'[data-gid="'+d.gid+'"]':'')+(d.pid?'[data-pid="'+d.pid+'"]':'')+(d.id?'[data-id="'+d.id+'"]':''):null};
  function closeSheet(){if(!SH)return;SH=null;render()}

  /* trascinare il foglio verso il basso per chiuderlo */
  let drag=null;
  document.addEventListener('pointerdown',e=>{
    const h=e.target.closest&&e.target.closest('#sheet .grab,#sheet .sheet-body>.row.sp:first-child,#sheet .sheet-body>.vn-head');
    if(!h||e.target.closest('input,textarea,select'))return;
    const sh=h.closest('.sheet');if(!sh)return;
    drag={sh,y0:e.clientY,t0:performance.now(),dy:0,on:false,id:e.pointerId};
  },{passive:true});
  document.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.id)return;
    const dy=e.clientY-drag.y0;
    if(!drag.on){if(Math.abs(dy)<6)return;if(dy<0){drag=null;return}drag.on=true;drag.sh.classList.add('dragging');drag.sh.style.transition='none'}
    drag.dy=dy;drag.sh.style.transform=`translateY(${dy>0?dy:dy/4}px)`;
    const b=drag.sh.parentElement;if(b)b.style.opacity=String(Math.max(.25,1-dy/600));
  },{passive:true});
  const endDrag=e=>{
    if(!drag||(e&&e.pointerId!==drag.id))return;const d=drag;drag=null;if(!d.on)return;
    const v=d.dy/Math.max(1,performance.now()-d.t0);
    if(d.dy>110||v>.65){window.__fxDragClose=true;setTimeout(()=>{window.__fxDragClose=false},300);closeSheet()}
    else{d.sh.classList.remove('dragging');d.sh.style.transition='transform .45s var(--snap)';d.sh.style.transform='';const b=d.sh.parentElement;if(b){b.style.transition='opacity .3s';b.style.opacity=''}}
  };
  document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
  /* il clic che chiude un trascinamento non deve fare altro */
  document.addEventListener('click',e=>{if(window.__fxDragClose){e.stopPropagation();e.preventDefault()}},true);

  /* ---------- tastiera ---------- */
  document.addEventListener('keydown',e=>{
    if(e.key==='Tab'||e.key==='ArrowDown'||e.key==='ArrowUp')kbd=true;
    if(e.key==='Escape'){
      if(SH){e.preventDefault();closeSheet();return}
      if(typeof F!=='undefined'&&F.vt&&F.vt.emo&&typeof vtPaint==='function'){F.vt.emo=false;vtPaint()}
    }
    if(e.key==='Tab'&&SH){
      const sh=document.querySelector('#sheet .sheet');if(!sh)return;
      const f=focusables(sh);if(!f.length){e.preventDefault();sh.focus();return}
      const a=f[0],z=f[f.length-1];
      if(e.shiftKey&&(document.activeElement===a||document.activeElement===sh)){e.preventDefault();z.focus()}
      else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
      else if(!sh.contains(document.activeElement)){e.preventDefault();a.focus()}
    }
    /* tasti Invio/Spazio sugli elementi cliccabili che non sono pulsanti veri */
    if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.matches&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click()}
  },true);
  document.addEventListener('pointerdown',e=>{kbd=false;const t=e.target.closest&&e.target.closest('[data-act]');if(t&&!t.closest('#sheet'))opener=sigOf(t)},true);
  document.addEventListener('focusin',e=>{const t=e.target.closest&&e.target.closest('[data-act]');if(t&&!t.closest('#sheet')&&!SH)opener=sigOf(t)});

  /* ---------- vibrazione leggera al tocco (Android) ---------- */
  document.addEventListener('click',e=>{
    const t=e.target.closest&&e.target.closest('.btn,.tab,button.chip,.pick,.seg button,.v2-go,.vn-opt,.sw');
    if(t&&!t.disabled&&navigator.vibrate&&!RM()){try{navigator.vibrate(t.matches('.btn,.v2-go')?9:5)}catch(x){}}
  },true);

  /* ---------- intestazione che si compatta scorrendo ---------- */
  let ticking=false;
  const onScroll=()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{ticking=false;document.body.classList.toggle('scrolled',scrollY>14)})};
  addEventListener('scroll',onScroll,{passive:true});

  /* ---------- aria sui controlli fatti a mano ---------- */
  function aria(){
    const scope=document;
    scope.querySelectorAll('#app .seg button,#sheet .seg button,#app button.chip,#sheet button.chip,#app button.pick,#sheet button.pick,.vn-opt,.vn-q button,.covgrid button,.v2-preacts button,.hs-seg button').forEach(b=>b.setAttribute('aria-pressed',b.classList.contains('on')?'true':'false'));
    scope.querySelectorAll('.sw').forEach(s=>{const b=s.closest('button');s.setAttribute('aria-hidden','true');if(b){b.setAttribute('role','switch');b.setAttribute('aria-checked',s.classList.contains('on')?'true':'false')}});
    scope.querySelectorAll('.rk>.rkh').forEach(b=>b.setAttribute('aria-expanded',b.parentElement.classList.contains('open')?'true':'false'));
    scope.querySelectorAll('.lp>[data-act="tgl"]').forEach(b=>b.setAttribute('aria-expanded',b.parentElement.classList.contains('open')?'true':'false'));
    scope.querySelectorAll('.dot,.tab-ind,.crown,.rk-bar').forEach(n=>n.setAttribute('aria-hidden','true'));
    scope.querySelectorAll('.tabs .tab').forEach(t=>{if(t.classList.contains('on'))t.setAttribute('aria-current','page');else t.removeAttribute('aria-current')});
    scope.querySelectorAll('.meter:not([role])').forEach(m=>m.setAttribute('aria-hidden','true'));
    scope.querySelectorAll('#app h1').forEach(h=>{if(!h.hasAttribute('tabindex'))h.setAttribute('tabindex','-1')});
  }

  /* ---------- indicatore della scheda attiva ---------- */
  function tabInd(entered){
    const tabs=document.querySelector('#app .tabs');if(!tabs){lastTi=null;return}
    const all=[...tabs.querySelectorAll('.tab')],ti=all.findIndex(t=>t.classList.contains('on'));if(ti<0)return;
    let ind=tabs.querySelector('.tab-ind');
    if(!ind){ind=document.createElement('i');ind.className='tab-ind';ind.setAttribute('aria-hidden','true');tabs.prepend(ind)}
    ind.style.setProperty('--ti',ti);
    if(lastTi!=null&&lastTi!==ti&&!RM()&&ind.animate){
      const w=ind.getBoundingClientRect().width+4;
      ind.animate([{transform:`translateX(${lastTi*w}px) scaleX(1)`},{transform:`translateX(${(lastTi+ti)/2*w}px) scaleX(1.18)`,offset:.45},{transform:`translateX(${ti*w}px) scaleX(1)`}],{duration:520,easing:'cubic-bezier(.34,1.4,.64,1)'});
    }
    lastTi=ti;
  }

  /* ---------- coriandoli di fiche ---------- */
  function confetti(o){
    if(RM())return;o=o||{};
    const c=document.createElement('canvas'),dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;
    c.className='fx-canvas';c.width=W*dpr;c.height=H*dpr;c.setAttribute('aria-hidden','true');document.body.appendChild(c);
    const x=c.getContext('2d');x.scale(dpr,dpr);
    const COL=['#E4B656','#F7E0A6','#C8283E','#2E9E5B','#2F6FD6','#F4ECDC','#7A2E8E'];
    const SU=['♠','♥','♦','♣'];
    const n=o.n||120,ox=(o.x!=null?o.x:.5)*W,oy=(o.y!=null?o.y:.32)*H,P=[];
    for(let i=0;i<n;i++){
      const a=(-90+(Math.random()-.5)*(o.spread||150))*Math.PI/180,sp=(o.power||13)*(.45+Math.random()*.75);
      const k=Math.random(),kind=k<.38?'chip':k<.58?'suit':'foil';
      P.push({x:ox+(Math.random()-.5)*40,y:oy+(Math.random()-.5)*20,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:kind==='chip'?6+Math.random()*5:kind==='suit'?9+Math.random()*7:3+Math.random()*4,
        rot:Math.random()*6.28,vr:(Math.random()-.5)*.3,tilt:Math.random()*6.28,vt:.05+Math.random()*.12,c:COL[i%COL.length],kind,s:SU[i%4],life:0,max:110+Math.random()*70});
    }
    let alive=true;const t0=performance.now();
    const chip=(p,sx)=>{x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.scale(sx,1);x.fillStyle=p.c;x.beginPath();x.arc(0,0,p.r,0,6.283);x.fill();
      x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=p.r*.32;x.setLineDash([p.r*.5,p.r*.42]);x.beginPath();x.arc(0,0,p.r*.78,0,6.283);x.stroke();x.setLineDash([]);
      x.fillStyle='rgba(0,0,0,.18)';x.beginPath();x.arc(0,0,p.r*.42,0,6.283);x.fill();x.restore()};
    const frame=now=>{
      if(!alive)return;x.clearRect(0,0,W,H);let any=false;
      for(const p of P){
        if(p.life>p.max)continue;any=true;p.life++;
        p.vy+=.32;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.tilt+=p.vt;
        const fade=Math.min(1,(p.max-p.life)/30);x.globalAlpha=Math.max(0,fade);
        const sx=Math.cos(p.tilt);
        if(p.kind==='chip')chip(p,Math.max(.15,Math.abs(sx)));
        else if(p.kind==='suit'){x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.scale(Math.max(.2,Math.abs(sx)),1);x.fillStyle=(p.s==='♥'||p.s==='♦')?'#E0384E':'#F4ECDC';x.font=`800 ${p.r*2}px system-ui`;x.textAlign='center';x.textBaseline='middle';x.fillText(p.s,0,0);x.restore()}
        else{x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.scale(1,sx);x.fillStyle=p.c;x.fillRect(-p.r,-p.r*1.6,p.r*2,p.r*3.2);x.restore()}
      }
      x.globalAlpha=1;
      if(!any||now-t0>6000){alive=false;c.remove();return}
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
    try{navigator.vibrate&&navigator.vibrate([14,50,22])}catch(e){}
  }

  /* momenti da festeggiare, riconosciuti dal messaggio che l'app già mostra */
  const PARTY=[[/^Partita chiusa|^Torneo chiuso/,{n:160}],[/^Saldo ricevuto/,{n:120}],[/^Fatto: /,{n:110}],[/^Prenotato!/,{n:70,power:10}],[/^Tavolo pronto/,{n:80}],[/^Profilo collegato/,{n:80}],[/^Partita creata|^Torneo creato/,{n:90}]];
  function onToast(msg,kind){if(kind==='err')return;const m=PARTY.find(p=>p[0].test(msg));if(m)setTimeout(()=>confetti(m[1]),120)}

  /* il tuo risultato positivo, la prima volta che apri il resoconto */
  function celebrate(){
    if(!(typeof V!=='undefined'&&S.me&&S.games))return;
    if(V.name==='tclose')return setTimeout(()=>confetti({n:150,y:.25}),350);
    if(V.name!=='detail')return;
    const g=S.games[V.gid];if(!g||g.status!=='closed'||g.kind==='netting')return;
    const p=plist(g).find(x=>x.playerId===S.me.id);if(!p||!((p.netCents||0)>0))return;
    const k='cel:'+(S.table&&S.table.id)+':'+V.gid,done=LS.get('cel',{});if(done[k])return;
    done[k]=1;const keys=Object.keys(done);if(keys.length>60)delete done[keys[0]];LS.set('cel',done);
    setTimeout(()=>confetti({n:130,y:.22}),550);
  }

  /* ---------- dopo ogni render ---------- */
  function sigNow(){
    if(typeof V==='undefined')return '';
    const a=$('#app'),fc=a&&a.firstElementChild;
    return [S.acct?1:0,S.locked?1:0,S.table?S.table.id:'',S.me?1:0,V.name,V.gid||'',V.k||'',V.pid||'',V.name==='home'?TAB():'',F.tbStep||'',V.name==='close'&&F.cl?F.cl.step:'',fc?fc.className.replace(/\s*enter-\w+/g,''):'',$('#app .loader')?'L':''].join('|');
  }
  function after(prevBack,hadBack){
    sync();
    const nowBack=document.querySelector('#sheet>.back');
    const app=$('#app');
    /* fogli */
    if(hadBack&&!nowBack&&prevBack&&!prevBack.isConnected&&!RM())ghostSheet(prevBack);
    if(nowBack){
      const sh=nowBack.querySelector('.sheet');
      if(sh){sh.setAttribute('aria-modal','true');if(!sh.hasAttribute('tabindex'))sh.setAttribute('tabindex','-1')}
      if(app&&!app.inert)app.inert=true;
      if(!hadBack&&sh){const ae=document.activeElement;if(!ae||!sh.contains(ae))setTimeout(()=>{if(sh.isConnected&&!sh.contains(document.activeElement))sh.focus({preventScroll:true})},30)}
    }else{
      if(app&&app.inert)app.inert=false;
      if(hadBack&&kbd&&opener){const t=document.querySelector('#app '+opener);if(t)t.focus({preventScroll:true})}
    }
    /* schermata */
    const sig=sigNow(),entered=sig!==lastSig;
    if(entered){
      lastSig=sig;
      if(!$('#app .loader'))stagger();
      celebrate();
      if(kbd&&!nowBack){const h=document.querySelector('#app h1');if(h)h.focus({preventScroll:true})}
      onScroll();
    }
    numbers(sig.split('|').slice(0,11).join('|'),entered);
    tabInd(entered);
    aria();
  }
  return {after,ghostPage,confetti,onToast,RM,sync};
})();

const _renderFX=render;
render=function(){
  const nav=typeof ENTER!=='undefined'&&ENTER&&!FX.RM()&&S.acctReady?(ENTER===true?'push':ENTER):null;
  const app=$('#app'),oldPage=nav&&app?app.firstElementChild:null,oldY=scrollY;
  const prevBack=document.querySelector('#sheet>.back'),hadBack=!!prevBack;
  const r=_renderFX.apply(this,arguments);
  if(oldPage&&!oldPage.isConnected&&app.firstElementChild)FX.ghostPage(oldPage,oldY,nav);
  try{FX.after(prevBack,hadBack)}catch(e){console.warn('fx',e)}
  return r;
};
/* i toast: annunciati agli screen reader, escono con garbo, festeggiano quando serve */
toast=function(msg,kind){
  const box=$('#toast');if(!box)return;
  const el=document.createElement('div');el.className='t '+(kind||'ok');el.setAttribute('role',kind==='err'?'alert':'status');
  el.innerHTML=(kind==='err'?ico('close',16):ico('check',16))+'<span></span>';el.lastChild.textContent=msg;box.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),380)},3000);
  FX.onToast(String(msg||''),kind);
};

/* ===== Aggiornamento automatico (anche per l'app installata sul telefono) ===== */
const APP_VERSION='1792046282348';
let updShown=false;
async function checkUpdate(){
  if(updShown||!/^https?:/.test(location.protocol))return;
  try{
    const r=await fetch(location.pathname+'?vcheck='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=(await r.text()).match(/const APP_VERSION='(\d+)'/);
    if(!m||m[1]===APP_VERSION)return;
    updShown=true;const nv=m[1];
    const go=()=>location.replace(location.pathname+'?v='+nv+location.hash);
    if(!S.me&&!SH){go();return}
    const el=document.createElement('div');el.className='upd';
    el.innerHTML='<span>È disponibile una nuova versione</span><button type="button">Aggiorna</button>';
    el.querySelector('button').onclick=go;document.body.appendChild(el);
  }catch(e){}
}
setTimeout(checkUpdate,2500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
setInterval(checkUpdate,15*60*1000);
