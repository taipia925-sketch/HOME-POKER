<meta charset="utf-8">
<title>Home Poker Ledger</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1F17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Poker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Home Poker: app da telefono. Fondo inchiostro, fiches come motivo (avatar a gettone, bordo tratteggiato),
   cifre grandi in Bricolage Grotesque, barra a schede fluttuante, schermate che scorrono. Solo scuro. */
:root{
  --bg:#0E0F13; --bg2:#0E0F13; --card:#16181F; --card2:#20232D; --ink:#1B1E27;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.06);
  --gold:#8E9CFF; --gold-l:#C9D0FF; --gold-d:#6572D6; --ivory:#F4F2ED; --mut:#9EA3B3;
  --red:#FF3B30; --red-bg:rgba(255,59,48,.14); --green:#34C759; --green-bg:rgba(52,199,89,.14);
  --wa:#25D366; --serif:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif; --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gold-g:#8E9CFF; --on-acc:#0B1033;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;background:var(--bg)}
body{margin:0;background:radial-gradient(120% 38% at 50% -8%,rgba(142,156,255,.16),transparent 62%) fixed,var(--bg);color:var(--ivory);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.noscroll{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;transition:transform .12s var(--ease),background-color .2s,border-color .2s,opacity .2s}
button:active:not([disabled]){transform:scale(.965)}
.num{font-variant-numeric:tabular-nums}
svg{flex:none}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:800;color:var(--ivory);text-wrap:balance;letter-spacing:-.02em}
h1{font-size:30px;line-height:1.08}
h2{font-size:22px}
.mut{color:var(--mut)} .gold{color:var(--gold)} .red{color:var(--red)} .green{color:var(--green)}
.sm{font-size:14.5px} .xs{font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.two>*{min-width:0}
.hr{height:1px;background:var(--line2);margin:6px 0}

/* struttura */
.app{max-width:480px;margin:0 auto;min-height:100dvh;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:480px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 150px}
.hd{position:sticky;top:0;z-index:12;display:flex;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 12px;background:linear-gradient(var(--bg) 62%,rgba(14,15,19,0))}
.hd .t1{flex:1;min-width:0}
.hd h1{font-size:34px;letter-spacing:-.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .t2{color:var(--mut);font-size:14.5px;margin-top:2px}
.me-btn{border-radius:50%;padding:3px;background:var(--card2);border:1px solid var(--line)}
.pg{padding:4px 16px 0;display:flex;flex-direction:column;gap:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:16px 4px 0;font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:-.01em}
.sec small{font-family:var(--sans);font-weight:500;color:var(--mut);font-size:14px;letter-spacing:0}
.lbl{font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:20px 4px 10px;color:var(--ivory)}
.lbl.in{margin:0 0 2px;font-size:17px}
.note{margin:0 16px 4px;padding:12px 14px;border-radius:16px;background:rgba(142,156,255,.12);color:var(--gold-l);font-size:14.5px}

/* transizioni tra schermate */
.enter-push{animation:pushIn .36s var(--ease) both}
.enter-back{animation:backIn .36s var(--ease) both}
.enter-fade{animation:fadeIn .26s ease-out both}
@keyframes pushIn{from{opacity:0;transform:translateX(34px)}}
@keyframes backIn{from{opacity:0;transform:translateX(-34px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}}

/* barra a schede */
.tabs{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(calc(100% - 28px),420px);display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;background:rgba(27,30,39,.84);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--line);border-radius:28px;z-index:30;box-shadow:0 20px 44px rgba(0,0,0,.5)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;border-radius:22px;color:var(--mut);font-size:12.5px;font-weight:600}
.tab.on{background:rgba(142,156,255,.17);color:var(--gold-l)}

/* card */
.card{background:var(--card);border-radius:24px;padding:16px;position:relative}
.card.tight{padding:12px 14px;border-radius:20px}
.card.tap{width:100%;text-align:left;display:block}
.card.tap.gcard,.card.tap.row{display:flex}
.card.tap:active{background:var(--card2)}
.hero{position:relative;overflow:hidden;border-radius:30px;padding:22px;background:linear-gradient(155deg,#2A3160 0%,#1B1F36 52%,#171A24 100%);border:1px solid rgba(142,156,255,.3)}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:210px;height:210px;border-radius:50%;border:24px dashed rgba(255,255,255,.07);pointer-events:none}
.hero>*{position:relative;z-index:1}
.bignum{font-family:var(--serif);font-weight:800;font-size:56px;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}

/* pulsanti */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-decoration:none;min-height:56px;border-radius:20px;padding:12px 18px;font-weight:700;font-size:17px;background:var(--gold);color:var(--on-acc);text-align:center}
.btn.ghost{background:var(--card2);color:var(--ivory)}
.btn.dash{background:transparent;border:1.5px dashed rgba(255,255,255,.2);color:var(--gold-l)}
.btn.wa{background:var(--wa);color:#06200e}
.btn.green{background:var(--green);color:#05210d}
.btn.redb{background:var(--red-bg);color:#FF6A60}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn-s{min-height:50px;padding:8px 14px;border-radius:17px;font-weight:600;font-size:15px;background:var(--card2);color:var(--ivory);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-s.go{background:rgba(142,156,255,.18);color:var(--gold-l)}
.link{color:var(--mut);text-decoration:underline;text-underline-offset:3px;min-height:48px;display:inline-flex;align-items:center;font-size:15px}
.back-l{color:var(--gold-l);min-height:48px;display:inline-flex;align-items:center;gap:2px;font-size:16px;font-weight:600;margin-left:-8px;padding-inline:6px}

/* etichette di stato */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.badge.paid{color:#5BE07D;background:var(--green-bg)} .badge.pend{color:#FF6A60;background:var(--red-bg)}
.badge.grey{color:var(--mut);background:rgba(255,255,255,.07)} .badge.live{color:#5BE07D;background:var(--green-bg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pl 1.4s ease-in-out infinite;flex:none}
@keyframes pl{50%{opacity:.25}}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
.pill.red{background:var(--red-bg);color:#FF6A60}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:48px;padding:6px 16px 6px 8px;border-radius:999px;background:var(--card2);font-weight:600;font-size:15px}
.chip.t{padding-left:16px}
.chip.on{background:var(--gold);color:var(--on-acc)}
.chipx{display:inline-flex;align-items:center}
.trash{min-width:44px;min-height:44px;display:grid;place-items:center;color:var(--mut)}
.seg{display:inline-flex;background:var(--ink);border-radius:16px;padding:4px;flex:none}
.seg button{min-height:46px;padding:0 16px;border-radius:12px;font-weight:600;font-size:15px;color:var(--mut)}
.seg button.on{background:var(--gold);color:var(--on-acc)}

/* avatar a gettone */
.ava{--c:hsl(var(--h) 62% 46%);position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--serif);font-weight:800;font-size:16px;color:#fff;background:var(--c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.ava::before{content:"";position:absolute;inset:4px;border-radius:50%;border:2px dashed rgba(255,255,255,.55)}
.ava::after{content:"";position:absolute;inset:9px;border-radius:50%;background:rgba(0,0,0,.18)}
.ava>*,.ava{text-shadow:0 1px 2px rgba(0,0,0,.35)}
.ava{z-index:0}
.ava.s{width:36px;height:36px;font-size:13px}
.ava.s::before{inset:3px;border-width:1.5px}.ava.s::after{inset:7px}
.ava.l{width:56px;height:56px;font-size:19px}
.ava i{position:relative;z-index:1;font-style:normal}
.stk{display:flex}
.stk .ava{margin-left:-11px;box-shadow:0 0 0 3px #1D2140,inset 0 0 0 2px rgba(255,255,255,.18)}
.stk .ava:first-child{margin-left:0}
.stk .more{margin-left:-11px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:13px;font-weight:700;box-shadow:0 0 0 3px #1D2140}

/* campi */
.field{display:flex;flex-direction:column;gap:7px}
.field>span{font-size:14px;color:var(--mut);font-weight:500}
input.in,textarea.in{width:100%;min-height:56px;border-radius:18px;border:2px solid transparent;background:var(--ink);padding:12px 16px;font-size:17px;color:var(--ivory);transition:border-color .2s,background-color .2s;min-width:0}
input[type=date].in,input[type=time].in{font-size:16px;padding-inline:12px;-webkit-appearance:none;appearance:none}
textarea.in{min-height:90px;resize:none;line-height:1.4}
input.in.big-n{font-family:var(--serif);font-size:26px;font-weight:700;min-height:62px;letter-spacing:-.01em}
input.in:focus,textarea.in:focus{border-color:var(--gold);outline:none;background:#20243A}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold-l);outline-offset:2px}
input.in::placeholder,textarea.in::placeholder{color:#5F6477}

/* cassa e numeri */
.meter{display:flex;gap:3px;height:10px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.08)}
.meter i{display:block;height:100%;min-width:0;transition:flex-grow .5s var(--ease)}
.m-g{background:var(--green)} .m-r{background:var(--red)} .m-o{background:var(--gold)}
.cassa .big-n{font-family:var(--serif);font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.kpi{background:rgba(255,255,255,.05);border-radius:18px;padding:12px 8px;text-align:center;min-width:0}
.kpi .k{font-size:13px;font-weight:500;color:var(--mut)}
.kpi .v{font-family:var(--serif);font-size:21px;font-weight:700;margin-top:3px;overflow-wrap:anywhere;letter-spacing:-.01em}
.kpi .s{font-size:12.5px;margin-top:2px;color:var(--gold-l)}
.kpis.two-c>.kpi:last-child:nth-child(odd){grid-column:1/-1}
.ir{display:flex;align-items:center;gap:12px}
.ir .ic{width:40px;height:40px;border-radius:14px;background:rgba(142,156,255,.14);color:var(--gold-l);display:grid;place-items:center;flex:none}

.gcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.gdate{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:-.01em}
.suit{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:rgba(142,156,255,.14);color:var(--gold-l);flex:none}
.dtile{width:54px;height:58px;border-radius:17px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.dtile b{font-family:var(--serif);font-size:23px;font-weight:800;line-height:1}
.dtile span{font-size:12.5px;color:var(--mut);margin-top:2px}
.dtile.live{background:var(--green-bg)}.dtile.live b{color:#5BE07D}
.medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:800;font-size:16px;flex:none;background:rgba(255,255,255,.07);color:var(--mut)}
.medal.m1{background:#F2C94C;color:#3A2C00}.medal.m2{background:#CBD1DC;color:#222733}.medal.m3{background:#D08B5B;color:#2E1503}
.pl-name{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:-.01em;display:flex;gap:8px;align-items:center;flex-wrap:wrap;line-height:1.2}
.pcs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.pcs>div{background:rgba(255,255,255,.05);border-radius:16px;padding:10px 12px;min-width:0}
.pcs span{display:block;font-size:13px;color:var(--mut)}
.pcs b{font-family:var(--serif);font-size:18px;font-weight:700}
.mv{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line2);font-size:15px;flex-wrap:wrap}
.mv .dt{width:9px;height:9px;border-radius:50%;flex:none}
.bdg-btn{min-height:44px;display:inline-flex;align-items:center}
.x{min-width:44px;min-height:44px;display:grid;place-items:center;color:var(--mut)}
.pay2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{min-height:64px;border-radius:20px;background:var(--card2);font-weight:700;font-size:16px;color:var(--mut);border:2px solid transparent}
.big.sel-g{border-color:var(--green);background:var(--green-bg);color:#5BE07D}
.big.sel-r{border-color:var(--red);background:var(--red-bg);color:#FF6A60}
.box{border-radius:20px;padding:14px 16px}
.box.g{background:var(--green-bg)} .box.r{background:var(--red-bg)} .box.o{background:rgba(142,156,255,.14)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:30px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(14,15,19,0),rgba(14,15,19,.96) 36%)}
.bar-in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:2px}
.steps{display:flex;align-items:center;gap:8px;margin:14px 0 18px}
.steps .st{flex:1;display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--mut);font-weight:600}
.steps .st i{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.1);transition:background-color .3s}
.steps .st.on{color:var(--gold-l)} .steps .st.on i{background:var(--gold)}
.tr{display:block;width:100%;text-align:left;border-radius:18px;padding:13px 15px;background:rgba(255,255,255,.05);}
.tr.paid{box-shadow:inset 4px 0 0 var(--green)} .tr.pend{box-shadow:inset 4px 0 0 var(--red)}

/* fogli */
.back{position:fixed;inset:0;background:rgba(5,6,10,.66);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fadeBg .25s ease-out both}
@keyframes fadeBg{from{opacity:0}}
.sheet{width:100%;max-width:480px;max-height:92%;background:#1A1D26;border-radius:30px 30px 0 0;display:flex;flex-direction:column;box-shadow:0 -20px 60px rgba(0,0,0,.55)}
.sheet.anim{animation:up .42s var(--ease)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin:10px auto 0;flex:none}
.sheet-body{overflow:auto;padding:12px 18px calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
#toast{position:fixed;bottom:calc(108px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column-reverse;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:440px}
.t{display:flex;align-items:center;gap:9px;padding:13px 18px;border-radius:999px;font-weight:600;font-size:15px;color:#fff;background:#2A2E3B;box-shadow:0 14px 34px rgba(0,0,0,.5);animation:toastIn .42s var(--ease) both}
@keyframes toastIn{from{opacity:0;transform:translateY(18px) scale(.94)}}
.t.ok svg{color:#5BE07D}.t.err{background:#4A1713}.t.err svg{color:#FF6A60}
.sk{height:96px;border-radius:24px;background:linear-gradient(90deg,#16181F 25%,#20232D 50%,#16181F 75%);background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
pre.preview{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--sans);font-size:14px;color:var(--mut);margin:0}
textarea.ta{width:100%;min-height:200px;border-radius:18px;border:0;background:var(--ink);color:var(--ivory);padding:14px;font-size:14px}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:20px;background:var(--card2);border:2px solid transparent}
.pick.on{border-color:var(--gold);background:rgba(142,156,255,.14)}
.pick .tick{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.2);display:grid;place-items:center;color:transparent;flex:none;transition:all .2s var(--ease)}
.pick.on .tick{background:var(--gold);border-color:var(--gold);color:var(--on-acc)}
.t.u{pointer-events:auto;padding:8px 8px 8px 18px}
.t .undo{margin-left:auto;padding:9px 16px;border-radius:999px;background:rgba(142,156,255,.24);color:var(--gold-l);font-weight:700;font-size:14.5px}
.spark{display:block;touch-action:pan-y;overflow:visible;cursor:crosshair}
@media (max-width:400px){.pg{padding-inline:14px}.bignum{font-size:50px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body:has(.bar) #toast{bottom:calc(178px + env(safe-area-inset-bottom,0px))}
body.noscroll #toast{bottom:auto;top:calc(14px + env(safe-area-inset-top,0px))}

/* saldo finale */
.debt{padding:14px 0}
.debt+.debt{border-top:1px solid var(--line2)}
.debt.done .dl,.debt.done .amt{opacity:.55}
.debt.me .dl b{color:var(--gold-l)}
.debt .dl{font-size:16px;line-height:1.35}
.debt .amt{font-family:var(--serif);font-size:21px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.pair{display:flex;align-items:center;flex:none}
.pair .arr{color:var(--mut);margin:0 -2px;position:relative;z-index:1}
.rrow{border-top:1px solid var(--line2)}.rrow:first-child{border-top:0}
.prow{padding:12px 0;border-top:1px solid var(--line2)}
.sheet input.in,.sheet textarea.in{background:#262A36}
.sheet input.in:focus,.sheet textarea.in:focus{background:#2A2F45}
.pacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.pacts .btn-s{min-height:40px;padding:6px 8px;font-size:13.5px;white-space:normal;line-height:1.15;text-align:center}
.upd{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:90;display:flex;align-items:center;gap:12px;width:min(calc(100% - 24px),440px);padding:10px 10px 10px 18px;border-radius:999px;background:var(--gold);color:var(--on-acc);font-weight:600;font-size:15px;box-shadow:0 14px 34px rgba(0,0,0,.5);animation:toastIn .42s var(--ease) both}
.upd span{flex:1}.upd button{background:var(--on-acc);color:#fff;border-radius:999px;padding:10px 16px;font-weight:700}
</style>

<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
/*PURE-START*/
const sum=a=>a.reduce((x,y)=>x+y,0);
const p2=n=>String(n).padStart(2,'0');

function parseEur(s){s=String(s==null?'':s).trim().replace(/\s|€/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return isFinite(n)&&n>=0?Math.round(n*100):NaN}
function parseCh(s){s=String(s==null?'':s).replace(/[\s.]/g,'');if(!s)return NaN;const n=Number(s);return isFinite(n)&&n>=0?Math.round(n):NaN}
const toEuro=(chips,g)=>Math.round(chips*g.buyInCents/g.chipsPerBuyIn);
const toChips=(c,g)=>Math.round(c*g.chipsPerBuyIn/g.buyInCents);
const dShort=iso=>{const d=new Date(iso);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()};

const plist=g=>Object.values(g.players||{}).sort((a,b)=>a.seq-b.seq);
const inv=p=>sum(p.buyIns.map(b=>b.amountCents));
const safeOf=p=>sum((p.cashOuts||[]).map(c=>c.amountCents));

const grossOf=g=>sum(plist(g).map(inv));

function settle(nets){
  const d=nets.filter(x=>x.net<0).map(x=>({n:x.name,id:x.pid||null,a:-x.net})).sort((a,b)=>b.a-a.a);
  const c=nets.filter(x=>x.net>0).map(x=>({n:x.name,id:x.pid||null,a:x.net})).sort((a,b)=>b.a-a.a);
  const out=[];let i=0,j=0;
  while(i<d.length&&j<c.length){const m=Math.min(d[i].a,c[j].a);out.push({from:d[i].n,to:c[j].n,fromId:d[i].id,toId:c[j].id,amt:m});d[i].a-=m;c[j].a-=m;if(d[i].a===0)i++;if(c[j].a===0)j++}
  return out;
}
function calcClose(g,cl){
  const L=plist(g);
  const dealer=String(cl.dealer||'').trim()===''?0:parseEur(cl.dealer);
  const rows=L.map(p=>{
    const v=cl.vals[p.playerId]||{mode:'chips',v:''};
    let counted=NaN;
    if(String(v.v||'')!==''){counted=v.mode==='chips'?toEuro(parseCh(v.v),g):parseEur(v.v)}
    const s=safeOf(p);
    return {p,counted,s,fin:counted+s,inv:inv(p)};
  });
  if(isNaN(dealer)||rows.some(r=>isNaN(r.counted)))return {ok:false,rows,dealer};
  const totIn=sum(rows.map(r=>r.inv)),totFin=sum(rows.map(r=>r.fin));
  const bal=totIn-dealer-totFin;
  const adj=rows.map(()=>0);
  if(bal!==0){
    let idx=rows.map((_,i)=>i);
    if(bal<0&&cl.holeMode==='split_winners'){const w=idx.filter(i=>rows[i].fin-rows[i].inv>0);if(w.length)idx=w}
    const n=idx.length,base=Math.trunc(bal/n),rem=bal-base*n;
    idx.forEach(i=>{adj[i]=base});
    const step=rem>0?1:-1;
    for(let k=0;k<Math.abs(rem);k++)adj[idx[k]]+=step;
  }
  const nets=rows.map((r,i)=>({name:r.p.playerName,pid:r.p.playerId,net:r.fin-r.inv+adj[i],fin:r.fin,inv:r.inv}));
  if(dealer>0)nets.push({name:'Dealer',pid:'dealer',net:dealer,dealer:true});
  const sumNet=sum(nets.map(x=>x.net));
  return {ok:true,rows,dealer,totIn,totFin,bal,nets,sumNet,tx:settle(nets)};
}
function recompute(d){
  d.paidAmount=sum(d.transactions.filter(t=>t.status==='PAID').map(t=>t.amount));
  d.remainingAmount=sum(d.transactions.filter(t=>t.status==='PENDING').map(t=>t.amount));
}
function dPayFull(d,sid,now){const t=d.transactions.find(x=>x.subId===sid);if(!t||t.status!=='PENDING')return false;t.status='PAID';t.lastUpdated=now;recompute(d);return true}
function dPartial(d,sid,amt,now){
  const i=d.transactions.findIndex(x=>x.subId===sid),t=d.transactions[i];
  if(!t||t.status!=='PENDING'||!(amt>0))return false;
  if(amt>=t.amount)return dPayFull(d,sid,now);
  d.transactions.splice(i,1,{subId:nid('s'),amount:amt,status:'PAID',lastUpdated:now},{subId:nid('s'),amount:t.amount-amt,status:'PENDING',lastUpdated:now});
  recompute(d);return true;
}
function dModify(d,sid,newAmt,now){
  const i=d.transactions.findIndex(x=>x.subId===sid),t=d.transactions[i];
  if(!t||t.status!=='PAID'||!(newAmt>0))return false;
  const diff=newAmt-t.amount;if(diff===0)return false;
  const pi=d.transactions.findIndex(x=>x.status==='PENDING');
  if(diff>0){
    if(pi<0||diff>d.transactions[pi].amount)return false;
    const p=d.transactions[pi];p.amount-=diff;p.lastUpdated=now;
    if(p.amount===0)d.transactions.splice(pi,1);
  }else{
    if(pi>=0){const p=d.transactions[pi];p.amount-=diff;p.lastUpdated=now}
    else d.transactions.splice(i+1,0,{subId:nid('s'),amount:-diff,status:'PENDING',lastUpdated:now});
  }
  t.amount=newAmt;t.lastUpdated=now;recompute(d);return true;
}
function dRestore(d,sid,now){
  const i=d.transactions.findIndex(x=>x.subId===sid),t=d.transactions[i];
  if(!t||t.status!=='PAID')return false;
  const pi=d.transactions.findIndex(x=>x.status==='PENDING');
  if(pi>=0){const p=d.transactions[pi];p.amount+=t.amount;p.lastUpdated=now;d.transactions.splice(i,1)}
  else{t.status='PENDING';t.lastUpdated=now}
  recompute(d);return true;
}

async function sha(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

}

  const prev=wq[gid]||Promise.resolve();

    const g=JSON.parse(JSON.stringify(cur));
    if(fn(g)===false)return false;
    g.rev=(cur.rev||0)+1;

function diffGame(a,b){
  const ch=[],J=JSON.stringify,pa=a.players||{},pb=b.players||{};
  new Set([...Object.keys(pa),...Object.keys(pb)]).forEach(k=>{const x=pa[k]||null,y=pb[k]||null;if(J(x)!==J(y))ch.push({k:'p:'+k,b:x,a:y})});
  const da={},dbb={};(a.debts||[]).forEach(d=>da[d.debtId]=d);(b.debts||[]).forEach(d=>dbb[d.debtId]=d);
  new Set([...Object.keys(da),...Object.keys(dbb)]).forEach(k=>{const x=da[k]||null,y=dbb[k]||null;if(J(x)!==J(y))ch.push({k:'d:'+k,b:x,a:y})});
  return ch;
}
const hGet=(g,k)=>{const id=k.slice(2);return k[0]==='p'?((g.players||{})[id]||null):((g.debts||[]).find(d=>d.debtId===id)||null)};
function hSet(g,k,v){
  const id=k.slice(2),c=v?JSON.parse(JSON.stringify(v)):null;
  if(k[0]==='p'){g.players=g.players||{};if(c)g.players[id]=c;else delete g.players[id];return}
  g.debts=g.debts||[];const i=g.debts.findIndex(d=>d.debtId===id);
  if(c){if(i>=0)g.debts[i]=c;else g.debts.push(c)}else if(i>=0)g.debts.splice(i,1);
}
const hWho=c=>{const o=c.a||c.b||{};return c.k[0]==='p'?o.playerName:`${o.fromPlayerName} → ${o.toPlayerName}`};
const hWhoAll=e=>[...new Set(e.ch.map(hWho))].join(', ');
function undoWhy(g,e){
  if(!e)return 'Modifica non trovata';
  if(e.undone)return 'Questa modifica è già stata annullata';
  if(g.status==='closed'&&e.ch.some(c=>c.k[0]==='p'))return 'La partita è chiusa: i movimenti della serata non si possono più annullare';
  const J=JSON.stringify,idx=(g.hist||[]).indexOf(e);
  for(const c of e.ch){
    if(J(hGet(g,c.k))!==J(c.a)){
      const later=(g.hist||[]).slice(idx+1).some(x=>!x.undone&&x.ch.some(y=>y.k===c.k));
      return later?`Prima annulla le modifiche più recenti su ${hWho(c)}`:`${hWho(c)} è stato modificato nel frattempo: non posso annullare`;
    }
  }
  return '';
}
function undoEntry(gid,hid){
  let why='',msg='';
  return saveGame(gid,g=>{
    const e=(g.hist||[]).find(x=>x.id===hid);
    why=undoWhy(g,e);if(why)return false;
    e.ch.forEach(c=>hSet(g,c.k,c.b));msg=e.msg;
    e.undone={at:new Date().toISOString(),by:S.me?S.me.name:''};
  }).then(ok=>{if(ok)toast('Annullato: '+msg,'ok');else if(why)toast(why,'err');return ok});
}
function histCan(gid,g,e){
  if(e.undone)return false;
  if(e.ch.every(c=>c.k[0]==='d'))return e.ch.every(c=>debtPerm(gid,c.a||c.b).can);

async function doAuth(){
  const a=F.auth,name=a.name.trim(),lk=name.toLowerCase();
  const fail=m=>{a.err=m;render()};
  const ent=Object.entries(S.players).find(([id,p])=>String(p.name).toLowerCase()===lk);
  if(a.mode==='login'){
    if(!ent)return fail('Nome utente non trovato. Se è la prima volta, tocca Registrati.');
    const [id,p]=ent;
    if(!p.pinHash)return fail('Questo nome non ha ancora un PIN: tocca Registrati per sceglierlo.');
    if((await pinHash(id,a.pin))!==p.pinHash)return fail('Nome utente o PIN errati.');
    return enterAs(id,p.name);
  }
  if(name.length<2)return fail('Il nome utente deve avere almeno 2 caratteri.');
  if(lk==='dealer')return fail('Questo nome utente è riservato.');
  if(!PIN_RE.test(a.pin))return fail('Il PIN deve avere da 4 a 6 cifre.');
  if(a.pin!==a.pin2)return fail('I due PIN non coincidono.');
  if(ent&&ent[1].pinHash)return fail('Nome utente già registrato: tocca Accedi.');
  const id=ent?ent[0]:nid('p'),now=new Date().toISOString();
  const doc=Object.assign({},ent?ent[1]:{name,createdAt:now},{pinHash:await pinHash(id,a.pin),registeredAt:now});
  try{await db.doc('players/'+id).set(doc)}catch(e){return fail(errMsg(e))}
  S.players[id]=doc;if(!hasManagers())saveCfg({managers:((S.cfg&&S.cfg.managers)||[]).filter(x=>S.players[x]).concat([id])});enterAs(id,doc.name);
}

function playerStats(k){
  const gs=Object.entries(S.games).map(([id,g])=>Object.assign({id},g)).filter(g=>g.status==='closed').sort((a,b)=>String(a.scheduledAt).localeCompare(String(b.scheduledAt)));
  const rows=[];let name='';
  gs.forEach(g=>{const p=plist(g).find(x=>x.playerName.trim().toLowerCase()===k);if(!p)return;name=p.playerName;rows.push({gid:g.id,at:g.scheduledAt,net:p.netCents||0,inv:inv(p),buys:p.buyIns.length,n:plist(g).length})});
  const tot=sum(rows.map(r=>r.net)),wins=rows.filter(r=>r.net>0).length,invT=sum(rows.map(r=>r.inv));
  let streak=0,sk=rows.length?Math.sign(rows[rows.length-1].net):0;
  if(sk!==0)for(let i=rows.length-1;i>=0&&Math.sign(rows[i].net)===sk;i--)streak++;
  const best=rows.reduce((a,r)=>!a||r.net>a.net?r:a,null),worst=rows.reduce((a,r)=>!a||r.net<a.net?r:a,null);
  return {name,rows,tot,wins,invT,streak,sk,best,worst,avg:rows.length?Math.round(tot/rows.length):0,buys:rows.length?sum(rows.map(r=>r.buys))/rows.length:0};
}
function spark(rows){
  const W=320,H=150,P={l:8,r:8,t:14,b:14};
  let c=0;const pts=[{v:0,t:'Inizio',n:null}].concat(rows.map(r=>{c+=r.net;return {v:c,t:dShort(r.at),n:r.net}}));
  const vs=pts.map(p=>p.v),mn=Math.min(0,...vs),mx=Math.max(0,...vs),rng=(mx-mn)||1;
  const x=i=>P.l+(W-P.l-P.r)*(i/(pts.length-1)),y=v=>P.t+(H-P.t-P.b)*(1-(v-mn)/rng);
  const data=pts.map((p,i)=>({x:+x(i).toFixed(1),y:+y(p.v).toFixed(1),t:p.t,v:p.v,n:p.n}));
  const d=data.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' '),last=data[data.length-1],y0=y(0).toFixed(1);
  return `<div class="mut sm" id="spk-read" style="min-height:22px">Tocca il grafico per vedere ogni serata</div>
<svg class="spark" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Andamento del bilancio, oggi ${sgn(last.v)}" data-pts="${esc(JSON.stringify(data))}">
<line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="rgba(255,255,255,.25)" stroke-width="1" stroke-dasharray="3 4"/>
<path d="${d}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="${last.x}" cy="${last.y}" r="5" fill="var(--gold)" stroke="#1B1F36" stroke-width="2"/>
<circle class="spk-dot" r="6" cx="-30" cy="-30" fill="var(--ivory)" stroke="#1B1F36" stroke-width="2"/></svg>`;
}

async function createGame(){

  rs.forEach((r,i)=>{players[r.id]={playerId:r.id,playerName:r.name,seq:i+1,buyIns:[{buyInId:nid('b'),amountCents:v.buy,paymentStatus:n.pstatus,timestamp:now}],cashOuts:[],cashOutCents:null,netCents:null}});

/* --- Chiusura cassa --- */
function startClose(){
  const g=S.games[V.gid];const d=g.dealerChips||0;
  F.cl={step:1,dealer:d?(d/100).toFixed(2).replace('.',','):'',vals:{},holeMode:'split_all'};
  plist(g).forEach(p=>{F.cl.vals[p.playerId]={mode:'chips',v:''}});
  go('close',V.gid);
}

  if(g.status==='closed')return vLive();

    return `<div class="wrap">${head}<p class="mut sm num" style="margin:0 0 12px">Per ogni giocatore inserisci quante fiches ha davanti (esclusi i cash out già messi al sicuro). Cambio: ${eur(g.buyInCents)} = ${fch(g.chipsPerBuyIn)} fiches</p>

${L.map(p=>{const v=cl.vals[p.playerId]||{mode:'chips',v:''},s=safeOf(p);return `<div class="card stack" style="gap:12px"><div class="row">${ava(p.playerName)}<div class="grow"><div class="pl-name">${esc(p.playerName)}</div><div class="mut sm num">ha investito ${eur(inv(p))}</div></div></div>

<div class="row"><input class="in big-n" id="cv-${p.playerId}" inputmode="decimal" data-bind="cl.vals.${p.playerId}.v" value="${esc(v.v)}" placeholder="${v.mode==='chips'?'Fiches':'Euro'}">
<div class="seg"><button class="${v.mode==='chips'?'on':''}" data-act="clmode" data-pid="${p.playerId}" data-m="chips">Fiches</button><button class="${v.mode==='eur'?'on':''}" data-act="clmode" data-pid="${p.playerId}" data-m="eur">€</button></div></div>
<button class="link" data-act="lost" data-pid="${p.playerId}" style="align-self:flex-start;min-height:40px">Ha perso tutto (0)</button></div>`}).join('')}

    const b=c.bal;
    return `<div class="wrap">${head}<div class="stack">

<div class="row sp"><b>Bilancio cassa</b><b style="font-family:var(--serif);font-size:22px" class="${b===0?'green':b<0?'red':'gold'}">${b===0?eur(0):sgn(b)}</b></div></div>
${b===0?'<div class="box g"><b class="green">✅ Cassa Perfetta!</b><div class="sm">Ogni fiche sul tavolo corrisponde ai soldi raccolti.</div></div>':''}

<div class="two"><button class="btn ghost" data-act="clback">←</button><button class="btn" data-act="clsave">Salva e chiudi partita</button></div></div></div>`;

async function saveClose(){
  const gid=V.gid;const cl=F.cl;
  const ok=await saveGame(gid,g=>{
    const c=calcClose(g,cl);if(!c.ok)return false;
    const now=new Date().toISOString();
    c.rows.forEach((r,i)=>{const p=g.players[r.p.playerId];p.cashOutCents=r.fin;p.netCents=c.nets[i].net});
    g.holeCents=-c.bal;g.holeMode=c.bal<0?cl.holeMode:c.bal>0?'split_all':'';g.dealerChips=c.dealer;
    g.debts=c.tx.map((t,i)=>({debtId:'debt_'+(i+1)+'_'+Math.random().toString(36).slice(2,5),fromPlayerName:t.from,toPlayerName:t.to,fromPlayerId:t.fromId,toPlayerId:t.toId,totalAmount:t.amt,paidAmount:0,remainingAmount:t.amt,transactions:[{subId:nid('s'),amount:t.amt,status:'PENDING',lastUpdated:now}]}));
    g.status='closed';g.closedAt=now;
  });
  if(ok){if(LS.get('active',null)===gid)LS.del('active');F.cl=null;go('detail',gid);toast('Partita chiusa','ok')}
}

/* --- Dettaglio --- */
function waText(gid){
  const g=S.games[gid],L=plist(g).slice().sort((a,b)=>(b.netCents||0)-(a.netCents||0));
  let t=`♠️ *Home Poker — Resoconto*\n📅 ${dShort(g.scheduledAt)}\n👥 ${L.length} giocatori · Montepremi ${eur(netPot(g))}\n`;
  if((g.dealerChips||0)>0)t+=`🃏 Mance dealer: ${eur(g.dealerChips)} (già sottratte dal montepremi)\n`;
  t+=`\n*Risultati netti*\n`+L.map(p=>`• ${p.playerName}: ${sgn(p.netCents||0)}`).join('\n');
  t+=`\n\n*Saldi da fare*\n`;
  t+=(g.debts&&g.debts.length)?g.debts.map(d=>`• ${d.fromPlayerName} → ${d.toPlayerName}: ${eur(d.totalAmount)}  ${d.remainingAmount===0?'✅ pagato':`(pagati ${eur(d.paidAmount)}, restano ${eur(d.remainingAmount)})`}`).join('\n'):'• Nessuna transazione necessaria ✅';
  return t;
}
function jsonFor(gid){
  const g=S.games[gid],E=c=>Math.round(c)/100;
  return {session:{sessionId:gid,hostName:g.hostName,scheduledAt:g.scheduledAt,dealerChips:E(g.dealerChips||0),maxSeats:g.maxSeats,reservations:resSorted().map((r,i)=>({playerId:r.playerId||null,playerName:r.playerName,reservedAt:r.reservedAt,priorityOrder:i+1}))},
  buyIns:plist(g).flatMap(p=>p.buyIns.map(b=>({buyInId:b.buyInId,playerId:p.playerId,amount:E(b.amountCents),paymentStatus:b.paymentStatus,timestamp:b.timestamp}))),
  debts:(g.debts||[]).map(d=>({debtId:d.debtId,fromPlayerName:d.fromPlayerName,toPlayerName:d.toPlayerName,totalAmount:E(d.totalAmount),paidAmount:E(d.paidAmount),remainingAmount:E(d.remainingAmount),transactions:d.transactions.map(t=>({subId:t.subId,amount:E(t.amount),status:t.status,lastUpdated:t.lastUpdated}))}))};
}
const isDealerD=d=>d.toPlayerId==='dealer'||String(d.toPlayerName)==='Dealer';
const avaN=(n,s)=>n==='Dealer'?`<span class="ava ${s||''}" style="--h:45"><i>🃏</i></span>`:ava(n,s);
const meIsFrom=d=>!!S.me&&(d.fromPlayerId?d.fromPlayerId===S.me.id:String(d.fromPlayerName).toLowerCase()===S.me.name.toLowerCase());

  return `<div class="debt ${done?'done':''} ${mine||toMe?'me':''}">
<div class="row" style="gap:10px"><div class="pair">${avaN(d.fromPlayerName,'s')}<span class="arr">${ico('chevr',16)}</span>${avaN(d.toPlayerName,'s')}</div>
<div class="grow"><div class="dl"><b>${mine?'Tu':esc(d.fromPlayerName)}</b> <span class="mut">${mine?'dai a':'dà a'}</span> <b>${toMe?'te':esc(d.toPlayerName)}</b></div><div style="margin-top:4px">${st}</div></div>

${!perm.can&&!done&&!mine?`<div class="mut xs" style="margin-top:8px">Lo segna come ricevuto ${isDealerD(d)?'chi ha avviato la partita':esc(d.toPlayerName)}.</div>`:''}</div>`;

async function deleteGame(gid){
  try{
    const sn=await db.collection('games/'+gid+'/reservations').get();
    for(const d of sn.docs)await db.doc(`games/${gid}/reservations/${d.id}`).delete();
    await db.doc('games/'+gid).delete();
  }catch(e){toast(errMsg(e),'err');return}
  delete S.games[gid];if(LS.get('active',null)===gid)LS.del('active');
  go('home');toast('Partita eliminata','ok');
}

async function addBuyIn(pid,name){
  const gid=V.gid,b=F.bi,amt=b.custom?parseEur(b.cv):b.amt;
  if(!(amt>0))return;
  const bi={buyInId:nid('b'),amountCents:amt,paymentStatus:b.status,timestamp:new Date().toISOString()};
  const ok=await saveGame(gid,gg=>{if(!gg.players[pid])return false;gg.players[pid].buyIns.push(bi)},'Re-buy registrato');
  if(ok){SH=null;render()}
}
async function seatMany(){
  const g=S.games[V.gid],ts=targetsFrom(F.ap.sel,F.ap.names);if(!ts.length)return;
  const b=F.bi,amt=b.custom?parseEur(b.cv):b.amt;if(!(amt>0))return;
  let rs;try{rs=await ensurePlayers(ts)}catch(e){toast(errMsg(e),'err');return}
  const now=new Date().toISOString();let rebuys=0;
  const ok=await saveGame(V.gid,gg=>{
    rebuys=0;
    rs.forEach(r=>{
      const ex=Object.values(gg.players).find(p=>p.playerId===r.id||p.playerName.toLowerCase()===r.name.toLowerCase());
      const bi={buyInId:nid('b'),amountCents:amt,paymentStatus:b.status,timestamp:now};
      if(ex){ex.buyIns.push(bi);rebuys++}
      else{gg.seq=(gg.seq||0)+1;gg.players[r.id]={playerId:r.id,playerName:r.name,seq:gg.seq,buyIns:[bi],cashOuts:[],cashOutCents:null,netCents:null}}
    });
  },()=>rebuys===rs.length?'Re-buy registrati':rs.length>1?`${rs.length} giocatori al tavolo`:'Giocatore al tavolo');
  if(ok){SH=null;F.ap={sel:{},names:''};render()}
}
function playedBefore(pid,name){return Object.values(S.games).some(g=>Object.values(g.players||{}).some(p=>p.playerId===pid||p.playerName.toLowerCase()===name.toLowerCase()))}
async function delPlayerOk(id){
  const p=S.players[id];if(!p)return;
  if(p.pinHash){SH={type:'add',anim:false};render();toast(`${p.name} ha un profilo registrato: non si può eliminare dalla rubrica.`,'err');return}
  if(playedBefore(id,p.name)){SH={type:'add',anim:false};render();toast(`${p.name} ha già partecipato a una o più partite: eliminarlo farebbe perdere lo storico.`,'err');return}
  try{await db.doc('players/'+id).delete();delete S.players[id]}catch(e){toast(errMsg(e),'err');return}

/* ===== Face ID / impronta (WebAuthn, solo sblocco su questo telefono) ===== */
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
async function bioSupport(){try{return !!(window.isSecureContext&&window.PublicKeyCredential&&navigator.credentials&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}}
async function bioEnroll(){
  const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Home Poker'},user:{id:new TextEncoder().encode(S.me.id),name:S.me.name,displayName:S.me.name},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000,attestation:'none'}});
  const token=[...crypto.getRandomValues(new Uint8Array(24))].map(x=>x.toString(16).padStart(2,'0')).join('');
  return {cred:b64(cred.rawId),token};
}
async function bioAssert(cred){
  await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(cred)}],userVerification:'required',timeout:60000}});
  return true;
}
const bioHash=(id,token)=>sha('hplbio:'+id+':'+token);
async function bioFresh(p){
  const b=bioMine();if(!b||!p||!bioFreshUi())return false;
  const h=await bioHash(b.id,b.token);return (p.bio||[]).some(x=>x.h===h);
}

/* ===== Archivio Supabase (un database condiviso, diviso per tavolo) ===== */
const SB_URL='https://nqlywzjhxykrfyrpkjdw.supabase.co';
const SB_KEY='sb_publishable_n_Cesb7VT2ipKa0y9SntYA_zkn4ABgn';
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ko(new Error('Script non caricato'));document.head.appendChild(s)})}
const clone=o=>JSON.parse(JSON.stringify(o));
const parentOf=p=>p.split('/').slice(0,-1).join('/');
let BASE=null;
async function makeBase(){
  await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js');
  const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'hpl-auth'}});
  const T='hpl_docs';
  const {data:sd}=await sb.auth.getSession();
  if(!sd||!sd.session){
    const r=await sb.auth.signInAnonymously();
    if(r.error){const m=String(r.error.message||'');throw new Error(/anonymous/i.test(m)?'Accesso anonimo disattivato in Supabase: attiva "Allow anonymous sign-ins" in Authentication → Sign In / Providers.':m)}
  }
  async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args);if(error)throw error;return data}
  async function getDoc(path){const {data,error}=await sb.from(T).select('data').eq('path',path).maybeSingle();if(error)throw error;return data?data.data:null}
  async function scope(prefix){
    const cache=new Map(),subs=new Set(),pre=prefix+'/';
    const notify=()=>subs.forEach(f=>{try{f()}catch(e){console.error(e)}});
    const sig=()=>{let x='';[...cache.keys()].sort().forEach(k=>{x+=k+JSON.stringify(cache.get(k))});return x};
    async function loadAll(){const {data,error}=await sb.from(T).select('path,data').like('path',pre+'%');if(error)throw error;cache.clear();data.forEach(r=>cache.set(r.path,r.data))}
    async function refresh(){try{const a=sig();await loadAll();if(sig()!==a)notify()}catch(e){}}
    await loadAll();
    const ch=sb.channel('hpl-'+prefix).on('postgres_changes',{event:'*',schema:'public',table:T},pl=>{
      if(pl.eventType==='DELETE'){const p=pl.old&&pl.old.path;if(p&&p.startsWith(pre)){cache.delete(p);notify()}}
      else if(pl.new&&pl.new.path.startsWith(pre)){cache.set(pl.new.path,pl.new.data);notify()}
    }).subscribe();
    const iv=setInterval(refresh,20000);
    const vis=()=>{if(!document.hidden)refresh()};document.addEventListener('visibilitychange',vis);
    const snapDoc=p=>({id:p.split('/').pop(),exists:cache.has(pre+p),data:()=>cache.has(pre+p)?clone(cache.get(pre+p)):undefined});
    const colDocs=c=>[...cache.keys()].filter(k=>parentOf(k)===pre+c).sort().map(k=>snapDoc(k.slice(pre.length)));
    const watch=(fn,cb)=>{const f=()=>cb(fn());subs.add(f);setTimeout(f,0);return()=>subs.delete(f)};
    const put=async(p,d)=>{const {error}=await sb.from(T).upsert({path:pre+p,parent:parentOf(pre+p),data:d,updated_at:new Date().toISOString()});if(error)throw error;cache.set(pre+p,clone(d));notify()};
    const doc=p=>({id:p.split('/').pop(),path:p,
      async get(){const d=await getDoc(pre+p);if(d)cache.set(pre+p,d);else cache.delete(pre+p);return snapDoc(p)},
      async set(d){await put(p,d)},
      async update(d){await put(p,Object.assign({},cache.get(pre+p)||{},clone(d)))},
      async delete(){const {error}=await sb.from(T).delete().eq('path',pre+p);if(error)throw error;cache.delete(pre+p);notify()},
      onSnapshot(cb){return watch(()=>snapDoc(p),cb)}});
    const collection=c=>({path:c,doc:id=>doc(c+'/'+id),
      async get(){await refresh();const d=colDocs(c);return {docs:d,size:d.length}},
      onSnapshot(cb){return watch(()=>{const d=colDocs(c);return {docs:d,size:d.length,empty:!d.length}},cb)}});
    return {doc,collection,close(){clearInterval(iv);document.removeEventListener('visibilitychange',vis);try{sb.removeChannel(ch)}catch(e){}}};
  }
  return {getDoc,rpc,scope};
}

/* ===== Tavolo: entra o crea ===== */
async function enterTable(t){
  db=await BASE.scope('t/'+t.id);
  S.table={id:t.id,name:t.name};S.dbReady=true;
  const onErr=e=>{toast(errMsg(e),'err')};
  db.collection('games').onSnapshot(sn=>{const o={};sn.docs.forEach(d=>{o[d.id]=d.data()});S.games=o;S.loaded.games=true;afterData()},onErr);
  db.doc('settings/table').onSnapshot(sn=>{S.cfg=sn.exists?sn.data():null;if(S.loaded.players)render()},onErr);
  db.collection('players').onSnapshot(sn=>{const o={};sn.docs.forEach(d=>{o[d.id]=d.data()});S.players=o;S.loaded.players=true;afterData()},onErr);
  render();
}
async function doTable(){
  const t=F.tb,create=t.mode==='create',name=t.name.trim().replace(/\s+/g,' ');
  const fail=m=>{t.err=m;t.busy=false;render()};
  if(name.length<2)return fail('Il nome del tavolo deve avere almeno 2 caratteri.');
  if(t.pw.length<4)return fail('La password deve avere almeno 4 caratteri.');
  if(create&&t.pw!==t.pw2)return fail('Le due password non coincidono.');
  t.busy=true;t.err='';render();
  try{
    const id='t'+(await sha('hpltn:'+name.toLowerCase())).slice(0,20);let shown=name;
    if(create){
      const r=await BASE.rpc('hpl_create_table',{tid:id,tname:name,pw:t.pw});
      if(r==='exists')return fail('Esiste già un tavolo con questo nome: tocca Entra, oppure scegli un altro nome.');
      if(r!=='ok')return fail('Non sono riuscito a creare il tavolo, riprova.');
    }else{
      const r=await BASE.rpc('hpl_join_table',{tid:id,pw:t.pw});
      if(!r||r.status==='not_found')return fail('Nessun tavolo con questo nome. Controlla come è scritto, oppure creane uno.');
      if(r.status==='bad_password')return fail('Password errata.');
      if(r.status==='too_many')return fail('Troppi tentativi sbagliati: riprova tra qualche minuto.');
      shown=r.name;
    }
    LS.set('table',{id});LS.set('lasttb',shown);
    F.tb={mode:null,name:'',pw:'',pw2:'',err:'',busy:false};
    await enterTable({id,name:shown});
  }catch(e){fail(errMsg(e))}
}

/* ===== Aggiornamento automatico (anche per l'app installata sul telefono) ===== */
const APP_VERSION='1791805446736';
let updShown=false;
async function checkUpdate(){
  if(updShown||!/^https?:/.test(location.protocol))return;
  try{
    const r=await fetch(location.pathname+'?vcheck='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=(await r.text()).match(/const APP_VERSION='(\d+)'/);
    if(!m||m[1]===APP_VERSION)return;
    updShown=true;const nv=m[1];
    const go=()=>location.replace(location.pathname+'?v='+nv+location.hash);
    if(!S.me&&!SH){go();return}
    const el=document.createElement('div');el.className='upd';
    el.innerHTML='<span>È disponibile una nuova versione</span><button type="button">Aggiorna</button>';
    el.querySelector('button').onclick=go;document.body.appendChild(el);
  }catch(e){}
}
setTimeout(checkUpdate,2500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
setInterval(checkUpdate,15*60*1000);

(async function start(){
  render();
  if(SB_URL.indexOf('__')===0){S.dbReady=false;render();return}
  try{BASE=await makeBase()}catch(e){console.error(e);window.__dbErr=(e&&(e.message||e.details||e.code))||String(e);S.dbReady=false;render();return}
  S.dbReady=true;S.baseReady=true;

    LS.del('table');
  }
  render();
})();
