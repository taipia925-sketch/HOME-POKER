name: Pubblica funzioni Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy hpl-holdem
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Manca il secret SUPABASE_ACCESS_TOKEN (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          supabase functions deploy hpl-holdem --project-ref nqlywzjhxykrfyrpkjdw --use-api
